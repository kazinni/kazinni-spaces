<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ca8a04">
<meta name="color-scheme" content="light">
<title>Workspace · Janta</title>
<link rel="icon" type="image/x-icon" href="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview-1.png">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://api.fontshare.com/v2/css?v=2&f[]=satoshi@400,500,600,700,800,900&f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#ca8a04;--gold-dark:#a16207;--gold-soft:#fef3c7;
  --gold-gradient:linear-gradient(135deg,#ca8a04 0%,#eab308 50%,#fbbf24 100%);
  --ink:#0f0f1e;--success:#10b981;--danger:#ef4444;--info:#3b82f6;--warning:#f59e0b;
  --text-primary:#0f0f1e;--text-secondary:#4a4a5e;--text-muted:#6b7280;
  --border-light:#e9ecef;--surface:#fff;--surface-2:#faf9f7;--surface-3:#f4f3f1;
  --m365-hover:#f3f2f1;--m365-border:#edebe9;--m365-text:#323130;
  --m365-shadow:0 6.4px 14.4px 0 rgba(0,0,0,0.132),0 1.2px 3.6px 0 rgba(0,0,0,0.108);
  --header-h:60px;--rail-w:232px;--rail-w-collapsed:68px;
  --font-display:'Clash Display','Satoshi',sans-serif;
  --font-heading:'Satoshi','Clash Display',sans-serif;
  --font-body:'Satoshi',-apple-system,BlinkMacSystemFont,sans-serif;
  --radius-pill:100px;
  --t-fast:.1s cubic-bezier(.2,.8,.2,1);
  --t-base:.2s cubic-bezier(.2,.8,.2,1);
  --t-slow:.3s cubic-bezier(.2,.8,.2,1);
  --shadow-sm:0 1px 2px 0 rgba(0,0,0,.03);
  --ws-accent:#107c10;
  --ws-accent-light:#34d399;
  --ws-accent-soft:#f0fdf4;
  --ws-hero-bg:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 40%,#bbf7d0 100%);
  --ws-hero-border:rgba(16,124,16,.15);
  --ws-hero-chip-border:rgba(16,124,16,.18);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);background:var(--surface-2);color:var(--text-primary);line-height:1.6;letter-spacing:-.005em;overflow-x:hidden;min-height:100vh}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ws-accent);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}50%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}
@keyframes gradientShift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes popIn{from{opacity:0;transform:translateY(-4px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes orb{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-40px) scale(1.05)}66%{transform:translate(-30px,30px) scale(.95)}}
@keyframes spin{to{transform:rotate(360deg)}}

.ws-header{position:sticky;top:0;z-index:1000;height:var(--header-h);background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--m365-border);padding:0 1rem;display:flex;align-items:center}
.ws-header-inner{width:100%;display:flex;align-items:center;gap:1rem}
.ws-logo{display:flex;align-items:center;gap:.55rem;text-decoration:none;flex-shrink:0}
.ws-logo img{height:30px}
.ws-logo-text{font-family:var(--font-display);font-weight:700;font-size:1.5rem;letter-spacing:-.045em;background:var(--gold-gradient);background-size:200% 200%;animation:gradientShift 8s ease infinite;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ws-rail-toggle{width:36px;height:36px;border-radius:6px;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--m365-text);transition:background var(--t-fast)}
.ws-rail-toggle:hover{background:var(--m365-hover)}
.ws-search{flex:1;max-width:520px;position:relative}
.ws-search input{width:100%;padding:.5rem 2.3rem .5rem 2.3rem;border-radius:4px;border:1px solid var(--border-light);background:var(--surface-3);font-family:var(--font-body);font-size:.85rem;transition:all var(--t-fast)}
.ws-search input:focus{outline:none;background:#fff;border-color:var(--ws-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--ws-accent) 12%,transparent)}
.ws-search > i.fa-magnifying-glass{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.8rem;pointer-events:none}
.ws-search-clear{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:4px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:.75rem}
.ws-search-clear:hover{background:var(--m365-hover);color:var(--ink)}
.ws-search-clear.visible{display:flex}
.ws-search-hint{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--m365-border);border-radius:8px;box-shadow:var(--m365-shadow);max-height:360px;overflow-y:auto;display:none;z-index:1100;animation:popIn .15s}
.ws-search-hint.active{display:block}
.ws-search-hint-group{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);padding:.7rem .9rem .35rem;font-family:var(--font-heading)}
.ws-search-hint-item{display:flex;align-items:center;gap:.65rem;padding:.55rem .9rem;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background var(--t-fast);font-family:var(--font-body)}
.ws-search-hint-item:hover{background:var(--m365-hover)}
.ws-search-hint-thumb{width:36px;height:36px;border-radius:4px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--ws-accent);font-size:.85rem}
.ws-search-hint-thumb img{width:100%;height:100%;object-fit:cover}
.ws-search-hint-body{flex:1;min-width:0}
.ws-search-hint-title{font-family:var(--font-heading);font-size:.82rem;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-search-hint-meta{font-size:.7rem;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-search-hint-empty{padding:2rem 1rem;text-align:center;font-size:.82rem;color:var(--text-muted);font-family:var(--font-heading)}
.ws-search-hint-empty i{display:block;font-size:1.4rem;color:var(--ws-accent);opacity:.4;margin-bottom:.5rem}
.ws-header-right{margin-left:auto;display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.ws-icon-btn{width:38px;height:38px;border-radius:4px;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--m365-text);font-size:.95rem;transition:background var(--t-fast);position:relative}
.ws-icon-btn:hover{background:var(--m365-hover)}
.ws-waffle{width:38px;height:38px;border-radius:4px;background:transparent;border:none;cursor:pointer;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;padding:9px;transition:background var(--t-fast)}
.ws-waffle:hover{background:var(--m365-hover)}
.ws-waffle span{width:4px;height:4px;border-radius:1px;background:var(--m365-text);justify-self:center;align-self:center}
.ws-account-btn{display:flex;align-items:center;gap:.55rem;padding:.25rem .7rem .25rem .25rem;border-radius:4px;border:1px solid transparent;background:transparent;cursor:pointer;transition:background var(--t-fast)}
.ws-account-btn:hover{background:var(--m365-hover);border-color:var(--m365-border)}
.ws-avatar{width:32px;height:32px;border-radius:50%;background:var(--gold-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;font-family:var(--font-heading)}
.ws-account-name{font-size:.82rem;font-weight:600;color:var(--m365-text);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-heading)}
.ws-btn{padding:.6rem 1.3rem;border:none;border-radius:var(--radius-pill);font-weight:600;font-size:.85rem;cursor:pointer;transition:all var(--t-base);text-decoration:none;display:inline-flex;align-items:center;gap:.5rem;font-family:var(--font-heading);white-space:nowrap}
.ws-btn-primary{background:var(--ink);color:#fff;box-shadow:0 4px 14px rgba(15,15,30,.18);position:relative;overflow:hidden}
.ws-btn-primary::before{content:'';position:absolute;inset:0;background:var(--gold-gradient);opacity:0;transition:opacity var(--t-base)}
.ws-btn-primary>*{position:relative;z-index:1}
.ws-btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(202,138,4,.3)}
.ws-btn-primary:hover::before{opacity:1}
.ws-btn-ghost{background:#fff;color:var(--ws-accent);border:1.5px solid color-mix(in srgb,var(--ws-accent) 25%,transparent);box-shadow:none}

body.mode-workspace{background:var(--surface-2)}
body.mode-workspace .ws-shell{display:grid;grid-template-columns:var(--rail-w) 1fr;min-height:calc(100vh - var(--header-h));transition:grid-template-columns var(--t-base)}
body.mode-workspace.rail-collapsed .ws-shell{grid-template-columns:var(--rail-w-collapsed) 1fr}
.ws-rail{background:var(--surface);border-right:1px solid var(--m365-border);padding:.85rem .6rem;display:flex;flex-direction:column;gap:.15rem;overflow-y:auto;position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));height:calc(100dvh - var(--header-h))}
.rail-group{display:flex;flex-direction:column;gap:.15rem;padding:.35rem 0}
.rail-group + .rail-group{border-top:1px solid var(--m365-border);margin-top:.3rem;padding-top:.65rem}
.rail-label{font-family:var(--font-heading);font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);padding:.55rem .85rem .35rem;white-space:nowrap;overflow:hidden}
body.rail-collapsed .rail-label{opacity:0;height:0;padding:0}
.rail-item{display:flex;align-items:center;gap:.75rem;padding:.6rem .85rem;border-radius:4px;color:var(--text-secondary);text-decoration:none;font-family:var(--font-heading);font-size:.85rem;font-weight:500;transition:all var(--t-fast);cursor:pointer;background:none;border:none;width:100%;text-align:left;white-space:nowrap;position:relative}
.rail-item:hover{background:var(--m365-hover);color:var(--ink)}
.rail-item.active{background:color-mix(in srgb,var(--ws-accent) 8%,transparent);color:var(--ws-accent);font-weight:600}
.rail-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--ws-accent);border-radius:2px}
.rail-item i{width:18px;text-align:center;font-size:.92rem;color:var(--text-muted);transition:color var(--t-fast);flex-shrink:0}
.rail-item:hover i,.rail-item.active i{color:var(--ws-accent)}
.rail-item .rail-item-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
body.rail-collapsed .rail-item .rail-item-name{display:none}
body.rail-collapsed .rail-item{justify-content:center;padding:.7rem 0}
body.rail-collapsed .rail-item i{font-size:1rem}
.rail-spacer{flex:1}

.ws-content{padding:1.75rem 2rem;max-width:1500px;width:100%;margin:0 auto}
body.rail-collapsed .ws-content{padding:1.75rem 2.5rem}

.ff-hero{position:relative;overflow:hidden;border-radius:12px;background:var(--ws-hero-bg);border:1px solid var(--ws-hero-border);padding:2rem 2rem 1.8rem;margin-bottom:1.6rem}
.ff-hero-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ff-hero-bg .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4}
.ff-hero-bg .orb-1{width:340px;height:340px;background:var(--ws-accent-light);top:-100px;left:-80px;animation:orb 24s ease-in-out infinite}
.ff-hero-bg .orb-2{width:280px;height:280px;background:var(--ws-accent);bottom:-100px;right:-60px;opacity:.2;animation:orb 28s ease-in-out infinite;animation-delay:-8s}
.ff-hero-inner{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:2rem;flex-wrap:wrap}
.ff-hero-left{max-width:640px}
.ff-eyebrow{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .85rem;background:#fff;border:1px solid var(--ws-hero-chip-border);border-radius:var(--radius-pill);font-size:.68rem;font-weight:700;color:var(--ws-accent);margin-bottom:1rem;font-family:var(--font-heading);text-transform:uppercase;letter-spacing:1px}
.ff-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulseDot 2s infinite}
.ff-hero h1{font-family:var(--font-display);font-size:clamp(1.9rem,3vw,2.6rem);font-weight:700;letter-spacing:-.035em;line-height:1.1;margin-bottom:.6rem}
.ff-hero h1 .accent{color:var(--ws-accent)}
.ff-hero-lede{font-size:.95rem;color:var(--text-secondary);line-height:1.6;max-width:560px;margin-bottom:1.2rem}
.ff-hero-chips{display:flex;gap:.4rem;flex-wrap:wrap}
.ff-chip{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .7rem;background:#fff;border:1px solid var(--ws-hero-chip-border);border-radius:var(--radius-pill);font-family:var(--font-heading);font-size:.72rem;font-weight:600;color:var(--text-secondary)}
.ff-chip i{color:var(--ws-accent);font-size:.7rem}
.ff-hero-actions{display:flex;flex-direction:column;gap:.5rem;flex-shrink:0}
.ff-hero-actions .ws-btn{padding:.55rem 1.1rem;font-size:.8rem}

.ff-section{margin-bottom:1.8rem}
.ff-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem;gap:1rem;flex-wrap:wrap}
.ff-section-title{font-family:var(--font-heading);font-size:.95rem;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:.5rem}
.ff-section-title i{color:var(--ws-accent);font-size:.85rem}
.ff-section-action{font-family:var(--font-heading);font-size:.76rem;font-weight:600;color:var(--ws-accent);text-decoration:none;cursor:pointer;background:none;border:none}
.ff-section-action:hover{color:var(--gold)}

.ff-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem}
.ff-kpi{background:#fff;border:1px solid var(--m365-border);border-radius:8px;padding:1.1rem 1.15rem 1rem;position:relative;overflow:hidden;transition:all var(--t-base)}
.ff-kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--ws-accent);transform:scaleX(0);transform-origin:left;transition:transform var(--t-slow)}
.ff-kpi:hover::before{transform:scaleX(1)}
.ff-kpi:hover{transform:translateY(-2px);box-shadow:var(--m365-shadow)}
.ff-kpi-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem}
.ff-kpi-icon{width:34px;height:34px;border-radius:6px;background:var(--ws-accent-soft);color:var(--ws-accent);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.ff-kpi-icon.amber{background:#fffbeb;color:var(--gold-dark)}
.ff-kpi-icon.blue{background:#eff6ff;color:var(--info)}
.ff-kpi-icon.rose{background:#fef2f2;color:var(--danger)}
.ff-kpi-delta{font-family:var(--font-heading);font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:var(--radius-pill)}
.ff-kpi-delta.up{background:#dcfce7;color:#166534}
.ff-kpi-delta.down{background:#fee2e2;color:#991b1b}
.ff-kpi-delta.flat{background:var(--surface-3);color:var(--text-muted)}
.ff-kpi-value{font-family:var(--font-display);font-size:1.7rem;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-bottom:.25rem}
.ff-kpi-value.loading{width:60%;height:1.7rem;border-radius:6px;color:transparent;background:linear-gradient(90deg,#f0f0f0 25%,#fafafa 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.6s infinite}
.ff-kpi-label{font-family:var(--font-heading);font-size:.68rem;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px}
.ff-kpi-sub{font-size:.7rem;color:var(--text-muted);margin-top:.35rem;font-family:var(--font-heading)}

.ff-chart-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:.9rem}
.ff-chart-grid.three{grid-template-columns:repeat(3,1fr)}
.ff-card{background:#fff;border:1px solid var(--m365-border);border-radius:8px;padding:1.1rem 1.2rem;display:flex;flex-direction:column;min-height:280px}
.ff-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem;gap:.7rem}
.ff-card-title{font-family:var(--font-heading);font-size:.85rem;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:.5rem}
.ff-card-title i{color:var(--ws-accent);font-size:.8rem}
.ff-card-meta{font-family:var(--font-heading);font-size:.7rem;font-weight:600;color:var(--text-muted)}
.ff-canvas-wrap{position:relative;flex:1;min-height:200px;display:flex;align-items:center;justify-content:center}
.ff-canvas-wrap canvas{max-width:100%;max-height:100%}

.ff-table-wrap{background:#fff;border:1px solid var(--m365-border);border-radius:8px;overflow:hidden}
.ff-toolbar{display:flex;align-items:center;justify-content:space-between;gap:.7rem;padding:.75rem 1rem;border-bottom:1px solid var(--m365-border);background:#faf9f8;flex-wrap:wrap}
.ff-tabs{display:flex;gap:.2rem;flex-wrap:wrap}
.ff-tab{padding:.4rem .75rem;border-radius:4px;border:1px solid transparent;background:transparent;font-family:var(--font-heading);font-size:.75rem;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all var(--t-fast)}
.ff-tab:hover{background:var(--m365-hover);color:var(--ink)}
.ff-tab.active{background:#fff;color:var(--ws-accent);border-color:color-mix(in srgb,var(--ws-accent) 25%,transparent);box-shadow:var(--shadow-sm)}
.ff-search{position:relative}
.ff-search input{padding:.4rem .75rem .4rem 1.9rem;border-radius:4px;border:1px solid var(--border-light);background:#fff;font-family:var(--font-body);font-size:.78rem;transition:all var(--t-fast);width:240px}
.ff-search input:focus{outline:none;border-color:var(--ws-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--ws-accent) 12%,transparent)}
.ff-search i{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.72rem;pointer-events:none}

.ff-table{width:100%;border-collapse:collapse;font-size:.82rem}
.ff-table th{text-align:left;font-family:var(--font-heading);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);padding:.7rem 1rem;border-bottom:1px solid var(--m365-border);background:#faf9f8;white-space:nowrap}
.ff-table td{padding:.7rem 1rem;border-bottom:1px solid var(--m365-border);color:var(--text-secondary);vertical-align:middle}
.ff-table tr:last-child td{border-bottom:none}
.ff-table tbody tr:hover{background:var(--m365-hover)}
.ff-table .cell-primary{color:var(--ink);font-weight:600;font-family:var(--font-heading)}
.ff-table .cell-muted{color:var(--text-muted);font-size:.76rem}
.ff-table .cell-num{text-align:right;font-family:var(--font-heading);font-weight:600;color:var(--ink);white-space:nowrap}
.ff-table-empty{padding:2.5rem 1rem;text-align:center;color:var(--text-muted);font-family:var(--font-heading);font-size:.82rem}
.ff-table-empty i{font-size:1.5rem;color:var(--ws-accent);opacity:.4;display:block;margin-bottom:.5rem}

.ff-status{display:inline-flex;align-items:center;gap:.3rem;padding:2px 8px;border-radius:var(--radius-pill);font-family:var(--font-heading);font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.ff-status .tag-dot{width:5px;height:5px;border-radius:50%}
.ff-status.delivered{background:#dcfce7;color:#166534}.ff-status.delivered .tag-dot{background:#16a34a}
.ff-status.new{background:#dbeafe;color:#1e40af}.ff-status.new .tag-dot{background:#2563eb}
.ff-status.shipped{background:#fef3c7;color:#92400e}.ff-status.shipped .tag-dot{background:#d97706}
.ff-status.cancelled{background:#fee2e2;color:#991b1b}.ff-status.cancelled .tag-dot{background:#dc2626}
.ff-status.pending{background:#f3f4f6;color:#4b5563}.ff-status.pending .tag-dot{background:#9ca3af}

.ff-product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.9rem;padding:1rem}
.ff-product-card{background:#fff;border:1px solid var(--m365-border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:all var(--t-base);cursor:pointer}
.ff-product-card:hover{transform:translateY(-3px);box-shadow:var(--m365-shadow);border-color:color-mix(in srgb,var(--ws-accent) 28%,transparent)}
.ff-product-card:hover .ff-product-img img{transform:scale(1.06)}

function showToast(msg, type = 'success') {
  const c = document.getElementById('toastContainer');
  if (!c) return;
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span></span>`;
  t.querySelector('span').textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.classList.add('leaving'); setTimeout(() => t.remove(), 400); }, 4000);
}

function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeRegex(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function highlightMatch(text, query) {
  if (!query || !text) return escapeHtml(text);
  const safe = escapeHtml(text);
  const re = new RegExp(`(${escapeRegex(query)})`, 'ig');
  return safe.replace(re, '<span class="ff-product-highlight">$1</span>');
}
function formatKes(n) {
  const v = Number(n) || 0;
  if (v >= 1000000) return 'KSh ' + (v / 1000000).toFixed(2) + 'M';
  if (v >= 1000) return 'KSh ' + (v / 1000).toFixed(1) + 'K';
  return 'KSh ' + v.toLocaleString();
}
function formatKesExact(n) { return 'KSh ' + (Number(n) || 0).toLocaleString(); }
function formatDate(ts) {
  if (!ts) return '—';
  try { return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
  catch (e) { return '—'; }
}
function getInitials(name) {
  if (!name) return '?';
  const p = String(name).trim().split(/[\s._-]+/).filter(Boolean);
  if (!p.length) return '?';
  if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
  return (p[0][0] + p[p.length - 1][0]).toUpperCase();
}
function pluralize(n, w) { return `${n} ${w}${n === 1 ? '' : 's'}`; }
function statusLabel(s) {
  const v = String(s || 'pending').toLowerCase();
  const map = { new: 'New', pending: 'Pending', confirmed: 'Confirmed', shipped: 'Shipped', delivered: 'Delivered', cancelled: 'Cancelled', processing: 'Processing', fulfilled: 'Fulfilled' };
  return map[v] || v;
}
function statusClass(s) {
  const v = String(s || 'pending').toLowerCase();
  if (['delivered', 'fulfilled'].includes(v)) return 'delivered';
  if (['cancelled', 'rejected'].includes(v)) return 'cancelled';
  if (['shipped', 'in_transit', 'out-for-delivery'].includes(v)) return 'shipped';
  if (v === 'new') return 'new';
  return 'pending';
}
function stockClass(stock) {
  const s = Number(stock);
  if (!s && s !== 0) return '';
  if (s <= 0) return 'out';
  if (s < 10) return 'low';
  return '';
}
function stockLabel(stock) {
  const s = Number(stock);
  if (s === 0 || isNaN(s)) return 'Out of stock';
  if (s < 10) return `Low · ${s}`;
  return `${s} in stock`;
}
function productImage(p) {
  if (!p || !WS) return null;
  const fields = WS.fields.productImages || ['imageUrl','image','img'];
  for (const f of fields) {
    const v = p[f];
    if (v && typeof v === 'string' && /^https?:\/\//.test(v.trim())) return v.trim();
  }
  return null;
}

/* ============================================================
   GLOBAL SEARCH
   ============================================================ */
function setupGlobalSearch() {
  const input = document.getElementById('wsSearch');
  const clear = document.getElementById('wsSearchClear');
  const hint = document.getElementById('wsSearchHint');
  if (!input || !hint) return;

  input.placeholder = `Search ${WS.name}…`;
  input.addEventListener('input', () => {
    clearTimeout(globalSearchDebounce);
    const q = input.value.trim();
    if (clear) clear.classList.toggle('visible', !!q);
    if (!q) { closeGlobalSearch(); return; }
    globalSearchDebounce = setTimeout(() => renderGlobalSearchHint(q), 140);
  });
  input.addEventListener('focus', () => { const q = input.value.trim(); if (q) renderGlobalSearchHint(q); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); const q = input.value.trim(); if (q) jumpToFirstResult(q); }
  });
  if (clear) clear.addEventListener('click', () => {
    input.value = ''; clear.classList.remove('visible'); closeGlobalSearch(); input.focus();
  });
  document.addEventListener('click', (e) => {
    const wrap = document.getElementById('wsSearchWrap');
    if (wrap && !wrap.contains(e.target)) closeGlobalSearch();
  });
}

function renderGlobalSearchHint(query) {
  const hint = document.getElementById('wsSearchHint');
  const input = document.getElementById('wsSearch');
  if (!hint || !input) return;
  const q = query.toLowerCase();
  const clientField = WS.fields.clientName;

  const productMatches = allProducts.filter(p => {
    const hay = [p.name, p[WS.fields.productCategory], p[WS.fields.productSupplier], p[WS.fields.productUnit]].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  }).slice(0, 4);

  const orderMatches = allOrders.filter(o => {
    const hay = [o[clientField], o.contactPerson, o.phone, o.location, ...(o.products || []).map(x => x.name)].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  }).slice(0, 3);

  if (!productMatches.length && !orderMatches.length) {
    hint.innerHTML = `<div class="ws-search-hint-empty"><i class="fas fa-magnifying-glass"></i><div>No matches for "${escapeHtml(query)}"</div></div>`;
    hint.classList.add('active');
    input.setAttribute('aria-expanded', 'true');
    return;
  }

  let html = '';
  if (productMatches.length) {
    html += `<div class="ws-search-hint-group">Products</div>`;
    html += productMatches.map(p => {
      const img = productImage(p);
      const thumb = img
        ? `<div class="ws-search-hint-thumb"><img src="${escapeHtml(img)}" alt="" loading="lazy" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\\"fas ${WS.catalogue.placeholderIcon}\\"></i>';"></div>`
        : `<div class="ws-search-hint-thumb"><i class="fas ${WS.catalogue.placeholderIcon}"></i></div>`;
      return `<button type="button" class="ws-search-hint-item" onclick="focusProduct('${escapeHtml(p.id)}')">
        ${thumb}
        <div class="ws-search-hint-body">
          <div class="ws-search-hint-title">${highlightMatch(p.name, query)}</div>
          <div class="ws-search-hint-meta">${escapeHtml(p[WS.fields.productCategory] || '')} · ${formatKesExact(p[WS.fields.productPrice])}</div>
        </div>
      </button>`;
    }).join('');
  }
  if (orderMatches.length) {
    html += `<div class="ws-search-hint-group">Orders</div>`;
    html += orderMatches.map(o => `
      <button type="button" class="ws-search-hint-item" onclick="focusOrder('${escapeHtml(o.id)}')">
        <div class="ws-search-hint-thumb"><i class="fas fa-box"></i></div>
        <div class="ws-search-hint-body">
          <div class="ws-search-hint-title">${highlightMatch(o[clientField] || 'Order', query)}</div>
          <div class="ws-search-hint-meta">${formatKes(o[WS.fields.orderTotal])} · ${statusLabel(o.status)}</div>
        </div>
      </button>
    `).join('');
  }
  hint.innerHTML = html;
  hint.classList.add('active');
  input.setAttribute('aria-expanded', 'true');
}

function closeGlobalSearch() {
  const hint = document.getElementById('wsSearchHint');
  const input = document.getElementById('wsSearch');
  if (hint) hint.classList.remove('active');
  if (input) input.setAttribute('aria-expanded', 'false');
}

function focusProduct(id) {
  closeGlobalSearch();
  const p = allProducts.find(x => x.id === id);
  if (!p) return;
  clearProductSearch();
  scrollToSection('products');
  setTimeout(() => openLightbox(p), 200);
}
function focusOrder(id) {
  closeGlobalSearch();
  const o = allOrders.find(x => x.id === id);
  if (!o) return;
  const s = document.getElementById('ffOrderSearch');
  if (s) s.value = '';
  orderSearchQuery = '';
  activeOrderFilter = 'all';
  document.querySelectorAll('#ffOrderTabs .ff-tab').forEach(t => t.classList.toggle('active', t.dataset.filter === 'all'));
  applyOrderFilter();
  scrollToSection('orders');
}
function jumpToFirstResult(query) {
  const q = query.toLowerCase();
  const clientField = WS.fields.clientName;
  const p = allProducts.find(x => [x.name, x[WS.fields.productCategory]].filter(Boolean).join(' ').toLowerCase().includes(q));
  if (p) { focusProduct(p.id); return; }
  const o = allOrders.find(x => [x[clientField], x.contactPerson].filter(Boolean).join(' ').toLowerCase().includes(q));
  if (o) { focusOrder(o.id); return; }
  showToast(`No matches for "${query}"`, 'info');
  closeGlobalSearch();
}

   FILTERS

function setupOrderFilters() {
  const tabWrap = document.getElementById('ffOrderTabs');
  if (tabWrap) {
    tabWrap.querySelectorAll('.ff-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        tabWrap.querySelectorAll('.ff-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeOrderFilter = tab.dataset.filter || 'all';
        applyOrderFilter();
      });
    });
  }
  const search = document.getElementById('ffOrderSearch');
  if (search) {
    search.addEventListener('input', () => {
      clearTimeout(orderSearchDebounce);
      orderSearchDebounce = setTimeout(() => {
        orderSearchQuery = search.value.trim().toLowerCase();
        applyOrderFilter();
      }, FF.searchDebounceMs);
    });
  }
}
function applyOrderFilter() {
  const clientField = WS.fields.clientName;
  filteredOrders = allOrders.filter(o => {
    const s = String(o.status || 'new').toLowerCase();
    if (activeOrderFilter !== 'all' && s !== activeOrderFilter) {
      if (activeOrderFilter === 'pending' && !['pending','processing','confirmed'].includes(s)) return false;
      if (activeOrderFilter === 'delivered' && !['delivered','fulfilled'].includes(s)) return false;
      if (activeOrderFilter === 'cancelled' && !['cancelled','rejected'].includes(s)) return false;
      if (!['pending','delivered','cancelled'].includes(activeOrderFilter) && s !== activeOrderFilter) return false;
    }
    if (orderSearchQuery) {
      const hay = [o[clientField], o.contactPerson, o.phone, o.location, ...(o.products || []).map(x => x.name)].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(orderSearchQuery)) return false;
    }
    return true;
  });
  renderOrderTable();
}

function setupProductFilters() {
  const search = document.getElementById('ffProductSearch');
  if (search) {
    search.addEventListener('input', () => {
      clearTimeout(productSearchDebounce);
      productSearchDebounce = setTimeout(() => {
        productSearchQuery = search.value.trim().toLowerCase();
        applyProductFilter();
      }, FF.searchDebounceMs);
    });
  }
}
function buildProductCategoryTabs() {
  const container = document.getElementById('ffProductTabs');
  if (!container) return;
  const catField = WS.fields.productCategory;
  const cats = Array.from(new Set(allProducts.map(p => String(p[catField] || '').trim()).filter(Boolean))).sort();
  let html = `<button type="button" class="ff-tab ${activeProductCategory === 'all' ? 'active' : ''}" data-cat="all">All <span style="opacity:.6;font-weight:500;">(${allProducts.length})</span></button>`;
  html += cats.map(c => {
    const count = allProducts.filter(p => String(p[catField] || '').trim() === c).length;
    return `<button type="button" class="ff-tab ${activeProductCategory === c ? 'active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)} <span style="opacity:.6;font-weight:500;">(${count})</span></button>`;
  }).join('');
  container.innerHTML = html;
  container.querySelectorAll('.ff-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      container.querySelectorAll('.ff-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeProductCategory = tab.dataset.cat || 'all';
      applyProductFilter();
    });
  });
}
function applyProductFilter() {
  const catField = WS.fields.productCategory;
  const supField = WS.fields.productSupplier;
  filteredProducts = allProducts.filter(p => {
    if (activeProductCategory !== 'all' && String(p[catField] || '').trim() !== activeProductCategory) return false;
    if (productSearchQuery) {
      const hay = [p.name, p[catField], p[supField], p[WS.fields.productUnit], p.sku].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(productSearchQuery)) return false;
    }
    return true;
  });
  renderProductGrid();
}
function clearProductSearch() {
  const s = document.getElementById('ffProductSearch');
  if (s) s.value = '';
  productSearchQuery = '';
  activeProductCategory = 'all';
  document.querySelectorAll('#ffProductTabs .ff-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === 'all'));
  applyProductFilter();
}

/* ============================================================

   ============================================================ */
function bootFirebase() {
  if (typeof firebase === 'undefined') { showToast('Could not load Firebase', 'error'); return; }
  try { if (!firebase.apps.length) firebase.initializeApp(firebaseConfig); } catch (e) {}
  const auth = firebase.auth();
  const db = firebase.database();
  window._auth = auth; window._db = db;
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
  auth.onAuthStateChanged(handleAuth);
}

async function handleAuth(user) {
  const db = window._db;
  if (!user) {
    currentUser = null;
    renderAccountButton();
    showToast('Sign in to view this workspace', 'info');
    setTimeout(() => { location.href = 'index.html'; }, 1500);
    return;
  }
  currentUser = user;
  try {
    const snap = await db.ref(`workspacePermissions/${user.uid}`).once('value');
    currentPerms = snap.exists() ? (snap.val() || {}) : {};
  } catch (e) { currentPerms = {}; }

  renderAccountButton();

  const hasPerm = currentPerms[WS.permission] === true
    || currentPerms[WS.permission] === 'true'
    || currentPerms.admins === true;

  if (!hasPerm) {
    showToast(`You do not have access to ${WS.name}`, 'error');
    setTimeout(() => { location.href = 'index.html'; }, 1500);
    return;
  }

  await loadAll();
  renderWorkspace();
}

function renderAccountButton() {
  const c = document.getElementById('headerAccount');
  if (!c) return;
  if (!currentUser) {
    c.innerHTML = `<a href="index.html" class="ws-btn ws-btn-primary"><i class="fas fa-arrow-right-to-bracket"></i><span>Sign in</span></a>`;
    return;
  }
  const name = currentUser.displayName || (currentUser.email ? currentUser.email.split('@')[0] : 'User');
  c.innerHTML = `
    <div style="position:relative;">
      <button type="button" class="ws-account-btn" onclick="location.href='account.html'" aria-label="Account">
        <div class="ws-avatar">${escapeHtml(getInitials(name))}</div>
        <span class="ws-account-name">${escapeHtml(name)}</span>
      </button>
    </div>`;
}

/* ============================================================
   LOADERS (generic — uses WS.paths + WS.fields)
   ============================================================ */
async function loadAll(manual = false) {
  if (!window._db || !currentUser) return;
  if (manual) showToast('Refreshing…', 'info');
  await Promise.all([loadOrders(), loadProducts(), loadSuppliers()]);
  buildProductCategoryTabs();
  applyOrderFilter();
  applyProductFilter();
  renderSupplierGrid();
  updateKpis();
  renderCharts();
}

async function loadOrders() {
  const db = window._db;
  try {
    const snap = await db.ref(WS.paths.orders).once('value');
    const val = snap.val() || {};
    allOrders = Object.entries(val).map(([id, o]) => ({
      id, ...o,
      _total: Number(o[WS.fields.orderTotal] || o.total || o.amount || 0),
      products: Array.isArray(o.products) ? o.products : Object.values(o.products || o.items || {}),
      _ts: Number(o.createdAt || o.updatedAt || o.timestamp || o.orderDate) || 0
    })).sort((a, b) => b._ts - a._ts);
  } catch (e) { console.warn('orders read failed:', e); allOrders = []; }
}

async function loadProducts() {
  const db = window._db;
  try {
    const snap = await db.ref(WS.paths.products).once('value');
    const val = snap.val() || {};
    allProducts = Object.entries(val).map(([id, p]) => ({ id, ...p, name: p.name || p.title || 'Unnamed' }));
  } catch (e) { console.warn('products read failed:', e); allProducts = []; }
}

async function loadSuppliers() {
  const db = window._db;
  if (!WS.paths.suppliers) { allSuppliers = []; return; }
  try {
    const snap = await db.ref(WS.paths.suppliers).once('value');
    const val = snap.val() || {};
    allSuppliers = Object.entries(val).map(([id, s]) => ({ id, ...s, name: s.name || s.fullName || 'Supplier', status: s.status || 'active' }));
  } catch (e) { console.warn('suppliers read failed:', e); allSuppliers = []; }
}

function renderWorkspace() {
  const content = document.getElementById('wsContent');
  if (!content) return;

/* ============================================================
   RENDER — ORDERS
   ============================================================ */
function renderOrderTable() {
  const body = document.getElementById('ffOrdersBody');
  const count = document.getElementById('ffOrdersCount');
  if (count) count.textContent = pluralize(allOrders.length, 'order');
  if (!body) return;
  if (!filteredOrders.length) {
    body.innerHTML = `<tr><td colspan="6" class="ff-table-empty"><i class="fas fa-inbox"></i>No orders</td></tr>`;
    return;
  }
  const clientField = WS.fields.clientName;
  body.innerHTML = filteredOrders.slice(0, FF.tablePageSize).map(o => {
    const items = o.products || [];
    const itemCount = items.reduce((s, p) => s + (Number(p.quantity) || 1), 0);
    const itemLabel = items.slice(0, 2).map(p => p.name).filter(Boolean).join(', ');
    const more = items.length > 2 ? ` +${items.length - 2} more` : '';
    return `<tr>
      <td><span class="cell-primary">${escapeHtml((o.id || '').slice(-6).toUpperCase())}</span></td>
      <td><span class="cell-primary">${escapeHtml(o[clientField] || '—')}</span></td>
      <td><span class="cell-muted">${itemCount} item${itemCount === 1 ? '' : 's'}</span><br><span class="cell-muted">${escapeHtml(itemLabel)}${escapeHtml(more)}</span></td>
      <td class="cell-num">${formatKesExact(o._total)}</td>
      <td><span class="ff-status ${statusClass(o.status)}"><span class="tag-dot"></span>${escapeHtml(statusLabel(o.status))}</span></td>
      <td><span class="cell-muted">${escapeHtml(formatDate(o._ts))}</span></td>
    </tr>`;
  }).join('');
}

/* ============================================================
   RENDER — PRODUCTS
   ============================================================ */
function renderProductGrid() {
  const grid = document.getElementById('ffProductGrid');
  const empty = document.getElementById('ffProductEmpty');
  const count = document.getElementById('ffProductsCount');
  if (count) count.textContent = `${filteredProducts.length} of ${allProducts.length} ${WS.catalogue.singular}s`;
  if (!grid) return;

  if (!filteredProducts.length) {
    grid.innerHTML = '';
    if (empty) empty.hidden = false;
    return;
  }
  if (empty) empty.hidden = true;

  const catField = WS.fields.productCategory;
  const supField = WS.fields.productSupplier;
  const priceField = WS.fields.productPrice;
  const unitField = WS.fields.productUnit;
  const stockField = WS.fields.productStock;

  grid.innerHTML = filteredProducts.map(p => {
    const img = productImage(p);
    const stockCls = stockClass(p[stockField]);
    const stockTxt = stockLabel(p[stockField]);
    const badge = p.isActive === false ? `<span class="ff-product-badge inactive">Inactive</span>` : '';
    const media = img
      ? `<img src="${escapeHtml(img)}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\\"fas ${WS.catalogue.placeholderIcon} ff-product-placeholder\\"></i>';">`
      : `<i class="fas ${WS.catalogue.placeholderIcon} ff-product-placeholder"></i>`;
    return `<article class="ff-product-card" role="listitem" tabindex="0" onclick="openLightboxById('${escapeHtml(p.id)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openLightboxById('${escapeHtml(p.id)}')}">
      <div class="ff-product-img">${badge}${media}</div>
      <div class="ff-product-body">
        <div class="ff-product-name">${highlightMatch(p.name, productSearchQuery)}</div>
        ${p[catField] ? `<div class="ff-product-cat"><i class="fas fa-tag"></i>${escapeHtml(p[catField])}</div>` : ''}
        ${p[supField] ? `<div class="ff-product-supplier"><i class="fas fa-truck-field" style="font-size:.6rem;margin-right:3px;"></i>${escapeHtml(p[supField])}</div>` : ''}
        <div class="ff-product-foot">
          ${p[priceField] !== undefined ? `<div class="ff-product-price">${formatKesExact(p[priceField])}${p[unitField] ? `<span class="ff-product-unit">/ ${escapeHtml(p[unitField])}</span>` : ''}</div>` : ''}
          ${p[stockField] !== undefined ? `<span class="ff-product-stock ${stockCls}">${escapeHtml(stockTxt)}</span>` : ''}
        </div>
      </div>
    </article>`;
  }).join('');
}

/* ============================================================
   KPIs
   ============================================================ */
function updateKpis() {
  const clientField = WS.fields.clientName;
  WS.kpis.forEach((k, i) => {
    const el = document.getElementById(`kpi_${i}`);
    if (!el) return;
    let val = '—';
    switch (k.source) {
      case 'orders.count': val = String(allOrders.length); break;
      case 'orders.sumTotal': {
        const sum = allOrders.reduce((s, o) => s + (o._total || 0), 0);
        val = k.format === 'kes' ? formatKes(sum) : String(sum);
        break;
      }
      case 'orders.uniqueClient': {
        val = String(new Set(allOrders.map(o => o[clientField]).filter(Boolean)).size);
        break;
      }
      case 'products.count': val = String(allProducts.length); break;
      case 'suppliers.countActive': val = String(allSuppliers.filter(s => (s.status || 'active') === 'active').length); break;
    }
    el.textContent = val;
  });
}

/* ============================================================
   CHARTS
   ============================================================ */
function destroyCharts() { activeCharts.forEach(c => { try { c.destroy(); } catch (e) {} }); activeCharts = []; }

function renderCharts() {
  if (typeof Chart === 'undefined') return;
  destroyCharts();
  const styles = getComputedStyle(document.documentElement);
  const accent = styles.getPropertyValue('--ws-accent').trim() || '#107c10';
  const accentLight = styles.getPropertyValue('--ws-accent-light').trim() || '#34d399';
  const border = styles.getPropertyValue('--m365-border').trim() || '#edebe9';
  const muted = styles.getPropertyValue('--text-muted').trim() || '#6b7280';
  const ink = styles.getPropertyValue('--ink').trim() || '#0f0f1e';
  const clientField = WS.fields.clientName;

  Chart.defaults.font.family = "'Satoshi','Clash Display',system-ui,sans-serif";
  Chart.defaults.font.size = 11;
  Chart.defaults.color = muted;

  if (WS.charts.includes('revenue')) {
    const ctx = document.getElementById('chartRev');
    if (ctx) {
      const days = FF.chartDays;
      const buckets = {};
      for (let i = days - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); buckets[d.toISOString().slice(0,10)] = 0; }
      allOrders.forEach(o => { if (!o._ts) return; const k = new Date(o._ts).toISOString().slice(0,10); if (k in buckets) buckets[k] += o._total || 0; });
      const labels = Object.keys(buckets).map(k => new Date(k).toLocaleDateString('en-US',{month:'short',day:'numeric'}));
      const values = Object.values(buckets);
      const meta = document.getElementById('metaRev');
      if (meta) meta.textContent = formatKes(values.reduce((s,v)=>s+v,0)) + ' total';
      activeCharts.push(new Chart(ctx, {
        type: 'line',
        data: { labels, datasets: [{ data: values, borderColor: accent, backgroundColor: accent + '20', borderWidth: 2, tension: .35, fill: true, pointRadius: 2, pointBackgroundColor: accentLight }] },
        options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 7 } }, y: { beginAtZero: true, grid: { color: border }, ticks: { callback: v => formatKes(v) } } }, plugins: { legend: { display: false }, tooltip: { backgroundColor: ink, padding: 10, cornerRadius: 6, callbacks: { label: c => ' ' + formatKes(c.parsed.y) } } } }
      }));
    }
  }

  if (WS.charts.includes('status')) {
    const ctx = document.getElementById('chartStatus');
    if (ctx) {
      const counts = {};
      allOrders.forEach(o => { const s = String(o.status || 'new').toLowerCase(); counts[s] = (counts[s] || 0) + 1; });
      const labels = Object.keys(counts);
      const values = Object.values(counts);
      const meta = document.getElementById('metaStatus');
      if (meta) meta.textContent = pluralize(allOrders.length, 'order');
      activeCharts.push(new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data: values, backgroundColor: [accent,'#f59e0b','#16a34a','#dc2626','#3b82f6','#8b5cf6'], borderWidth: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, cutout: '68%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, padding: 12 } }, tooltip: { backgroundColor: ink, padding: 10, cornerRadius: 6 } } }
      }));
    }
  }

  if (WS.charts.includes('topProducts')) {
    const ctx = document.getElementById('chartProd');
    if (ctx) {
      const agg = {};
      allOrders.forEach(o => (o.products || []).forEach(p => {
        const n = p.name || 'Unknown';
        agg[n] = (agg[n] || 0) + ((Number(p.price) || Number(p.unitPrice) || 0) * (Number(p.quantity) || 1));
      }));
      const sorted = Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,6);
      if (sorted.length) {
        activeCharts.push(new Chart(ctx, {
          type: 'bar',
          data: { labels: sorted.map(([k]) => k.length > 16 ? k.slice(0,14)+'…' : k), datasets: [{ data: sorted.map(([,v])=>v), backgroundColor: accent, borderRadius: 4, barThickness: 12 }] },
          options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { beginAtZero: true, grid: { color: border }, ticks: { callback: v => formatKes(v) } }, y: { grid: { display: false } } }, plugins: { legend: { display: false }, tooltip: { backgroundColor: ink, padding: 10, cornerRadius: 6, callbacks: { label: c => ' ' + formatKes(c.parsed.x) } } } }
        }));
      } else {
        ctx.parentElement.innerHTML = '<div style="color:var(--text-muted);font-size:.78rem;font-family:var(--font-heading);">No product data yet</div>';
      }
    }
  }

  if (WS.charts.includes('topClients')) {
    const ctx = document.getElementById('chartClient');
    if (ctx) {
      const agg = {};
      allOrders.forEach(o => { const n = o[clientField] || 'Unknown'; agg[n] = (agg[n] || 0) + 1; });
      const sorted = Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,6);
      if (sorted.length) {
        activeCharts.push(new Chart(ctx, {
          type: 'bar',
          data: { labels: sorted.map(([k]) => k.length > 16 ? k.slice(0,14)+'…' : k), datasets: [{ data: sorted.map(([,v])=>v), backgroundColor: accent, borderRadius: 4, barThickness: 12 }] },
          options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { beginAtZero: true, grid: { color: border }, ticks: { precision: 0 } }, y: { grid: { display: false } } }, plugins: { legend: { display: false }, tooltip: { backgroundColor: ink, padding: 10, cornerRadius: 6 } } }
        }));
      } else {
        ctx.parentElement.innerHTML = '<div style="color:var(--text-muted);font-size:.78rem;font-family:var(--font-heading);">No customer data yet</div>';
      }
    }
  }

  if (WS.charts.includes('performance')) {
    const ctx = document.getElementById('chartPerf');
    if (ctx) {
      const days = FF.chartDays;
      const buckets = {};
      for (let i = days - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); buckets[d.toISOString().slice(0,10)] = { ok: 0, total: 0 }; }
      allOrders.forEach(o => { if (!o._ts) return; const k = new Date(o._ts).toISOString().slice(0,10); if (!(k in buckets)) return; buckets[k].total++; if (['delivered','fulfilled'].includes(String(o.status).toLowerCase())) buckets[k].ok++; });
      const labels = Object.keys(buckets).map(k => new Date(k).toLocaleDateString('en-US',{month:'short',day:'numeric'}));
      const values = Object.keys(buckets).map(k => { const b = buckets[k]; return b.total ? Math.round((b.ok/b.total)*100) : 0; });
      activeCharts.push(new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets: [{ data: values, backgroundColor: accent, borderRadius: 4, barThickness: 12 }] },
        options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 7 } }, y: { beginAtZero: true, max: 100, grid: { color: border }, ticks: { callback: v => v + '%' } } }, plugins: { legend: { display: false }, tooltip: { backgroundColor: ink, padding: 10, cornerRadius: 6, callbacks: { label: c => ' ' + c.parsed.y + '%' } } } }
      }));
    }
  }
}

/* ============================================================
   LIGHTBOX
   ============================================================ */
function setupLightbox() {
  const lb = document.getElementById('ffLightbox');
  if (lb) lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
}
function openLightboxById(id) {
  const p = allProducts.find(x => x.id === id);
  if (p) openLightbox(p);
}
function openLightbox(product) {
  const lb = document.getElementById('ffLightbox');
  const media = document.getElementById('ffLightboxMedia');
  const title = document.getElementById('ffLightboxTitle');
  const meta = document.getElementById('ffLightboxMeta');
  const price = document.getElementById('ffLightboxPrice');
  const desc = document.getElementById('ffLightboxDesc');
  if (!lb || !media) return;
  lastFocusedBeforeLightbox = document.activeElement;
  activeLightboxProduct = product;

  const img = productImage(product);
  media.innerHTML = img
    ? `<img src="${escapeHtml(img)}" alt="${escapeHtml(product.name)}" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\\"fas ${WS.catalogue.placeholderIcon} ff-product-placeholder\\"></i>';">`
    : `<i class="fas ${WS.catalogue.placeholderIcon} ff-product-placeholder"></i>`;

  title.textContent = product.name || 'Product';
  const catField = WS.fields.productCategory;
  const supField = WS.fields.productSupplier;
  const parts = [];
  if (product[catField]) parts.push(`<span style="text-transform:capitalize;"><i class="fas fa-tag" style="color:var(--ws-accent);margin-right:4px;font-size:.7rem;"></i>${escapeHtml(product[catField])}</span>`);
  if (product[supField]) parts.push(`<span><i class="fas fa-truck-field" style="color:var(--ws-accent);margin-right:4px;font-size:.7rem;"></i>${escapeHtml(product[supField])}</span>`);
  if (product.sku) parts.push(`<span style="font-family:monospace;font-size:.72rem;color:var(--text-muted);">SKU ${escapeHtml(product.sku)}</span>`);
  const stockCls = stockClass(product[WS.fields.productStock]);
  parts.push(`<span class="ff-product-stock ${stockCls}">${escapeHtml(stockLabel(product[WS.fields.productStock]))}</span>`);
  meta.innerHTML = parts.join('');

  const priceField = WS.fields.productPrice;
  const unitField = WS.fields.productUnit;
  if (product[priceField] !== undefined) {
    price.innerHTML = `${formatKesExact(product[priceField])}${product[unitField] ? `<span class="unit">/ ${escapeHtml(product[unitField])}</span>` : ''}`;
  } else {
    price.innerHTML = '';
  }

  const d = product.description || product.desc || product.longDesc || '';
  desc.innerHTML = d ? escapeHtml(String(d)).replace(/\n/g, '<br>') : '';
  desc.style.display = d ? 'block' : 'none';

  lb.classList.add('active');
  lb.setAttribute('aria-hidden', 'false');
  setTimeout(() => { const b = lb.querySelector('.ff-lightbox-close'); if (b) b.focus(); }, 40);
}
function closeLightbox() {
  const lb = document.getElementById('ffLightbox');
  if (lb) { lb.classList.remove('active'); lb.setAttribute('aria-hidden', 'true'); }
  activeLightboxProduct = null;
  if (lastFocusedBeforeLightbox && typeof lastFocusedBeforeLightbox.focus === 'function') {
    try { lastFocusedBeforeLightbox.focus(); } catch (e) {}
  }
  lastFocusedBeforeLightbox = null;
}

window.addEventListener('beforeunload', destroyCharts);
</script>
