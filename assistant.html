<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ca8a04">
<meta name="color-scheme" content="light">
<meta name="description" content="Janta Assistant — search every service and product across your workspaces.">
<title>Janta Assistant</title>
<link rel="icon" href="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview-1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://api.fontshare.com/v2/css?v=2&f[]=cabinet-grotesk@400,500,600,700,800&f[]=satoshi@400,500,600,700,800,900&f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #ffffff;
  --bg-soft: #faf9f7;
  --bg-softer: #f4f3f1;
  --line: #edebe9;
  --line-2: #e1dfdb;
  --text: #1a1a1e;
  --text-soft: #4a4a5e;
  --text-muted: #8a8a94;
  --accent: #ca8a04;
  --accent-dark: #a16207;
  --accent-light: #fbbf24;
  --accent-soft: #fef3c7;
  --ink: #0f0f1e;
  --danger: #b91c1c;
  --success: #10b981;
  --info: #3b82f6;
  --huduma: #1e40af;
  --purple: #8b5cf6;
  --green: #107c10;
  --pink: #ec4899;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --sans: 'Satoshi', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --serif: 'Clash Display', Georgia, serif;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.03);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.09);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
a{color:var(--accent);text-decoration:none}

/* HEADER */
header{
  border-bottom:1px solid var(--line);padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,0.95);backdrop-filter:blur(12px) saturate(180%);
  -webkit-backdrop-filter:blur(12px) saturate(180%);z-index:20;flex-shrink:0;
}
.header-left{display:flex;align-items:center;gap:10px}
.back-link{
  color:var(--text-muted);text-decoration:none;font-size:0.9rem;
  width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  transition:background 0.15s,color 0.15s;
}
.back-link:hover{background:var(--bg-softer);color:var(--ink)}
.brand{
  font-family:var(--serif);font-size:1.2rem;font-weight:700;
  letter-spacing:-0.03em;color:var(--ink);display:flex;align-items:center;gap:6px;
}
.brand .dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulseDot 2s infinite}
.brand .accent{
  background:linear-gradient(135deg,#ca8a04,#fbbf24);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.header-right{display:flex;align-items:center;gap:10px;font-size:0.78rem;color:var(--text-muted)}
#userEmail{font-family:var(--mono);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#userAvatar{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,#ca8a04,#fbbf24);color:white;
  display:none;align-items:center;justify-content:center;
  font-weight:700;font-size:0.72rem;text-transform:uppercase;
}
.signin-link{
  font-size:0.78rem;font-weight:600;color:var(--accent);
  padding:6px 12px;border:1px solid var(--line-2);border-radius:8px;
  transition:all 0.15s;
}
.signin-link:hover{background:var(--accent);color:white;border-color:var(--accent)}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0.5)}50%{box-shadow:0 0 0 8px rgba(16,185,129,0)}}

/* SCOPE BAR */
.scope-bar{
  background:var(--bg-soft);border-bottom:1px solid var(--line);
  padding:12px 20px;overflow-x:auto;flex-shrink:0;
  scrollbar-width:none;
}
.scope-bar::-webkit-scrollbar{display:none}
.scope-inner{
  max-width:880px;margin:0 auto;display:flex;gap:8px;align-items:center;
  flex-wrap:nowrap;
}
.scope-label{
  font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;
  color:var(--text-muted);flex-shrink:0;margin-right:4px;
}
.scope-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:100px;background:white;
  border:1px solid var(--line-2);font-size:0.82rem;font-weight:600;
  color:var(--text-soft);white-space:nowrap;transition:all 0.15s;
  flex-shrink:0;
}
.scope-chip i{font-size:0.75rem;color:var(--text-muted);transition:color 0.15s}
.scope-chip:hover{background:var(--bg-soft);border-color:var(--accent);color:var(--ink)}
.scope-chip:hover i{color:var(--accent)}
.scope-chip.active{
  background:linear-gradient(135deg,#ca8a04,#eab308);color:white;border-color:transparent;
  box-shadow:0 4px 12px rgba(202,138,4,0.3);
}
.scope-chip.active i{color:white}
.scope-chip.locked{opacity:0.4;cursor:not-allowed;background:var(--bg-soft)}
.scope-chip .lock{font-size:0.65rem;margin-left:2px}

/* CHAT */
.chat{flex:1;overflow-y:auto;padding:32px 20px 20px;scroll-behavior:smooth}
.chat-inner{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

/* TURNS */
.turn{display:flex;flex-direction:column;gap:8px;animation:fadeUp 0.3s cubic-bezier(0.2,0.8,0.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.turn-user{align-items:flex-end}
.turn-user .bubble{
  background:var(--ink);color:white;padding:11px 16px;
  border-radius:18px 18px 4px 18px;max-width:80%;
  font-size:0.94rem;line-height:1.5;
}
.turn-janta{align-items:flex-start}
.turn-janta .janta-row{display:flex;gap:10px;align-items:flex-start;width:100%}
.janta-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#ca8a04,#fbbf24);
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:0.85rem;font-weight:700;
  box-shadow:0 2px 6px rgba(202,138,4,0.25);
}
.turn-janta .bubble{
  background:var(--bg-soft);border:1px solid var(--line);
  padding:16px 20px;border-radius:4px 18px 18px 18px;
  width:100%;max-width:calc(100% - 42px);font-size:0.94rem;line-height:1.65;
}

/* WELCOME CARD */
.welcome{
  background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%);
  border:1px solid rgba(202,138,4,0.2);border-radius:var(--radius-lg);
  padding:20px 22px;margin-bottom:4px;position:relative;overflow:hidden;
}
.welcome::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent-light));
}
.welcome-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.welcome-icon{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,#ca8a04,#fbbf24);color:white;
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  box-shadow:0 6px 16px rgba(202,138,4,0.25);flex-shrink:0;
}
.welcome-title{
  font-family:var(--serif);font-size:1.1rem;font-weight:700;
  letter-spacing:-0.02em;color:var(--ink);line-height:1.2;
}
.welcome-subtitle{font-size:0.82rem;color:var(--text-soft);margin-top:2px}
.welcome-text{font-size:0.92rem;color:var(--text-soft);line-height:1.6;margin-bottom:14px}
.quick-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.quick-chip{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:100px;background:white;
  border:1px solid var(--line-2);font-size:0.83rem;font-weight:500;
  color:var(--text-soft);transition:all 0.15s;text-align:left;
}
.quick-chip:hover{border-color:var(--accent);color:var(--ink);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.quick-chip i{font-size:0.72rem;color:var(--accent)}

/* PINNED ANSWER */
.pinned-answer{
  background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);
  border:2px solid #3b82f6;border-radius:var(--radius-md);
  padding:16px 18px;margin-bottom:14px;position:relative;
}
.pinned-answer::before{
  content:'';position:absolute;top:-8px;left:16px;
  background:#3b82f6;color:white;font-size:0.65rem;font-weight:700;
  padding:2px 10px;border-radius:100px;letter-spacing:0.05em;text-transform:uppercase;
  content:'Answer';
}
.pinned-answer .pa-label{
  position:absolute;top:-9px;left:16px;background:#3b82f6;color:white;
  font-size:0.65rem;font-weight:700;padding:2px 10px;border-radius:100px;
  letter-spacing:0.05em;text-transform:uppercase;
}
.pinned-answer .pa-title{
  font-family:var(--serif);font-size:1.1rem;font-weight:700;
  color:var(--ink);letter-spacing:-0.02em;margin-bottom:4px;line-height:1.3;
}
.pinned-answer .pa-price{
  font-family:var(--mono);font-size:1.35rem;font-weight:700;
  color:#1e40af;margin-bottom:6px;letter-spacing:-0.02em;
}
.pinned-answer .pa-context{
  font-size:0.82rem;color:var(--text-soft);line-height:1.5;margin-bottom:8px;
}
.pinned-answer .pa-meta{
  font-size:0.78rem;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:6px;
}
.pinned-answer .pa-meta span{display:inline-flex;align-items:center;gap:4px}
.pinned-answer .pa-meta span i{font-size:0.65rem;color:#1e40af}
.pinned-answer .pa-meta span + span::before{content:"·";margin-right:6px;color:var(--line-2)}

/* GROUPS */
.group{margin-top:16px}
.group:first-child{margin-top:0}
.group-head{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
  padding-bottom:8px;border-bottom:1px solid var(--line);
}
.group-head i{color:var(--accent);font-size:0.82rem}
.group-label{
  font-size:0.72rem;font-weight:700;text-transform:uppercase;
  letter-spacing:0.07em;color:var(--text-muted);
}
.group-count{
  margin-left:auto;font-size:0.72rem;font-weight:600;
  color:var(--text-muted);font-family:var(--mono);
}

/* ITEMS */
.item{
  padding:14px 16px;border-radius:var(--radius-md);
  background:white;border:1px solid var(--line);
  margin-bottom:10px;transition:all 0.15s;
}
.item:hover{border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.item:last-child{margin-bottom:0}
.item.exact{
  border-color:#3b82f6;border-width:2px;
  background:linear-gradient(135deg,#ffffff 0%,#eff6ff 100%);
  box-shadow:0 4px 16px rgba(59,130,246,0.12);
}
.item.exact .item-name::after{
  content:'★ Exact match';display:inline-block;
  background:#3b82f6;color:white;font-size:0.6rem;font-weight:700;
  padding:2px 8px;border-radius:100px;letter-spacing:0.05em;
  text-transform:uppercase;margin-left:8px;vertical-align:middle;
}
.item-name{
  font-weight:700;color:var(--ink);font-size:0.96rem;
  margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.item-badge{
  font-size:0.62rem;font-weight:700;text-transform:uppercase;
  letter-spacing:0.05em;padding:2px 8px;border-radius:100px;
  background:var(--accent-soft);color:var(--accent-dark);
}
.item-badge.huduma{background:#dbeafe;color:#1e40af}
.item-badge.fusion{background:#dcfce7;color:#166534}
.item-badge.dsog{background:#ede9fe;color:#6d28d9}
.item-badge.workfit{background:#fce7f3;color:#be185d}
.item-badge.brandinn{background:#fef3c7;color:#a16207}
.item-badge.heritage{background:#e0f2fe;color:#0369a1}
.item-badge.mugs{background:#ffedd5;color:#c2410c}
.item-price{
  font-family:var(--mono);font-size:0.9rem;color:var(--accent-dark);
  font-weight:700;margin-bottom:6px;
}
.item-price.huduma{color:#1e40af}
.item-price.fusion{color:#166534}
.item-price.dsog{color:#6d28d9}
.item-price.workfit{color:#be185d}
.item-desc{font-size:0.88rem;color:var(--text-soft);line-height:1.55;margin-bottom:8px}
.item-features{font-size:0.84rem;color:var(--text-soft);margin:8px 0;padding-left:18px}
.item-features li{margin-bottom:3px}
.item-meta{
  font-size:0.78rem;color:var(--text-muted);line-height:1.5;
  display:flex;flex-wrap:wrap;gap:0 6px;
}
.item-meta span{display:inline-flex;align-items:center;gap:4px}
.item-meta span i{font-size:0.65rem;color:var(--accent)}
.item-meta span + span::before{content:"·";margin-right:6px;color:var(--line-2)}
.item-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.item-action{
  padding:5px 12px;border-radius:100px;font-size:0.74rem;font-weight:600;
  background:var(--bg-softer);color:var(--text-soft);
  border:1px solid var(--line);transition:all 0.15s;
  text-decoration:none;display:inline-flex;align-items:center;gap:4px;
}
.item-action:hover{background:var(--accent);color:white;border-color:var(--accent)}
.item-action i{font-size:0.7rem}

/* PRICING TABLE */
.pricing-table{
  width:100%;border-collapse:collapse;margin-top:12px;
  font-size:0.86rem;background:white;
  border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;
}
.pricing-table thead th{
  background:var(--bg-softer);text-align:left;padding:10px 14px;
  font-size:0.7rem;font-weight:700;text-transform:uppercase;
  letter-spacing:0.06em;color:var(--text-muted);
  border-bottom:1px solid var(--line);
}
.pricing-table tbody td{
  padding:10px 14px;border-bottom:1px solid var(--line);
  color:var(--text-soft);vertical-align:middle;
}
.pricing-table tbody tr:last-child td{border-bottom:none}
.pricing-table tbody tr:hover{background:var(--bg-soft)}
.pricing-table tbody tr.exact td{
  background:linear-gradient(90deg,#eff6ff 0%,#ffffff 100%);
  font-weight:600;color:var(--ink);
}
.pricing-table tbody tr.exact td:first-child{border-left:3px solid #3b82f6}
.pricing-table .pt-name{font-weight:600;color:var(--ink);font-size:0.9rem}
.pricing-table .pt-fee{
  font-family:var(--mono);font-weight:700;color:var(--accent-dark);
  white-space:nowrap;text-align:right;
}
.pricing-table .pt-workspace{
  font-size:0.72rem;color:var(--text-muted);
  text-transform:capitalize;
}

/* LOADING */
.loading{display:inline-flex;gap:5px;align-items:center;padding:4px 0}
.loading span{
  width:7px;height:7px;border-radius:50%;
  background:var(--text-muted);animation:pulse 1.4s infinite ease-in-out;
}
.loading span:nth-child(2){animation-delay:0.2s}
.loading span:nth-child(3){animation-delay:0.4s}
@keyframes pulse{
  0%,80%,100%{opacity:0.3;transform:scale(0.85)}
  40%{opacity:1;transform:scale(1)}
}
.typing{display:flex;align-items:center;gap:10px;font-size:0.86rem;color:var(--text-muted);font-style:italic}

/* SUMMARY */
.summary{font-size:0.9rem;color:var(--text-soft);margin-bottom:12px;font-weight:500}
.summary strong{color:var(--ink);font-weight:700}
.no-results{color:var(--text-muted);font-size:0.92rem;font-style:italic;padding:12px 0}
.no-results-suggest{margin-top:12px;font-style:normal;font-size:0.85rem;color:var(--text-soft)}

/* LOCKED */
.locked-notice{
  display:flex;gap:10px;align-items:flex-start;
  padding:14px 16px;background:#fef2f2;border:1px solid #fecaca;
  border-radius:var(--radius-md);color:#991b1b;font-size:0.88rem;
  line-height:1.55;margin-top:12px;
}
.locked-notice i{color:#dc2626;margin-top:2px;flex-shrink:0}
.locked-notice strong{display:block;color:#7f1d1d;margin-bottom:3px}

/* OPENER */
.opener{color:var(--text-soft)}
.opener strong{color:var(--ink);font-weight:700}
.opener .hint{display:block;margin-top:12px;font-size:0.86rem;color:var(--text-muted);line-height:1.6}

/* INPUT */
.input-wrap{border-top:1px solid var(--line);padding:16px 20px 20px;background:white;flex-shrink:0}
.scope-context{
  max-width:880px;margin:0 auto 10px;
  display:flex;align-items:center;gap:8px;
  font-size:0.78rem;color:var(--text-muted);
  min-height:18px;
}
.scope-context i{color:var(--accent);font-size:0.75rem}
.scope-context strong{color:var(--text-soft);font-weight:600}
.scope-context .change{
  margin-left:auto;color:var(--accent);font-weight:600;cursor:pointer;
  font-size:0.78rem;padding:2px 8px;border-radius:6px;transition:background 0.15s;
}
.scope-context .change:hover{background:var(--accent-soft)}

.input-row{
  max-width:880px;margin:0 auto;
  display:flex;align-items:flex-end;gap:10px;
  border:1px solid var(--line-2);border-radius:var(--radius-lg);
  padding:10px 12px 10px 16px;background:var(--bg-soft);
  transition:border-color 0.15s,background 0.15s,box-shadow 0.15s;
}
.input-row:focus-within{
  border-color:var(--accent);background:white;
  box-shadow:0 0 0 3px rgba(202,138,4,0.1);
}
textarea{
  flex:1;border:none;outline:none;background:transparent;
  font-family:inherit;font-size:0.95rem;color:var(--text);
  resize:none;max-height:140px;line-height:1.5;padding:4px 0;
}
textarea::placeholder{color:var(--text-muted)}
.send{
  background:var(--ink);border:none;color:white;
  width:36px;height:36px;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;transition:all 0.15s;
  flex-shrink:0;
}
.send:hover:not(:disabled){background:var(--accent);transform:scale(1.05)}
.send:disabled{opacity:0.4;cursor:not-allowed}

/* RESPONSIVE */
@media (max-width:700px){
  .scope-bar{padding:10px 16px}
  .scope-label{display:none}
  .chat{padding:20px 14px 16px}
  .chat-inner{gap:20px}
  .turn-user .bubble{max-width:90%}
  .turn-janta .bubble{max-width:calc(100% - 40px);padding:14px 16px;font-size:0.9rem}
  .janta-avatar{width:28px;height:28px;font-size:0.78rem}
  .input-wrap{padding:12px 14px 16px}
  .welcome{padding:16px 18px}
  .welcome-title{font-size:1rem}
  #userEmail{display:none}
  .item{padding:12px 14px}
  .item-meta{font-size:0.75rem}
  .pricing-table{font-size:0.78rem}
  .pricing-table thead th,.pricing-table tbody td{padding:8px 10px}
}
@media (max-width:420px){
  .brand{font-size:1.05rem}
  .quick-chip{font-size:0.78rem;padding:7px 12px}
  .item-actions{gap:5px}
  .item-action{font-size:0.72rem;padding:4px 10px}
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="index.html" class="back-link" aria-label="Back to Janta"><i class="fas fa-arrow-left"></i></a>
    <div class="brand">janta <span class="accent">assistant</span><span class="dot" aria-hidden="true"></span></div>
  </div>
  <div class="header-right">
    <span id="userEmail"></span>
    <div id="userAvatar" aria-hidden="true"></div>
    <a href="index.html" class="signin-link" id="signinLink" style="display:none;">Sign in</a>
  </div>
</header>

<div class="scope-bar" id="scopeBar" role="tablist" aria-label="Search scope">
  <div class="scope-inner" id="scopeInner"></div>
</div>

<div class="chat" id="chat">
  <div class="chat-inner" id="chatInner"></div>
</div>

<div class="input-wrap">
  <div class="scope-context" id="scopeContext"></div>
  <div class="input-row" id="inputRow">
    <textarea
      id="query"
      rows="1"
      placeholder="Ask anything…"
      autocomplete="off"
      spellcheck="false"
      aria-label="Ask Janta Assistant"
    ></textarea>

function scopeAllowed(scope) {
  if (!scope.permRequired) return true;
  if (!currentUser) return false;
  return currentPerms[scope.permRequired] === true || currentPerms.admins === true;
}
function getScope(id) { return SCOPES.find(s => s.id === id) || SCOPES[0]; }

function renderScopeBar() {
  scopeInner.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'scope-label';
  label.textContent = 'Search in';
  scopeInner.appendChild(label);

  SCOPES.forEach(s => {
    const allowed = scopeAllowed(s);
    const btn = document.createElement('button');
    btn.className = 'scope-chip' + (s.id === activeScope ? ' active' : '') + (!allowed ? ' locked' : '');
    btn.type = 'button';
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', s.id === activeScope ? 'true' : 'false');
    btn.innerHTML = `<i class="fas ${s.icon}"></i><span>${s.label}</span>${!allowed ? '<i class="fas fa-lock lock"></i>' : ''}`;
    btn.addEventListener('click', () => {
      if (!allowed) { showToast('You need additional access for this scope', 'info'); return; }
      activeScope = s.id;
      renderScopeBar();
      renderScopeContext();
      updatePlaceholder();
    });
    scopeInner.appendChild(btn);
  });
}

function renderScopeContext() {
  const scope = getScope(activeScope);

  if (activeScope === 'all') {
    scopeContext.innerHTML = `<i class="fas fa-wand-magic-sparkles"></i> Searching <strong>across all your workspaces</strong>`;
    return;

  scopeContext.innerHTML = `<i class="fas ${scope.icon}"></i> Searching only in <strong>${scope.label}</strong> <span class="change" id="scopeChange">change</span>`;

  if (change) change.addEventListener('click', () => {
    activeScope = 'all';
    renderScopeBar();
    renderScopeContext();
    updatePlaceholder();
  });
}

function updatePlaceholder() {

}

/* ==========================================================

   ========================================================== */
queryEl.addEventListener('input', () => {
  queryEl.style.height = 'auto';
  queryEl.style.height = Math.min(queryEl.scrollHeight, 140) + 'px';
  sendBtn.disabled = !queryEl.value.trim();
});
queryEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (queryEl.value.trim()) runQuery();
  }
});
sendBtn.addEventListener('click', runQuery);

/* ==========================================================
   MAIN HANDLER
   ========================================================== */
async function runQuery() {
  const q = queryEl.value.trim();
  if (!q) return;

  queryEl.value = '';
  queryEl.style.height = 'auto';
  sendBtn.disabled = true;

  appendUser(q);
  const { body } = appendJanta();
  body.innerHTML = `<div class="typing"><div class="loading"><span></span><span></span><span></span></div> Searching…</div>`;

  const conv = detectConversation(q);
  if (conv) {
    body.innerHTML = `<div class="opener">${conv.reply()}</div>`;
    chatEl.scrollTop = chatEl.scrollHeight;
    return;
  }

  try {
    const tokens = tokenize(q);
    const priceCap = extractPriceCap(q);
    const scope = getScope(activeScope);

    const results = await runScopedSearch(scope.id, tokens, priceCap, q);
    body.innerHTML = renderResults(results, priceCap, scope, q);
  } catch (err) {
    console.error(err);
    body.innerHTML = '<span class="no-results">Something went wrong. Try again.</span>';
  }

  chatEl.scrollTop = chatEl.scrollHeight;
}

/* ==========================================================
   SCOPED SEARCH
   ========================================================== */
async function runScopedSearch(scopeId, tokens, priceCap, rawQuery) {
  const results = {
    businesses: [],
    products: [],
    services: [],
    courses: [],
    resources: [],
    catalogue: [],
    priced: [],
    locked: []
  };

  const wantsBusinesses = scopeId === 'all' || scopeId === 'businesses';
  const wantsProducts = scopeId === 'all' || scopeId === 'products' || scopeId === 'pricing';
  const wantsServices = scopeId === 'all' || scopeId === 'services' || scopeId === 'pricing';
  const wantsCatalogue = scopeId === 'pricing' || scopeId === 'all';
  const wantsCourses = scopeId === 'all' || scopeId === 'courses';
  const wantsResources = scopeId === 'all' || scopeId === 'resources';

  const canCourses = wantsCourses && (currentUser && (currentPerms.learning === true || currentPerms.admins === true));
  if (wantsCourses && !canCourses) results.locked.push('courses');

  const [businesses, courses, resources, catalogueItems] = await Promise.all([
    (wantsBusinesses || wantsProducts || wantsServices) ? getBusinesses() : Promise.resolve([]),
    canCourses ? getCourses() : Promise.resolve([]),
    wantsResources ? getResources() : Promise.resolve([]),
    wantsCatalogue ? getCatalogue() : Promise.resolve([])
  ]);

  /* Business matches */
  if (wantsBusinesses) {
    for (const b of businesses) {
      const text = [b.businessName, b.name, b.tagline, b.category, b.industry, b.description, b.area, b.road].filter(Boolean).join(' ');
      const s = score(text, tokens);
      if (s > 0) results.businesses.push({ item: b, score: s });
    }
  }

  /* Product + service matches from business pages (BrandInn) */
  if (wantsProducts || wantsServices) {
    for (const b of businesses) {
      const pd = b.pageData || {};
      const bizName = b.businessName || b.name || b.slug;
      const phone = b.phone || pd.contact?.phone || '';
      const address = b.address || pd.contact?.address || '';

      if (wantsProducts) {
        for (const p of (pd.products || [])) {
          const text = [p.name, p.title, p.desc, p.description, p.category].filter(Boolean).join(' ');
          const s = score(text, tokens);
          const price = Number(p.price) || 0;
          if (s > 0 && (!priceCap || price <= priceCap)) {
            results.products.push({ item: p, score: s + (priceCap ? 2 : 0), bizName, phone, address });
          }
        }
      }
      if (wantsServices) {
        for (const sv of (pd.services || [])) {
          const text = [sv.title, sv.desc, sv.tag, (sv.features || []).join(' ')].filter(Boolean).join(' ');
          const s = score(text, tokens);
          const price = Number(String(sv.price || '').replace(/[^\d]/g, '')) || 0;
          if (s > 0 && (!priceCap || price === 0 || price <= priceCap)) {
            results.services.push({ item: sv, score: s, bizName, phone, address });
          }
        }
      }
    }
  }

  /* Catalogue matches — E-Huduma, Fusion, DSOG, WorkFit, Heritage, Mugs n Dines */
  if (wantsCatalogue) {
    for (const c of catalogueItems) {
      const text = [c.name, c.description, c.workspace, (c.meta || []).join(' ')].filter(Boolean).join(' ');
      const s = score(text, tokens);
      const priceOk = !priceCap || c.price === 0 || c.price <= priceCap;
      if (s > 0 && priceOk) {
        results.catalogue.push({ item: c, score: s + (priceCap && c.price > 0 ? 2 : 0) });
        if (c.price > 0) results.priced.push(c);
      }
    }
  }

  if (canCourses) {
    for (const c of courses) {
      const text = [c.title, c.desc, c.longDesc, c.category, c.level].filter(Boolean).join(' ');
      const s = score(text, tokens);
      if (s > 0) results.courses.push({ item: c, score: s });
    }
  }
  if (wantsResources) {
    for (const r of resources) {
      const text = [r.title, r.description, r.workspace].filter(Boolean).join(' ');
      const s = score(text, tokens);
      if (s > 0) results.resources.push({ item: r, score: s });
    }
  }

  for (const k of ['businesses', 'courses', 'products', 'services', 'resources', 'catalogue']) {
    results[k].sort((a, b) => b.score - a.score);
    results[k] = results[k].slice(0, 12);
  }

  /* Find the exact match: the top catalogue result whose name matches the query best */
  results.exactMatch = pickExactMatch(rawQuery, results.catalogue, results.products, results.services);

  return results;
}

/* Picks the single "exact match" item for the pinned answer */
function pickExactMatch(rawQuery, catalogue, products, services) {
  const q = rawQuery.toLowerCase();
  const candidates = [];

  /* Catalogue items are the primary candidates (E-Huduma, Fusion, DSOG, etc.) */
  for (const { item } of (catalogue || [])) {
    const name = (item.name || '').toLowerCase();
    let bonus = 0;
    if (name === q) bonus = 100;
    else if (name.includes(q) || q.includes(name)) bonus = 60;
    else {
      const words = q.split(/\s+/).filter(w => w.length > 2);
      const hits = words.filter(w => name.includes(w)).length;
      if (hits > 0) bonus = hits * 20;
    }
    if (bonus > 0) candidates.push({ ...item, _bonus: bonus });
  }

  /* Also consider product/service items from business pages */
  for (const { item } of (products || [])) {
    const name = (item.name || item.title || '').toLowerCase();
    if (name.includes(q) || q.includes(name)) {
      candidates.push({
        workspace: 'BrandInn',
        name: item.name || item.title,
        price: Number(item.price) || 0,
        priceLabel: Number(item.price) ? `KSh ${Number(item.price).toLocaleString()}` : 'Contact for pricing',
        description: item.desc || item.description || '',
        meta: [],
        _bonus: 40
      });
    }
  }
  for (const { item } of (services || [])) {
    const name = (item.title || '').toLowerCase();
    if (name.includes(q) || q.includes(name)) {
      const price = Number(String(item.price || '').replace(/[^\d]/g, '')) || 0;
      candidates.push({
        workspace: 'BrandInn',
        name: item.title,
        price,
        priceLabel: item.price ? String(item.price) : (price ? `KSh ${price.toLocaleString()}` : 'Contact for pricing'),
        description: item.desc || '',
        meta: [],
        _bonus: 40
      });
    }
  }

  candidates.sort((a, b) => b._bonus - a._bonus);
  return candidates[0] || null;
}

/* ==========================================================
   SEARCH UTILITIES
   ========================================================== */
const STOP_WORDS = new Set([
  'a','an','the','is','are','was','were','be','being','been',
  'of','in','on','at','to','for','with','by','from','about',
  'and','or','but','if','so','as','than','then','that','this',
  'these','those','it','its','i','you','we','they','he','she',
  'me','my','our','your','their','his','her','them','us',
  'do','does','did','have','has','had','can','could','will',
  'would','should','may','might','must','what','which','who',
  'whom','whose','where','when','why','how','any','some','all',
  'no','not','only','just','show','find','give','tell','me',
  'please','need','want','looking','look','see','get','much',
  'price','cost','fee','charge','how','does','whats'
]);

function tokenize(q) {
  return q.toLowerCase().replace(/[^\w\s]/g, ' ').split(/\s+/)
    .filter(w => w && !STOP_WORDS.has(w) && w.length > 1);
}

function extractPriceCap(q) {
  const m = q.match(/(?:under|below|less than|<)\s*(?:ksh|kes)?\s*([\d,]+)\s*(k)?/i);
  if (!m) return null;
  let n = parseInt(m[1].replace(/,/g, ''), 10);
  if (m[2]) n *= 1000;
  return isNaN(n) ? null : n;
}

function score(text, tokens) {
  if (!text) return 0;
  const lower = String(text).toLowerCase();
  let s = 0;
  for (const t of tokens) {
    if (lower.includes(t)) {
      const re = new RegExp('\\b' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b');
      s += re.test(lower) ? 3 : 1;
    }
  }
  return s;
}

/* ==========================================================
   DATA LOADERS
   ========================================================== */
async function getBusinesses() {
  if (cache.businesses) return cache.businesses;
  const snap = await db.ref('brandinn_subdomains').once('value');
  const val = snap.val() || {};
  cache.businesses = Object.entries(val)
    .map(([slug, b]) => ({ slug, ...b }))
    .filter(b => b.status === 'active' || b.businessName);
  return cache.businesses;
}
async function getCourses() {
  if (cache.courses) return cache.courses;
  const snap = await db.ref('learning_courses').once('value');
  const val = snap.val() || {};
  cache.courses = Object.entries(val)
    .map(([id, c]) => ({ id, ...c }))
    .filter(c => c.published === true);
  return cache.courses;
}
async function getResources() {
  if (cache.resources) return cache.resources;
  const snap = await db.ref('resources').once('value');
  const val = snap.val() || {};
  const out = [];
  for (const [section, items] of Object.entries(val)) {
    if (!items || typeof items !== 'object') continue;
    for (const [id, r] of Object.entries(items)) {
      if (!r || typeof r !== 'object') continue;
      out.push({ id, section, ...r });
    }
  }
  cache.resources = out;
  return out;
}

/* Loads everything from CATALOGUE across all workspaces */
async function getCatalogue() {
  if (cache.catalogue) return cache.catalogue;

  const items = [];
  const sources = Object.values(CATALOGUE);

  await Promise.all(sources.map(async (src) => {
    try {
      const snap = await db.ref(src.path).once('value');
      const val = snap.val() || {};

      if (src.nested && src.extract) {
        /* BrandInn: iterate businesses, pull their services & offers */
        for (const [slug, b] of Object.entries(val)) {
          const extracted = src.extract(slug, b);
          for (const e of extracted) items.push(e);
        }
      } else if (src.build) {
        for (const [id, raw] of Object.entries(val)) {
          if (!raw || typeof raw !== 'object') continue;
          items.push(src.build(id, raw));
        }
      }
    } catch (e) {
      console.warn(`Catalogue source ${src.path} failed:`, e);
    }
  }));

  cache.catalogue = items;
  return items;
}

/* ==========================================================
   CONVERSATIONAL INTENTS
   ========================================================== */
const CONVERSATION_RULES = [
  {
    id: 'greeting',
    patterns: [
      /^(hi|hey|hello|yo|hiya|howdy|sup|habari|niaje|sasa|mambo|jambo)\b/i,
      /\bhi\s+(janta|assistant)\b/i,
      /\bhey\s+(janta|assistant)\b/i,
      /\bhello\s+(janta|assistant)\b/i,
      /^(janta|assistant)$/i,
      /^(good\s+(morning|afternoon|evening|night))\b/i
    ],
    reply: () => {
      const name = firstName();
      return `${partOfDay()}${name ? ', ' + name : ''}. What would you like to find? I can search services and products across all your workspaces — E-Huduma, Fusion Foods, DSOG, BrandInn, WorkFit, Heritage and Mugs n Dines.`;
    }
  },
  {
    id: 'howareyou',
    patterns: [/how\s+are\s+you/i, /how'?s\s+it\s+going/i, /umeamkaje/i, /habari\s+yako/i],
    reply: () => {
      const name = firstName();
      return `Running well${name ? ', ' + name : ''}. Ready to price-check anything across KazInni.`;
    }
  },
  {
    id: 'whoareyou',
    patterns: [
      /who\s+are\s+you/i, /what\s+are\s+you/i, /what\s+is\s+janta/i,
      /what\s+can\s+you\s+do/i, /what\s+do\s+you\s+do/i,
      /tell\s+me\s+about\s+(yourself|janta)/i
    ],
    reply: () =>
      `I'm the Janta Assistant. I search across every workspace in the ecosystem — E-Huduma government services, Fusion Foods produce, DSOG apparel, BrandInn design services, WorkFit gear, Heritage marketplace and Mugs n Dines menu. Ask me a service or product and I'll show you the exact price plus the full price list around it.`
  },
  {
    id: 'help',
    patterns: [/^help$/i, /^help\s+me$/i, /how\s+do\s+i\s+use\s+(you|janta|the assistant)/i],
    reply: () =>
      `Just ask in your own words — for example:<br><br>
       › how much is eTIMS?<br>
       › KRA PIN price<br>
       › cabbage price<br>
       › how much is a passport?<br>
       › beanie caps<br>
       › cypress bed under 25k<br><br>
       I'll pin the exact answer, then show you the full price list across the ecosystem.`
  },
  {
    id: 'thanks',
    patterns: [/^(thanks|thank\s+you|thx|asante|asante\s+sana)\b/i, /\bthanks\s+(janta|assistant)\b/i],
    reply: () => {
      const name = firstName();
      return `You're welcome${name ? ', ' + name : ''}. Anything else you need priced?`;
    }
  },
  {
    id: 'bye',
    patterns: [/^(bye|goodbye|see\s+you|later|kwaheri|tutaonana)\b/i, /\bbye\s+(janta|assistant)\b/i],
    reply: () => {
      const name = firstName();
      return `Kwaheri${name ? ', ' + name : ''}. Come back any time.`;
    }
  }
];

function detectConversation(q) {
  const text = q.trim();
  for (const rule of CONVERSATION_RULES) {
    for (const pattern of rule.patterns) {
      if (pattern.test(text)) return rule;
    }
  }
  return null;
}

   RENDERING

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderResults(results, priceCap, scope, rawQuery) {
  const total =
    results.businesses.length +
    results.courses.length +
    results.products.length +
    results.services.length +
    results.resources.length +
    results.catalogue.length;

  const lockedHTML = (results.locked || []).map(id => {
    const s = SCOPES.find(x => x.id === id);
    if (!s) return '';
    return `<div class="locked-notice">
      <i class="fas fa-lock"></i>
      <div>
        <strong>${esc(s.label)} locked</strong>
        You don't have access to search ${esc(s.label.toLowerCase())}. Ask an admin to grant you the <code>${esc(s.permRequired)}</code> permission.
      </div>
    </div>`;
  }).join('');

  if (total === 0) {
    return `
      <span class="no-results">Nothing matches "${esc(rawQuery)}" on KazInni.</span>
      <div class="no-results-suggest">Try a different word, or change the scope above.</div>
      ${lockedHTML}
    `;
  }

  const parts = [];

  /* ---- Pinned answer ---- */
  if (results.exactMatch) {
    const e = results.exactMatch;
    parts.push(`<div class="pinned-answer">
      <div class="pa-label">Answer</div>
      <div class="pa-title">${esc(e.name)}</div>
      <div class="pa-price">${esc(e.priceLabel)}</div>
      ${e.description ? `<div class="pa-context">${esc(e.description.slice(0, 280))}${e.description.length > 280 ? '…' : ''}</div>` : ''}
      <div class="pa-meta">
        <span><i class="fas fa-folder"></i>${esc(e.workspace)}</span>
        ${(e.meta || []).map(m => `<span><i class="fas fa-info-circle"></i>${esc(m)}</span>`).join('')}
      </div>
    </div>`);
  }

  const cap = priceCap ? ` under KSh ${priceCap.toLocaleString()}` : '';
  const scopeLabel = scope.id === 'all' ? '' : ` in ${scope.label}`;
  parts.push(`<div class="summary">Found <strong>${total} match${total === 1 ? '' : 'es'}</strong>${esc(cap)}${esc(scopeLabel)} on KazInni.</div>`);

  /* ---- Full pricing table for the catalogue ---- */
  if (results.catalogue.length > 0) {
    const exactId = results.exactMatch?.sourceId;
    parts.push(renderPricingTable(results.catalogue.map(r => r.item), exactId));
  }

  if (results.businesses.length) {
    parts.push(renderGroup('Businesses', 'fa-store', results.businesses.length,
      results.businesses.map(r => renderBusiness(r.item)).join('')));
  }
  if (results.products.length) {
    parts.push(renderGroup('Products (business pages)', 'fa-box', results.products.length,
      results.products.map(r => renderProduct(r)).join('')));
  }
  if (results.services.length) {
    parts.push(renderGroup('Services (business pages)', 'fa-concierge-bell', results.services.length,
      results.services.map(r => renderService(r)).join('')));
  }
  if (results.courses.length) {
    parts.push(renderGroup('Courses', 'fa-graduation-cap', results.courses.length,
      results.courses.map(r => renderCourse(r.item)).join('')));
  }
  if (results.resources.length) {
    parts.push(renderGroup('Resources', 'fa-book-open', results.resources.length,
      results.resources.map(r => renderResource(r.item)).join('')));
  }

  parts.push(lockedHTML);
  return parts.join('');
}

function renderPricingTable(items, exactId) {
  if (!items.length) return '';
  const rows = items.map(c => {
    const isExact = c.sourceId === exactId;
    return `<tr class="${isExact ? 'exact' : ''}">
      <td class="pt-name">${esc(c.name)}</td>
      <td class="pt-workspace">${esc(c.workspace)}</td>
      <td class="pt-fee">${esc(c.priceLabel)}</td>
    </tr>`;
  }).join('');
  return `<div class="group">
    <div class="group-head">
      <i class="fas fa-tags"></i>
      <span class="group-label">Full price list</span>
      <span class="group-count">${items.length}</span>
    </div>
    <table class="pricing-table">
      <thead>
        <tr><th>Service / Product</th><th>Workspace</th><th style="text-align:right;">Price</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderGroup(label, icon, count, inner) {
  return `<div class="group">
    <div class="group-head">
      <i class="fas ${icon}"></i>
      <span class="group-label">${esc(label)}</span>
      <span class="group-count">${count}</span>
    </div>
    ${inner}
  </div>`;
}

function renderBusiness(b) {
  const pd = b.pageData || {};
  const name = b.businessName || b.name || b.slug;
  const tagline = pd.business?.tagline || b.tagline || '';
  const category = pd.business?.category || b.category || b.industry || '';
  const address = pd.contact?.address || b.address || '';
  const phone = pd.contact?.phone || b.phone || '';
  const email = pd.contact?.email || b.email || '';
  const desc = pd.business?.description || b.description || '';

  return `<div class="item">
    <div class="item-name">${esc(name)}${category ? `<span class="item-badge brandinn">${esc(category)}</span>` : ''}</div>
    ${tagline ? `<div class="item-desc" style="color:var(--accent-dark);font-weight:500;">${esc(tagline)}</div>` : ''}
    ${desc ? `<div class="item-desc">${esc(desc)}</div>` : ''}
    <div class="item-meta">
      ${address ? `<span><i class="fas fa-location-dot"></i>${esc(address)}</span>` : ''}
      ${phone ? `<span><i class="fas fa-phone"></i>${esc(phone)}</span>` : ''}
      ${email ? `<span><i class="fas fa-envelope"></i>${esc(email)}</span>` : ''}
    </div>
    <div class="item-actions">
      ${phone ? `<a href="tel:${esc(phone)}" class="item-action"><i class="fas fa-phone"></i>Call</a>` : ''}
      ${email ? `<a href="mailto:${esc(email)}" class="item-action"><i class="fas fa-envelope"></i>Email</a>` : ''}
    </div>
  </div>`;
}

function renderProduct(r) {
  const p = r.item;
  const name = p.name || p.title || 'Unnamed product';
  const price = Number(p.price);
  const desc = p.desc || p.description || '';
  return `<div class="item">
    <div class="item-name">${esc(name)}${p.category ? `<span class="item-badge brandinn">${esc(p.category)}</span>` : ''}</div>

    ${desc ? `<div class="item-desc">${esc(desc.slice(0, 300))}${desc.length > 300 ? '…' : ''}</div>` : ''}
    <div class="item-meta">
      ${r.bizName ? `<span><i class="fas fa-store"></i>${esc(r.bizName)}</span>` : ''}
      ${r.phone ? `<span><i class="fas fa-phone"></i>${esc(r.phone)}</span>` : ''}

  </div>`;

function renderService(r) {
  const s = r.item;
  const title = s.title || 'Service';
  const price = s.price ? String(s.price) : '';
  const desc = s.desc || '';
  const features = s.features || [];
  return `<div class="item">
    <div class="item-name">${esc(title)}${s.tag ? `<span class="item-badge brandinn">${esc(s.tag)}</span>` : ''}</div>
    ${price ? `<div class="item-price">${esc(price)}</div>` : ''}
    ${desc ? `<div class="item-desc">${esc(desc)}</div>` : ''}
    ${features.length ? `<ul class="item-features">${features.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
    <div class="item-meta">
      ${r.bizName ? `<span><i class="fas fa-store"></i>${esc(r.bizName)}</span>` : ''}
      ${r.phone ? `<span><i class="fas fa-phone"></i>${esc(r.phone)}</span>` : ''}
    </div>
  </div>`;
}

function renderCourse(c) {
  const title = c.title || 'Course';
  const cat = c.category || '';
  const level = c.level || '';
  const duration = c.duration ? `${c.duration} min` : '';
  const desc = c.longDesc || c.desc || '';

  return `<div class="item">
    <div class="item-name">${esc(title)}${cat ? `<span class="item-badge">${esc(cat)}</span>` : ''}</div>
    ${desc ? `<div class="item-desc">${esc(desc.slice(0, 300))}${desc.length > 300 ? '…' : ''}</div>` : ''}

      ${level ? `<span><i class="fas fa-signal"></i>${esc(level)}</span>` : ''}
      ${duration ? `<span><i class="fas fa-clock"></i>${esc(duration)}</span>` : ''}

    <div class="item-actions">
      <a href="learning/course.html?id=${encodeURIComponent(c.id)}" class="item-action"><i class="fas fa-arrow-right"></i>Open course</a>
    </div>
  </div>`;
}

function renderResource(r) {
  const title = r.title || 'Resource';
  const desc = r.description || '';
  const workspace = r.workspace || r.section || '';
  return `<div class="item">
    <div class="item-name">${esc(title)}</div>
    ${desc ? `<div class="item-desc">${esc(desc)}</div>` : ''}
    <div class="item-meta">
      ${workspace ? `<span><i class="fas fa-folder"></i>${esc(workspace)}</span>` : ''}
    </div>
    <div class="item-actions">
      ${r.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener" class="item-action"><i class="fas fa-external-link-alt"></i>Open</a>` : ''}
    </div>
  </div>`;
}
