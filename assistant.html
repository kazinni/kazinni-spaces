<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ca8a04">
<meta name="color-scheme" content="light">
<meta name="description" content="Janta Assistant — one assistant, every workspace.">
<title>Janta Assistant</title>
<link rel="icon" href="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview-1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://api.fontshare.com/v2/css?v=2&f[]=cabinet-grotesk@400,500,600,700,800&f[]=satoshi@400,500,600,700,800,900&f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #ffffff;
  --bg-side: #f7f6f3;
  --bg-soft: #faf9f7;
  --bg-softer: #f0eeea;
  --line: #edebe9;
  --line-2: #e1dfdb;
  --line-3: #d4d1cb;
  --text: #1a1a1e;
  --text-soft: #4a4a5e;
  --text-muted: #8a8a94;
  --text-faint: #b3b3bb;
  --accent: #ca8a04;
  --accent-dark: #a16207;
  --accent-light: #fbbf24;
  --accent-soft: #fef3c7;
  --accent-tint: rgba(202,138,4,0.08);
  --ink: #0f0f1e;
  --danger: #b91c1c;
  --success: #10b981;
  --blue: #1e40af;
  --blue-soft: #dbeafe;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --sans: 'Satoshi', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --serif: 'Clash Display', Georgia, serif;
  --radius-xs: 6px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 22px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.03);
  --shadow-sm: 0 2px 6px rgba(0,0,0,0.05);
  --shadow-md: 0 8px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 20px 48px rgba(0,0,0,0.12);
  --sidebar-w: 260px;
  --topbar-h: 56px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow:hidden;
}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
a{color:var(--accent);text-decoration:none}

/* ============================================================
   LAYOUT
   ============================================================ */
.app{
  display:grid;
  grid-template-columns:var(--sidebar-w) 1fr;
  height:100vh;height:100dvh;
  overflow:hidden;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
  background:var(--bg-side);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:transform 0.25s cubic-bezier(0.2,0.8,0.2,1);
}
.sidebar-head{
  padding:14px 14px 10px;
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;flex-shrink:0;
}
.brand{
  display:flex;align-items:center;gap:9px;
  font-family:var(--serif);font-size:1.05rem;font-weight:700;
  letter-spacing:-0.03em;color:var(--ink);
  text-decoration:none;
}
.brand-icon{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,#ca8a04,#fbbf24);
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:0.8rem;
  box-shadow:0 3px 8px rgba(202,138,4,0.3);
}
.brand-accent{
  background:linear-gradient(135deg,#ca8a04,#fbbf24);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.sidebar-close{
  display:none;width:30px;height:30px;border-radius:6px;
  color:var(--text-muted);align-items:center;justify-content:center;
}
.sidebar-close:hover{background:var(--bg-softer);color:var(--ink)}

.new-chat-btn{
  margin:0 12px 10px;
  display:flex;align-items:center;gap:9px;
  padding:10px 14px;border-radius:var(--radius-sm);
  background:var(--ink);color:white;
  font-size:0.86rem;font-weight:600;
  transition:all 0.15s;
  box-shadow:0 2px 6px rgba(15,15,30,0.15);
  flex-shrink:0;
}
.new-chat-btn:hover{background:var(--accent);transform:translateY(-1px);box-shadow:0 6px 16px rgba(202,138,4,0.3)}
.new-chat-btn i{font-size:0.82rem}

.sidebar-search{
  margin:0 12px 10px;
  position:relative;flex-shrink:0;
}
.sidebar-search input{
  width:100%;padding:8px 10px 8px 32px;
  border-radius:var(--radius-sm);
  background:white;border:1px solid var(--line-2);
  font-size:0.82rem;color:var(--text);
  transition:all 0.15s;
}
.sidebar-search input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(202,138,4,0.1);
}
.sidebar-search i{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--text-muted);font-size:0.72rem;pointer-events:none;
}

.chat-list{
  flex:1;overflow-y:auto;padding:4px 8px 12px;
  scrollbar-width:thin;
  scrollbar-color:var(--line-3) transparent;
}
.chat-list::-webkit-scrollbar{width:6px}
.chat-list::-webkit-scrollbar-thumb{background:var(--line-3);border-radius:3px}

.chat-group-label{
  font-size:0.68rem;font-weight:700;text-transform:uppercase;
  letter-spacing:0.06em;color:var(--text-muted);
  padding:12px 10px 6px;
}

.chat-row{
  position:relative;display:flex;align-items:center;
  padding:8px 10px 8px 12px;border-radius:var(--radius-sm);
  cursor:pointer;transition:background 0.12s;
  gap:8px;margin-bottom:1px;
}
.chat-row:hover{background:var(--bg-softer)}
.chat-row.active{
  background:white;
  box-shadow:0 1px 2px rgba(0,0,0,0.04);
}
.chat-row.active::before{
  content:'';position:absolute;left:0;top:20%;bottom:20%;
  width:3px;border-radius:2px;
  background:linear-gradient(180deg,var(--accent),var(--accent-light));
}
.chat-row-icon{
  width:16px;flex-shrink:0;color:var(--text-muted);
  font-size:0.72rem;display:flex;justify-content:center;
}
.chat-row.active .chat-row-icon{color:var(--accent)}
.chat-row-title{
  flex:1;min-width:0;font-size:0.84rem;color:var(--text-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-weight:500;
}
.chat-row.active .chat-row-title{color:var(--ink);font-weight:600}
.chat-row-actions{
  display:flex;gap:2px;opacity:0;transition:opacity 0.12s;
  flex-shrink:0;
}
.chat-row:hover .chat-row-actions{opacity:1}
.chat-row-action{
  width:22px;height:22px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);font-size:0.68rem;
  transition:all 0.12s;
}
.chat-row-action:hover{background:white;color:var(--ink)}
.chat-row-action.danger:hover{background:#fee2e2;color:var(--danger)}
.chat-row-action.pinned{color:var(--accent)}

.sidebar-foot{
  border-top:1px solid var(--line);
  padding:10px 12px;
  flex-shrink:0;
}
.user-btn{
  display:flex;align-items:center;gap:9px;
  padding:8px;border-radius:var(--radius-sm);
  width:100%;text-align:left;transition:background 0.12s;
}
.user-btn:hover{background:var(--bg-softer)}
.user-avatar{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,#ca8a04,#fbbf24);color:white;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:0.72rem;text-transform:uppercase;
  flex-shrink:0;
}
.user-meta{min-width:0;flex:1}
.user-name{
  font-size:0.82rem;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.user-sub{
  font-size:0.7rem;color:var(--text-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.user-btn i.fa-ellipsis{color:var(--text-muted);font-size:0.72rem}

/* ============================================================
   MAIN
   ============================================================ */
.main{
  display:flex;flex-direction:column;
  overflow:hidden;background:var(--bg);
  position:relative;
}

/* TOPBAR */
.topbar{
  height:var(--topbar-h);flex-shrink:0;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;gap:10px;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  z-index:10;
}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.sidebar-toggle{
  display:none;width:32px;height:32px;border-radius:6px;
  color:var(--text-soft);align-items:center;justify-content:center;
}
.sidebar-toggle:hover{background:var(--bg-softer);color:var(--ink)}
.chat-title{
  font-family:var(--serif);font-size:1.05rem;font-weight:700;
  letter-spacing:-0.02em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;padding:4px 8px;border-radius:6px;
  transition:background 0.12s;
  max-width:400px;
}
.chat-title:hover{background:var(--bg-softer)}
.chat-title-input{
  font-family:var(--serif);font-size:1.05rem;font-weight:700;
  letter-spacing:-0.02em;color:var(--ink);
  background:white;border:1px solid var(--accent);
  border-radius:6px;padding:3px 8px;
  box-shadow:0 0 0 3px rgba(202,138,4,0.12);
  max-width:400px;width:100%;
}
.topbar-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}
.icon-btn{
  width:32px;height:32px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-soft);font-size:0.82rem;
  transition:all 0.12s;
}
.icon-btn:hover{background:var(--bg-softer);color:var(--ink)}
.icon-btn.danger:hover{background:#fee2e2;color:var(--danger)}

/* SCOPE CHIP in topbar */
.topbar-scope{
  display:flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:100px;
  background:var(--accent-tint);
  font-size:0.76rem;font-weight:600;color:var(--accent-dark);
  flex-shrink:0;
}
.topbar-scope i{font-size:0.7rem}

/* CHAT AREA */
.chat{
  flex:1;overflow-y:auto;padding:28px 24px 32px;
  scroll-behavior:smooth;
  scrollbar-width:thin;scrollbar-color:var(--line-3) transparent;
}
.chat::-webkit-scrollbar{width:8px}
.chat::-webkit-scrollbar-thumb{background:var(--line-3);border-radius:4px}
.chat-inner{
  max-width:820px;margin:0 auto;
  display:flex;flex-direction:column;gap:22px;
}

/* MESSAGES */
.msg{display:flex;gap:12px;align-items:flex-start;animation:fadeUp 0.25s cubic-bezier(0.2,0.8,0.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-user{justify-content:flex-end}
.msg-user .msg-bubble{
  background:var(--ink);color:white;
  padding:11px 16px;border-radius:18px 18px 4px 18px;
  max-width:80%;font-size:0.94rem;line-height:1.55;
}
.msg-avatar{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#ca8a04,#fbbf24);
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:0.78rem;font-weight:700;
  box-shadow:0 2px 6px rgba(202,138,4,0.25);
}
.msg-janta .msg-body{
  flex:1;min-width:0;font-size:0.94rem;line-height:1.65;
  color:var(--text);
}
.msg-janta .msg-body > *:first-child{margin-top:0}
.msg-janta .msg-body > *:last-child{margin-bottom:0}

/* WELCOME */
.welcome{
  max-width:780px;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;padding:40px 12px;
}
.welcome-icon{
  width:56px;height:56px;border-radius:16px;
  background:linear-gradient(135deg,#ca8a04,#fbbf24);
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:1.35rem;margin-bottom:18px;
  box-shadow:0 12px 32px rgba(202,138,4,0.32);
}
.welcome h1{
  font-family:var(--serif);font-size:1.85rem;font-weight:700;
  letter-spacing:-0.03em;color:var(--ink);
  margin-bottom:8px;line-height:1.2;
}
.welcome p{
  font-size:0.95rem;color:var(--text-soft);line-height:1.6;
  max-width:520px;margin-bottom:28px;
}
.welcome-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;width:100%;max-width:720px;
}
.welcome-card{
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  padding:14px 16px;border-radius:var(--radius-md);
  background:white;border:1px solid var(--line);
  text-align:left;transition:all 0.15s;cursor:pointer;
}
.welcome-card:hover{
  border-color:var(--accent);
  box-shadow:0 4px 12px rgba(202,138,4,0.1);
  transform:translateY(-1px);
}
.welcome-card-icon{
  width:30px;height:30px;border-radius:8px;
  background:var(--accent-tint);color:var(--accent-dark);
  display:flex;align-items:center;justify-content:center;
  font-size:0.8rem;margin-bottom:4px;
}
.welcome-card-title{
  font-size:0.86rem;font-weight:700;color:var(--ink);
  line-height:1.3;
}
.welcome-card-desc{
  font-size:0.76rem;color:var(--text-muted);line-height:1.4;
}

/* ============================================================
   ANSWER CONTENT
   ============================================================ */
.pinned-answer{
  position:relative;
  background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);
  border:1px solid #93c5fd;
  border-radius:var(--radius-md);
  padding:16px 18px;margin-bottom:14px;
}
.pinned-answer .pa-label{
  position:absolute;top:-9px;left:14px;background:#1e40af;color:white;
  font-size:0.62rem;font-weight:700;padding:2px 10px;border-radius:100px;
  letter-spacing:0.06em;text-transform:uppercase;
}
.pinned-answer .pa-title{
  font-family:var(--serif);font-size:1.05rem;font-weight:700;
  color:var(--ink);letter-spacing:-0.02em;margin-bottom:4px;line-height:1.3;
}
.pinned-answer .pa-price{
  font-family:var(--mono);font-size:1.25rem;font-weight:700;
  color:#1e40af;margin-bottom:6px;letter-spacing:-0.02em;
}
.pinned-answer .pa-context{
  font-size:0.82rem;color:var(--text-soft);line-height:1.5;margin-bottom:8px;
}
.pinned-answer .pa-meta{
  font-size:0.78rem;color:var(--text-muted);
  display:flex;flex-wrap:wrap;gap:6px;
}
.pinned-answer .pa-meta span{display:inline-flex;align-items:center;gap:4px}
.pinned-answer .pa-meta span i{font-size:0.65rem;color:#1e40af}

.group{margin-top:18px}
.group:first-child{margin-top:0}
.group-head{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
  padding-bottom:8px;border-bottom:1px solid var(--line);
}
.group-head i{color:var(--accent);font-size:0.8rem}
.group-label{
  font-size:0.7rem;font-weight:700;text-transform:uppercase;
  letter-spacing:0.06em;color:var(--text-muted);
}
.group-count{
  margin-left:auto;font-size:0.7rem;font-weight:600;
  color:var(--text-muted);font-family:var(--mono);
}

.pricing-table{
  width:100%;border-collapse:collapse;
  font-size:0.86rem;background:white;
  border:1px solid var(--line);border-radius:var(--radius-md);
  overflow:hidden;
}
.pricing-table thead th{
  background:var(--bg-soft);text-align:left;padding:10px 14px;
  font-size:0.68rem;font-weight:700;text-transform:uppercase;
  letter-spacing:0.06em;color:var(--text-muted);
  border-bottom:1px solid var(--line);
}
.pricing-table tbody td{
  padding:10px 14px;border-bottom:1px solid var(--line);
  color:var(--text-soft);vertical-align:middle;
}
.pricing-table tbody tr:last-child td{border-bottom:none}
.pricing-table tbody tr:hover{background:var(--bg-soft)}
.pricing-table tbody tr.exact td{
  background:linear-gradient(90deg,#eff6ff 0%,#ffffff 100%);
  font-weight:600;color:var(--ink);
}
.pricing-table tbody tr.exact td:first-child{border-left:3px solid #3b82f6}
.pricing-table .pt-name{font-weight:600;color:var(--ink);font-size:0.9rem}
.pricing-table .pt-fee{
  font-family:var(--mono);font-weight:700;color:var(--accent-dark);
  white-space:nowrap;text-align:right;
}
.pricing-table .pt-workspace{
  font-size:0.72rem;color:var(--text-muted);
  text-transform:capitalize;
}

.item{
  padding:14px 16px;border-radius:var(--radius-md);
  background:white;border:1px solid var(--line);
  margin-bottom:10px;transition:all 0.15s;
}
.item:hover{border-color:var(--line-2);box-shadow:var(--shadow-xs)}
.item:last-child{margin-bottom:0}
.item-name{
  font-weight:700;color:var(--ink);font-size:0.94rem;
  margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.item-badge{
  font-size:0.6rem;font-weight:700;text-transform:uppercase;
  letter-spacing:0.05em;padding:2px 8px;border-radius:100px;
  background:var(--accent-soft);color:var(--accent-dark);
}
.item-price{
  font-family:var(--mono);font-size:0.88rem;color:var(--accent-dark);
  font-weight:700;margin-bottom:6px;
}
.item-desc{font-size:0.86rem;color:var(--text-soft);line-height:1.55;margin-bottom:8px}
.item-meta{
  font-size:0.76rem;color:var(--text-muted);line-height:1.5;
  display:flex;flex-wrap:wrap;gap:0 6px;
}
.item-meta span{display:inline-flex;align-items:center;gap:4px}
.item-meta span i{font-size:0.65rem;color:var(--accent)}
.item-meta span + span::before{content:"·";margin-right:6px;color:var(--line-2)}
.item-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.item-action{
  padding:5px 12px;border-radius:100px;font-size:0.72rem;font-weight:600;
  background:var(--bg-softer);color:var(--text-soft);
  border:1px solid var(--line);transition:all 0.15s;
  text-decoration:none;display:inline-flex;align-items:center;gap:4px;
}
.item-action:hover{background:var(--accent);color:white;border-color:var(--accent)}
.item-action i{font-size:0.68rem}

.summary{
  font-size:0.88rem;color:var(--text-soft);margin-bottom:12px;font-weight:500;
}
.summary strong{color:var(--ink);font-weight:700}

.no-results{color:var(--text-muted);font-size:0.9rem;font-style:italic;padding:8px 0}
.no-results-suggest{margin-top:8px;font-size:0.84rem;color:var(--text-soft)}

/* Loading indicator */
.typing{display:flex;align-items:center;gap:10px;font-size:0.86rem;color:var(--text-muted);font-style:italic;padding:4px 0}
.typing-dots{display:inline-flex;gap:5px;align-items:center}
.typing-dots span{
  width:7px;height:7px;border-radius:50%;background:var(--text-muted);
  animation:pulse 1.4s infinite ease-in-out;
}
.typing-dots span:nth-child(2){animation-delay:0.2s}
.typing-dots span:nth-child(3){animation-delay:0.4s}
@keyframes pulse{0%,80%,100%{opacity:0.3;transform:scale(0.85)}40%{opacity:1;transform:scale(1)}}

/* ============================================================
   COMPOSER
   ============================================================ */
.composer{
  border-top:1px solid var(--line);
  padding:14px 24px 18px;
  background:var(--bg);
  flex-shrink:0;
}
.composer-inner{max-width:820px;margin:0 auto}

.composer-scope{
  display:flex;align-items:center;gap:6px;
  margin-bottom:8px;
  font-size:0.76rem;color:var(--text-muted);
  min-height:16px;
}
.composer-scope i{color:var(--accent);font-size:0.72rem}
.composer-scope strong{color:var(--text-soft);font-weight:600}
.composer-scope .change{
  margin-left:auto;color:var(--accent-dark);font-weight:600;cursor:pointer;
  padding:2px 8px;border-radius:6px;transition:background 0.12s;font-size:0.76rem;
}
.composer-scope .change:hover{background:var(--accent-tint)}

.composer-row{
  display:flex;align-items:flex-end;gap:10px;
  border:1px solid var(--line-2);border-radius:var(--radius-xl);

<!-- SCOPE PICKER MODAL -->

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
'use strict';

/* ============================================================
   FIREBASE
   ============================================================ */
firebase.initializeApp({
  apiKey: "AIzaSyC7kppUyHUaPzeLBV62NEZWuHiuz1Kz0mA",
  authDomain: "mugera-e51cc.firebaseapp.com",
  databaseURL: "https://mugera-e51cc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mugera-e51cc"
});
const auth = firebase.auth();
const db = firebase.database();

/* ============================================================
   STATE
   ============================================================ */
let currentUser = null;
let currentPerms = {};
const cache = {};

const STORE_KEY = 'janta_assistant_chats_v2';
const ACTIVE_KEY = 'janta_assistant_active_v2';

let chats = [];              // { id, title, createdAt, updatedAt, messages[], pinned, scope }
let activeChatId = null;
let activeScope = 'all';
let chatSearchQuery = '';
let isSending = false;

/* ============================================================
   SCOPE DEFINITIONS
   ============================================================ */
const SCOPES = [
  { id:'all', label:'Ask Anything', icon:'fa-wand-magic-sparkles', permRequired:null,
    desc:'Search businesses, products, services, courses, and resources across your workspaces.' },
  { id:'pricing', label:'Services & Pricing', icon:'fa-tags', permRequired:null,
    desc:'Every priced item — E-Huduma, Fusion, DSOG, WorkFit, Heritage, Mugs n Dines.' },
  { id:'businesses', label:'Businesses', icon:'fa-store', permRequired:null,
    desc:'Registered businesses on BrandInn and their contact details.' },
  { id:'products', label:'Products', icon:'fa-box', permRequired:null,
    desc:'Products across every workspace catalogue.' },
  { id:'services', label:'Services', icon:'fa-concierge-bell', permRequired:null,
    desc:'Services offered by businesses and workspaces.' },
  { id:'courses', label:'Courses', icon:'fa-graduation-cap', permRequired:'learning',
    desc:'Learning courses and certificates.' },
  { id:'resources', label:'Resources', icon:'fa-book-open', permRequired:null,
    desc:'Tools, templates, and reference guides.' }
];

function getScope(id) { return SCOPES.find(s => s.id === id) || SCOPES[0]; }
function scopeAllowed(scope) {
  if (!scope.permRequired) return true;
  if (!currentUser) return false;
  return currentPerms[scope.permRequired] === true || currentPerms.admins === true;
}

/* ============================================================
   DOM
   ============================================================ */
const $ = id => document.getElementById(id);
const sidebar = $('sidebar');
const sidebarToggle = $('sidebarToggle');
const sidebarClose = $('sidebarClose');
const sidebarBackdrop = $('sidebarBackdrop');
const newChatBtn = $('newChatBtn');
const chatListEl = $('chatList');
const chatSearchEl = $('chatSearch');
const chatTitleEl = $('chatTitle');
const chatEl = $('chat');
const chatInnerEl = $('chatInner');
const queryEl = $('query');
const sendBtn = $('send');
const scopeBtn = $('scopeBtn');
const pinBtn = $('pinBtn');
const exportBtn = $('exportBtn');
const deleteBtn = $('deleteBtn');
const scopeModal = $('scopeModal');
const scopeModalBody = $('scopeModalBody');
const scopeModalClose = $('scopeModalClose');
const topbarScope = $('topbarScope');
const topbarScopeLabel = $('topbarScopeLabel');
const composerScope = $('composerScope');
const composerScopeChange = $('composerScopeChange');
const userBtn = $('userBtn');
const userAvatarEl = $('userAvatar');
const userNameEl = $('userName');
const userSubEl = $('userSub');

/* ============================================================
   PERSISTENCE
   ============================================================ */
function loadChats() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    chats = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(chats)) chats = [];
  } catch (e) { chats = []; }
  activeChatId = localStorage.getItem(ACTIVE_KEY) || null;
  if (!chats.find(c => c.id === activeChatId)) {
    activeChatId = chats[0]?.id || null;
  }
}
function saveChats() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(chats));
    if (activeChatId) localStorage.setItem(ACTIVE_KEY, activeChatId);
  } catch (e) { console.warn('save failed', e); }
}
function newId() { return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }

function createChat(initialScope = 'all') {
  const chat = {
    id: newId(),
    title: 'New chat',
    createdAt: Date.now(),
    updatedAt: Date.now(),
    pinned: false,
    scope: initialScope,
    messages: []
  };
  chats.unshift(chat);
  activeChatId = chat.id;
  activeScope = initialScope;
  saveChats();
  renderChatList();
  renderMessages();
  updateTopbar();
  updateComposerScope();
  queryEl.focus();
  return chat;
}
function getActiveChat() { return chats.find(c => c.id === activeChatId) || null; }
function switchChat(id) {
  if (id === activeChatId) return;
  activeChatId = id;
  const c = getActiveChat();
  if (c) activeScope = c.scope || 'all';
  saveChats();
  renderChatList();
  renderMessages();
  updateTopbar();
  updateComposerScope();
  closeSidebarMobile();
}
function deleteChat(id) {
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  if (!confirm(`Delete "${chat.title}"? This can't be undone.`)) return;
  chats = chats.filter(c => c.id !== id);
  if (activeChatId === id) {
    activeChatId = chats[0]?.id || null;
    if (!activeChatId) createChat();
  }
  saveChats();
  renderChatList();
  renderMessages();
  updateTopbar();
  updateComposerScope();
}
function renameChat(id, title) {
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  chat.title = (title || 'Untitled').trim().slice(0, 80) || 'Untitled';
  chat.updatedAt = Date.now();
  saveChats();
  renderChatList();
  updateTopbar();
}
function togglePin(id) {
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  chat.pinned = !chat.pinned;
  chat.updatedAt = Date.now();
  saveChats();
  renderChatList();
  updateTopbar();
}
function addMessage(role, content) {
  const chat = getActiveChat();
  if (!chat) return;
  chat.messages.push({ role, content, at: Date.now() });
  chat.updatedAt = Date.now();
  if (role === 'user' && (chat.title === 'New chat' || !chat.title)) {
    const firstLine = content.split('\n')[0].trim();
    chat.title = firstLine.slice(0, 42) || 'New chat';
  }
  chat.scope = activeScope;
  saveChats();
  renderChatList();
  updateTopbar();
}

/* ============================================================
   RENDER: SIDEBAR
   ============================================================ */
function renderChatList() {
  const q = chatSearchQuery.toLowerCase().trim();
  let filtered = chats.slice();
  if (q) {
    filtered = filtered.filter(c =>
      c.title.toLowerCase().includes(q) ||
      c.messages.some(m => (typeof m.content === 'string') && m.content.toLowerCase().includes(q))
    );
  }
  const pinned = filtered.filter(c => c.pinned);
  const unpinned = filtered.filter(c => !c.pinned);

  unpinned.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

  const groups = groupByDate(unpinned);

  let html = '';
  if (pinned.length) {
    html += `<div class="chat-group-label">Pinned</div>`;
    html += pinned.map(renderChatRow).join('');
  }
  for (const [label, items] of groups) {
    if (!items.length) continue;
    html += `<div class="chat-group-label">${esc(label)}</div>`;
    html += items.map(renderChatRow).join('');
  }
  if (!html) {
    html = `<div style="text-align:center;padding:24px 12px;color:var(--text-muted);font-size:0.8rem;">${q ? 'No chats match your search' : 'No chats yet — start a new one'}</div>`;
  }
  chatListEl.innerHTML = html;

  chatListEl.querySelectorAll('.chat-row').forEach(row => {
    const id = row.dataset.id;
    row.addEventListener('click', e => {
      if (e.target.closest('.chat-row-action')) return;
      switchChat(id);
    });
    row.querySelectorAll('.chat-row-action[data-act]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const act = btn.dataset.act;
        if (act === 'pin') togglePin(id);
        else if (act === 'delete') deleteChat(id);
      });
    });
  });
}

function groupByDate(items) {
  const now = Date.now();
  const DAY = 86400000;
  const today = new Date(); today.setHours(0,0,0,0);
  const yest = today - DAY;
  const week = today - 7 * DAY;

  const groups = new Map([['Today', []], ['Yesterday', []], ['Last 7 days', []], ['Older', []]]);
  items.forEach(c => {
    const t = c.updatedAt || c.createdAt || now;
    if (t >= today.getTime()) groups.get('Today').push(c);
    else if (t >= yest) groups.get('Yesterday').push(c);
    else if (t >= week) groups.get('Last 7 days').push(c);
    else groups.get('Older').push(c);
  });
  return Array.from(groups.entries()).filter(([_, arr]) => arr.length);
}

function renderChatRow(c) {
  const active = c.id === activeChatId ? ' active' : '';
  const pinned = c.pinned ? ' pinned' : '';
  return `<div class="chat-row${active}" data-id="${esc(c.id)}">
    <div class="chat-row-icon"><i class="fas ${c.pinned ? 'fa-thumbtack' : 'fa-comment'}"></i></div>
    <div class="chat-row-title">${esc(c.title)}</div>
    <div class="chat-row-actions">
      <button class="chat-row-action${pinned}" data-act="pin" title="${c.pinned ? 'Unpin' : 'Pin'}"><i class="fas fa-thumbtack"></i></button>
      <button class="chat-row-action danger" data-act="delete" title="Delete"><i class="fas fa-trash"></i></button>
    </div>
  </div>`;
}

/* ============================================================
   RENDER: MESSAGES
   ============================================================ */
function renderMessages() {
  const chat = getActiveChat();
  chatInnerEl.innerHTML = '';

  if (!chat || !chat.messages.length) {
    renderWelcome();
    return;
  }

  chat.messages.forEach(m => renderMessage(m));
  scrollChatBottom();
}

function renderWelcome() {
  const hi = partOfDay();
  const name = firstName();

  const cards = [
    { icon:'fa-tags', title:'Prices across the ecosystem', desc:'"How much is eTIMS?" or "cabbage price"', q:'eTIMS', scope:'pricing' },
    { icon:'fa-store', title:'Find a business', desc:'"Best Furniture" or "metal fabrication"', q:'Best Furniture', scope:'businesses' },
    { icon:'fa-box', title:'Find a product', desc:'"cypress bed under 25k"', q:'cypress bed under 25k', scope:'products' },
    { icon:'fa-graduation-cap', title:'Find a course', desc:'"courses on writing"', q:'writing', scope:'courses' }
  ];

  chatInnerEl.innerHTML = `
    <div class="welcome">
      <div class="welcome-icon"><i class="fas fa-wand-magic-sparkles"></i></div>
      <h1>${esc(hi)}${name ? ', ' + esc(name) : ''}</h1>
      <p>Ask about any service, product, or price across the KazInni ecosystem — E-Huduma, Fusion Foods, DSOG, BrandInn, WorkFit, Heritage and Mugs n Dines.</p>
      <div class="welcome-grid">
        ${cards.map(c => `
          <button class="welcome-card" data-query="${esc(c.q)}" data-scope="${esc(c.scope)}">
            <div class="welcome-card-icon"><i class="fas ${c.icon}"></i></div>
            <div class="welcome-card-title">${esc(c.title)}</div>
            <div class="welcome-card-desc">${esc(c.desc)}</div>
          </button>
        `).join('')}
      </div>
    </div>
  `;

  chatInnerEl.querySelectorAll('.welcome-card').forEach(btn => {
    btn.addEventListener('click', () => {
      const sc = btn.dataset.scope;
      if (scopeAllowed(getScope(sc))) setScope(sc);
      queryEl.value = btn.dataset.query;
      queryEl.dispatchEvent(new Event('input'));
      sendMessage();
    });
  });
}

function renderMessage(m) {
  if (m.role === 'user') {
    const el = document.createElement('div');
    el.className = 'msg msg-user';
    el.innerHTML = `<div class="msg-bubble"></div>`;
    el.querySelector('.msg-bubble').textContent = m.content;
    chatInnerEl.appendChild(el);
  } else {
    const el = document.createElement('div');
    el.className = 'msg msg-janta';
    el.innerHTML = `<div class="msg-avatar"><i class="fas fa-wand-magic-sparkles"></i></div><div class="msg-body"></div>`;
    el.querySelector('.msg-body').innerHTML = m.content;
    chatInnerEl.appendChild(el);
  }
}

function appendLiveMessage(role) {
  const el = document.createElement('div');
  el.className = 'msg msg-' + role;
  if (role === 'user') {
    el.innerHTML = `<div class="msg-bubble"></div>`;
  } else {
    el.innerHTML = `<div class="msg-avatar"><i class="fas fa-wand-magic-sparkles"></i></div><div class="msg-body"></div>`;
  }
  chatInnerEl.appendChild(el);
  scrollChatBottom();
  return el;
}

function scrollChatBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

/* ============================================================
   TOPBAR / COMPOSER STATE
   ============================================================ */

  const c = getActiveChat();

function updateComposerScope() {
  const scope = getScope(activeScope);
  if (activeScope === 'all') {
    composerScope.innerHTML = `
      <i class="fas fa-wand-magic-sparkles"></i>
      Searching <strong>across all workspaces</strong>
      <span class="change" id="composerScopeChange">change</span>
    `;

    composerScope.innerHTML = `
      <i class="fas ${scope.icon}"></i>
      Searching only in <strong>${esc(scope.label)}</strong>
      <span class="change" id="composerScopeChange">change</span>
    `;

  const ch = document.getElementById('composerScopeChange');
  if (ch) ch.addEventListener('click', openScopeModal);

function setScope(id) {
  const scope = getScope(id);
  if (!scopeAllowed(scope)) return;
  activeScope = id;
  const c = getActiveChat();
  if (c) { c.scope = id; saveChats(); }
  updateTopbar();
  updateComposerScope();
}

function openScopeModal() {
  let html = '';
  SCOPES.forEach(s => {
    const allowed = scopeAllowed(s);
    const active = s.id === activeScope ? ' active' : '';
    const locked = allowed ? '' : ' locked';
    html += `<button class="scope-option${active}${locked}" data-scope="${esc(s.id)}" ${allowed ? '' : 'disabled'}>
      <div class="scope-option-icon"><i class="fas ${s.icon}"></i></div>
      <div class="scope-option-body">
        <div class="scope-option-name">${esc(s.label)}${allowed ? '' : ' <i class="fas fa-lock lock"></i>'}</div>
        <div class="scope-option-desc">${esc(s.desc)}</div>
      </div>
      <div class="scope-option-check"><i class="fas fa-check"></i></div>
    </button>`;
  });
  scopeModalBody.innerHTML = html;
  scopeModal.classList.add('open');

  scopeModalBody.querySelectorAll('.scope-option:not(.locked)').forEach(btn => {
    btn.addEventListener('click', () => {
      setScope(btn.dataset.scope);
      scopeModal.classList.remove('open');
    });
  });
}
function closeScopeModal() { scopeModal.classList.remove('open'); }

   ============================================================ */
queryEl.addEventListener('input', () => {
  queryEl.style.height = 'auto';
  queryEl.style.height = Math.min(queryEl.scrollHeight, 160) + 'px';
  sendBtn.disabled = !queryEl.value.trim() || isSending;
});
queryEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (queryEl.value.trim() && !isSending) sendMessage();
  }
});
sendBtn.addEventListener('click', () => { if (!isSending) sendMessage(); });

async function sendMessage() {
  const q = queryEl.value.trim();
  if (!q || isSending) return;

  isSending = true;
  queryEl.value = '';
  queryEl.style.height = 'auto';
  sendBtn.disabled = true;

  if (!getActiveChat()) createChat(activeScope);

  const userEl = appendLiveMessage('user');
  userEl.querySelector('.msg-bubble').textContent = q;
  addMessage('user', q);

  const jantaEl = appendLiveMessage('janta');
  const body = jantaEl.querySelector('.msg-body');
  body.innerHTML = `<div class="typing"><div class="typing-dots"><span></span><span></span><span></span></div> Searching…</div>`;

  const conv = detectConversation(q);
  if (conv) {
    body.innerHTML = `<div class="opener">${conv.reply()}</div>`;
    addMessage('assistant', body.innerHTML);
    isSending = false;
    sendBtn.disabled = !queryEl.value.trim();
    return;
  }

  try {
    const tokens = tokenize(q);
    const priceCap = extractPriceCap(q);
    const scope = getScope(activeScope);
    const results = await runScopedSearch(scope.id, tokens, priceCap, q);
    const html = renderResults(results, priceCap, scope, q);
    body.innerHTML = html;
    addMessage('assistant', html);
  } catch (err) {
    console.error(err);
    body.innerHTML = '<span class="no-results">Something went wrong. Try again.</span>';
    addMessage('assistant', body.innerHTML);
  }

  isSending = false;
  sendBtn.disabled = !queryEl.value.trim();
  scrollChatBottom();
}

async function getBusinesses() {
  if (cache.businesses) return cache.businesses;
  const snap = await db.ref('brandinn_subdomains').once('value');
  const val = snap.val() || {};
  cache.businesses = Object.entries(val).map(([slug,b])=>({slug,...b}))
    .filter(b=>b.status==='active'||b.businessName);
  return cache.businesses;
}
async function getCourses() {
  if (cache.courses) return cache.courses;
  const snap = await db.ref('learning_courses').once('value');
  const val = snap.val() || {};
  cache.courses = Object.entries(val).map(([id,c])=>({id,...c}))
    .filter(c=>c.published===true);
  return cache.courses;
}
async function getResources() {
  if (cache.resources) return cache.resources;
  const snap = await db.ref('resources').once('value');
  const val = snap.val() || {};
  const out=[];
  for (const [section, items] of Object.entries(val)) {
    if (!items || typeof items !== 'object') continue;
    for (const [id, r] of Object.entries(items)) {
      if (!r || typeof r !== 'object') continue;
      out.push({id, section, ...r});
    }
  }
  cache.resources = out;
  return out;
}
async function getCatalogue() {
  if (cache.catalogue) return cache.catalogue;
  const items = [];
  const sources = Object.values(CATALOGUE);
  await Promise.all(sources.map(async src => {
    try {
      const snap = await db.ref(src.path).once('value');
      const val = snap.val() || {};
      if (src.nested && src.extract) {
        for (const [slug, b] of Object.entries(val)) {
          const ext = src.extract(slug, b);
          for (const e of ext) items.push(e);
        }
      } else if (src.build) {
        for (const [id, raw] of Object.entries(val)) {
          if (!raw || typeof raw !== 'object') continue;
          items.push(src.build(id, raw));
        }
      }
    } catch (e) { console.warn(`Catalogue ${src.path} failed:`, e); }
  }));
  cache.catalogue = items;
  return items;
}

/* ============================================================
   SEARCH
   ============================================================ */
const STOP_WORDS = new Set(['a','an','the','is','are','was','were','be','being','been','of','in','on','at','to','for','with','by','from','about','and','or','but','if','so','as','than','then','that','this','these','those','it','its','i','you','we','they','he','she','me','my','our','your','their','his','her','them','us','do','does','did','have','has','had','can','could','will','would','should','may','might','must','what','which','who','whom','whose','where','when','why','how','any','some','all','no','not','only','just','show','find','give','tell','please','need','want','looking','look','see','get','much','price','cost','fee','charge','whats']);

function tokenize(q) {
  return q.toLowerCase().replace(/[^\w\s]/g,' ').split(/\s+/)
    .filter(w => w && !STOP_WORDS.has(w) && w.length > 1);
}
function extractPriceCap(q) {
  const m = q.match(/(?:under|below|less than|<)\s*(?:ksh|kes)?\s*([\d,]+)\s*(k)?/i);
  if (!m) return null;
  let n = parseInt(m[1].replace(/,/g,''),10);
  if (m[2]) n *= 1000;
  return isNaN(n) ? null : n;
}
function score(text, tokens) {
  if (!text) return 0;
  const lower = String(text).toLowerCase();
  let s = 0;
  for (const t of tokens) {
    if (lower.includes(t)) {
      const re = new RegExp('\\b' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b');
      s += re.test(lower) ? 3 : 1;
    }
  }
  return s;
}

async function runScopedSearch(scopeId, tokens, priceCap, rawQuery) {
  const R = { businesses:[], products:[], services:[], courses:[], resources:[], catalogue:[] };
  const wantBiz = scopeId==='all'||scopeId==='businesses';
  const wantProd = scopeId==='all'||scopeId==='products'||scopeId==='pricing';
  const wantSvc = scopeId==='all'||scopeId==='services'||scopeId==='pricing';
  const wantCat = scopeId==='pricing'||scopeId==='all';
  const wantCrs = scopeId==='all'||scopeId==='courses';
  const wantRes = scopeId==='all'||scopeId==='resources';
  const canCrs = wantCrs && currentUser && (currentPerms.learning===true||currentPerms.admins===true);

  const [biz, crs, res, cat] = await Promise.all([
    (wantBiz||wantProd||wantSvc) ? getBusinesses() : Promise.resolve([]),
    canCrs ? getCourses() : Promise.resolve([]),
    wantRes ? getResources() : Promise.resolve([]),
    wantCat ? getCatalogue() : Promise.resolve([])
  ]);

  if (wantBiz) {
    for (const b of biz) {
      const text = [b.businessName,b.name,b.tagline,b.category,b.industry,b.description,b.area,b.road].filter(Boolean).join(' ');
      const s = score(text, tokens);
      if (s > 0) R.businesses.push({ item:b, score:s });
    }
  }
  if (wantProd || wantSvc) {
    for (const b of biz) {
      const pd = b.pageData||{};
      const bizName = b.businessName||b.name||b.slug;
      const phone = b.phone||pd.contact?.phone||'';
      const address = b.address||pd.contact?.address||'';
      if (wantProd) for (const p of (pd.products||[])) {
        const text = [p.name,p.title,p.desc,p.description,p.category].filter(Boolean).join(' ');
        const s = score(text, tokens);
        const price = Number(p.price)||0;
        if (s>0 && (!priceCap||price<=priceCap)) R.products.push({ item:p, score:s, bizName, phone, address });
      }
      if (wantSvc) for (const sv of (pd.services||[])) {
        const text = [sv.title,sv.desc,sv.tag,(sv.features||[]).join(' ')].filter(Boolean).join(' ');
        const s = score(text, tokens);
        const price = Number(String(sv.price||'').replace(/[^\d]/g,''))||0;
        if (s>0 && (!priceCap||price===0||price<=priceCap)) R.services.push({ item:sv, score:s, bizName, phone, address });
      }
    }
  }
  if (wantCat) {
    for (const c of cat) {
      const text = [c.name,c.description,c.workspace,(c.meta||[]).join(' ')].filter(Boolean).join(' ');
      const s = score(text, tokens);
      const priceOk = !priceCap || c.price===0 || c.price<=priceCap;
      if (s>0 && priceOk) R.catalogue.push({ item:c, score:s });
    }
  }
  if (canCrs) {
    for (const c of crs) {
      const text = [c.title,c.desc,c.longDesc,c.category,c.level].filter(Boolean).join(' ');
      const s = score(text, tokens);
      if (s>0) R.courses.push({ item:c, score:s });
    }
  }
  if (wantRes) {
    for (const r of res) {
      const text = [r.title,r.description,r.workspace].filter(Boolean).join(' ');
      const s = score(text, tokens);
      if (s>0) R.resources.push({ item:r, score:s });
    }
  }

  ['businesses','products','services','courses','resources','catalogue'].forEach(k => {
    R[k].sort((a,b)=>b.score-a.score);
    R[k] = R[k].slice(0,12);
  });

  R.exactMatch = pickExactMatch(rawQuery, R.catalogue, R.products, R.services);
  return R;
}

function pickExactMatch(rawQuery, catalogue, products, services) {
  const q = rawQuery.toLowerCase();
  const candidates = [];

  for (const { item } of (catalogue||[])) {
    const name = (item.name||'').toLowerCase();
    let bonus = 0;
    if (name === q) bonus = 100;
    else if (name.includes(q) || q.includes(name)) bonus = 60;
    else {
      const words = q.split(/\s+/).filter(w=>w.length>2);
      const hits = words.filter(w=>name.includes(w)).length;
      if (hits>0) bonus = hits*20;
    }
    if (bonus>0) candidates.push({ ...item, _bonus:bonus });
  }
  for (const { item } of (products||[])) {
    const name = (item.name||item.title||'').toLowerCase();
    if (name.includes(q)||q.includes(name)) {
      candidates.push({
        workspace:'BrandInn', name:item.name||item.title,
        price:Number(item.price)||0,
        priceLabel:Number(item.price)?`KSh ${Number(item.price).toLocaleString()}`:'Contact for pricing',
        description:item.desc||item.description||'',
        meta:[], _bonus:40
      });
    }
  }
  for (const { item } of (services||[])) {
    const name = (item.title||'').toLowerCase();
    if (name.includes(q)||q.includes(name)) {
      const price = Number(String(item.price||'').replace(/[^\d]/g,''))||0;
      candidates.push({
        workspace:'BrandInn', name:item.title,
        price,
        priceLabel:item.price?String(item.price):(price?`KSh ${price.toLocaleString()}`:'Contact for pricing'),
        description:item.desc||'',
        meta:[], _bonus:40
      });
    }
  }
  candidates.sort((a,b)=>b._bonus-a._bonus);
  return candidates[0]||null;
}

/* ============================================================
   CONVERSATION
   ============================================================ */
function partOfDay() {
  const h = new Date().getHours();
  if (h<12) return 'Good morning';
  if (h<17) return 'Good afternoon';
  if (h<21) return 'Good evening';
  return 'Good night';
}
function firstName() {
  if (!currentUser) return '';
  const raw = currentUser.displayName||currentUser.email||'';
  const first = raw.split(/[@\s._-]/)[0]||'';
  return first ? first.charAt(0).toUpperCase()+first.slice(1) : '';
}

const CONVERSATION_RULES = [
  { id:'greeting',
    patterns:[/^(hi|hey|hello|yo|hiya|howdy|sup|habari|niaje|sasa|mambo|jambo)\b/i, /^(janta|assistant)$/i,
              /^(good\s+(morning|afternoon|evening|night))\b/i],
    reply:()=>`${partOfDay()}${firstName()?', '+firstName():''}. What would you like to price or find?` },
  { id:'howareyou',
    patterns:[/how\s+are\s+you/i, /how'?s\s+it\s+going/i, /umeamkaje/i],
    reply:()=>`Running well. Ready to price-check anything across KazInni.` },
  { id:'whoareyou',
    patterns:[/who\s+are\s+you/i, /what\s+are\s+you/i, /what\s+can\s+you\s+do/i],
    reply:()=>`I search across every workspace — E-Huduma, Fusion Foods, DSOG, BrandInn, WorkFit, Heritage and Mugs n Dines. Ask me a service or product and I'll show you the exact price.` },
  { id:'help',
    patterns:[/^help$/i, /^help\s+me$/i],
    reply:()=>`Just ask in your own words — for example:<br>› how much is eTIMS?<br>› cabbage price<br>› cypress bed under 25k<br>› passport fee` },
  { id:'thanks',
    patterns:[/^(thanks|thank\s+you|thx|asante)\b/i],
    reply:()=>`You're welcome. Anything else?` },
  { id:'bye',
    patterns:[/^(bye|goodbye|see\s+you|later|kwaheri)\b/i],
    reply:()=>`Kwaheri. Come back any time.` }
];

function detectConversation(q) {
  const text = q.trim();
  for (const rule of CONVERSATION_RULES) {
    for (const pattern of rule.patterns) {
      if (pattern.test(text)) return rule;
    }
  }
  return null;
}

/* ============================================================
   RENDER RESULTS
   ============================================================ */
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderResults(R, priceCap, scope, rawQuery) {
  const total = R.businesses.length + R.courses.length + R.products.length + R.services.length + R.resources.length + R.catalogue.length;

  if (total === 0) {
    return `<div class="no-results">Nothing matches "${esc(rawQuery)}" on KazInni.</div>
            <div class="no-results-suggest">Try a different word, or change the scope above.</div>`;
  }

  const parts = [];

  if (R.exactMatch) {
    const e = R.exactMatch;
    parts.push(`<div class="pinned-answer">
      <div class="pa-label">Answer</div>
      <div class="pa-title">${esc(e.name)}</div>
      <div class="pa-price">${esc(e.priceLabel)}</div>
      ${e.description ? `<div class="pa-context">${esc(e.description.slice(0,280))}${e.description.length>280?'…':''}</div>` : ''}
      <div class="pa-meta">
        <span><i class="fas fa-folder"></i>${esc(e.workspace)}</span>
        ${(e.meta||[]).map(m=>`<span><i class="fas fa-info-circle"></i>${esc(m)}</span>`).join('')}
      </div>
    </div>`);
  }

  const cap = priceCap ? ` under KSh ${priceCap.toLocaleString()}` : '';
  const scopeLabel = scope.id==='all' ? '' : ` in ${scope.label}`;
  parts.push(`<div class="summary">Found <strong>${total} match${total===1?'':'es'}</strong>${esc(cap)}${esc(scopeLabel)} on KazInni.</div>`);

  if (R.catalogue.length) {
    const exactId = R.exactMatch?.sourceId;
    parts.push(renderPricingTable(R.catalogue.map(r=>r.item), exactId));
  }
  if (R.businesses.length) parts.push(renderGroup('Businesses','fa-store',R.businesses.length,R.businesses.map(r=>renderBusiness(r.item)).join('')));
  if (R.products.length) parts.push(renderGroup('Products','fa-box',R.products.length,R.products.map(r=>renderProduct(r)).join('')));
  if (R.services.length) parts.push(renderGroup('Services','fa-concierge-bell',R.services.length,R.services.map(r=>renderService(r)).join('')));
  if (R.courses.length) parts.push(renderGroup('Courses','fa-graduation-cap',R.courses.length,R.courses.map(r=>renderCourse(r.item)).join('')));
  if (R.resources.length) parts.push(renderGroup('Resources','fa-book-open',R.resources.length,R.resources.map(r=>renderResource(r.item)).join('')));

  return parts.join('');
}

function renderPricingTable(items, exactId) {
  if (!items.length) return '';
  const rows = items.map(c => {
    const isExact = c.sourceId === exactId;
    return `<tr class="${isExact?'exact':''}">
      <td class="pt-name">${esc(c.name)}</td>
      <td class="pt-workspace">${esc(c.workspace)}</td>
      <td class="pt-fee">${esc(c.priceLabel)}</td>
    </tr>`;
  }).join('');
  return `<div class="group">
    <div class="group-head"><i class="fas fa-tags"></i><span class="group-label">Full price list</span><span class="group-count">${items.length}</span></div>
    <table class="pricing-table"><thead><tr><th>Service / Product</th><th>Workspace</th><th style="text-align:right;">Price</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

function renderGroup(label, icon, count, inner) {
  return `<div class="group"><div class="group-head"><i class="fas ${icon}"></i><span class="group-label">${esc(label)}</span><span class="group-count">${count}</span></div>${inner}</div>`;
}

function renderBusiness(b) {
  const pd = b.pageData||{};
  const name = b.businessName||b.name||b.slug;
  const tagline = pd.business?.tagline||b.tagline||'';
  const category = pd.business?.category||b.category||b.industry||'';
  const address = pd.contact?.address||b.address||'';
  const phone = pd.contact?.phone||b.phone||'';
  const email = pd.contact?.email||b.email||'';
  const desc = pd.business?.description||b.description||'';
  return `<div class="item">
    <div class="item-name">${esc(name)}${category?`<span class="item-badge">${esc(category)}</span>`:''}</div>
    ${tagline?`<div class="item-desc" style="color:var(--accent-dark);font-weight:500;">${esc(tagline)}</div>`:''}
    ${desc?`<div class="item-desc">${esc(desc)}</div>`:''}
    <div class="item-meta">
      ${address?`<span><i class="fas fa-location-dot"></i>${esc(address)}</span>`:''}
      ${phone?`<span><i class="fas fa-phone"></i>${esc(phone)}</span>`:''}
      ${email?`<span><i class="fas fa-envelope"></i>${esc(email)}</span>`:''}
    </div>
    <div class="item-actions">
      ${phone?`<a href="tel:${esc(phone)}" class="item-action"><i class="fas fa-phone"></i>Call</a>`:''}
      ${email?`<a href="mailto:${esc(email)}" class="item-action"><i class="fas fa-envelope"></i>Email</a>`:''}
    </div>
  </div>`;
}
function renderProduct(r) {
  const p = r.item;
  const name = p.name||p.title||'Product';
  const price = Number(p.price);
  const desc = p.desc||p.description||'';
  return `<div class="item">
    <div class="item-name">${esc(name)}${p.category?`<span class="item-badge">${esc(p.category)}</span>`:''}</div>
    ${price?`<div class="item-price">KSh ${price.toLocaleString()}</div>`:''}
    ${desc?`<div class="item-desc">${esc(desc.slice(0,300))}${desc.length>300?'…':''}</div>`:''}
    <div class="item-meta">
      ${r.bizName?`<span><i class="fas fa-store"></i>${esc(r.bizName)}</span>`:''}
      ${r.phone?`<span><i class="fas fa-phone"></i>${esc(r.phone)}</span>`:''}
    </div>
  </div>`;
}
function renderService(r) {
  const s = r.item;
  const title = s.title||'Service';
  const price = s.price?String(s.price):'';
  const desc = s.desc||'';
  const features = s.features||[];
  return `<div class="item">
    <div class="item-name">${esc(title)}${s.tag?`<span class="item-badge">${esc(s.tag)}</span>`:''}</div>
    ${price?`<div class="item-price">${esc(price)}</div>`:''}
    ${desc?`<div class="item-desc">${esc(desc)}</div>`:''}
    ${features.length?`<ul style="font-size:0.84rem;color:var(--text-soft);margin:8px 0;padding-left:18px;">${features.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
    <div class="item-meta">
      ${r.bizName?`<span><i class="fas fa-store"></i>${esc(r.bizName)}</span>`:''}
      ${r.phone?`<span><i class="fas fa-phone"></i>${esc(r.phone)}</span>`:''}
    </div>
  </div>`;
}
function renderCourse(c) {
  const title = c.title||'Course';
  const cat = c.category||'';
  const level = c.level||'';
  const duration = c.duration?`${c.duration} min`:'';
  const desc = c.longDesc||c.desc||'';
  const lessonCount = Object.keys(c.lessons||{}).length;
  return `<div class="item">
    <div class="item-name">${esc(title)}${cat?`<span class="item-badge">${esc(cat)}</span>`:''}</div>
    ${desc?`<div class="item-desc">${esc(desc.slice(0,300))}${desc.length>300?'…':''}</div>`:''}
    <div class="item-meta">
      ${level?`<span><i class="fas fa-signal"></i>${esc(level)}</span>`:''}
      ${duration?`<span><i class="fas fa-clock"></i>${esc(duration)}</span>`:''}
      ${lessonCount?`<span><i class="fas fa-list-check"></i>${lessonCount} lesson${lessonCount===1?'':'s'}</span>`:''}
    </div>
    <div class="item-actions">
      <a href="learning/course.html?id=${encodeURIComponent(c.id)}" class="item-action"><i class="fas fa-arrow-right"></i>Open course</a>
    </div>
  </div>`;
}
function renderResource(r) {
  const title = r.title||'Resource';
  const desc = r.description||'';
  const workspace = r.workspace||r.section||'';
  return `<div class="item">
    <div class="item-name">${esc(title)}</div>
    ${desc?`<div class="item-desc">${esc(desc)}</div>`:''}
    <div class="item-meta">${workspace?`<span><i class="fas fa-folder"></i>${esc(workspace)}</span>`:''}</div>
    <div class="item-actions">${r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener" class="item-action"><i class="fas fa-external-link-alt"></i>Open</a>`:''}</div>
  </div>`;
}

/* ============================================================
   SIDEBAR MOBILE
   ============================================================ */
function openSidebarMobile() { document.body.classList.add('sidebar-open'); }
function closeSidebarMobile() { document.body.classList.remove('sidebar-open'); }
sidebarToggle.addEventListener('click', openSidebarMobile);
sidebarClose.addEventListener('click', closeSidebarMobile);
sidebarBackdrop.addEventListener('click', closeSidebarMobile);

/* ============================================================
   TOPBAR ACTIONS
   ============================================================ */
chatTitleEl.addEventListener('click', () => {
  const c = getActiveChat();
  if (!c) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'chat-title-input';
  input.value = c.title;
  chatTitleEl.replaceWith(input);
  input.focus();
  input.select();
  const finish = (save) => {
    const title = input.value.trim();
    const newEl = document.createElement('div');
    newEl.id = 'chatTitle';
    newEl.className = 'chat-title';
    newEl.title = 'Click to rename';
    input.replaceWith(newEl);
    if (save && title) renameChat(c.id, title);
    else updateTopbar();
    newEl.addEventListener('click', arguments.callee);
  };
  input.addEventListener('blur', () => finish(true));
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    else if (e.key === 'Escape') { finish(false); }
  });
});

scopeBtn.addEventListener('click', openScopeModal);
topbarScope.addEventListener('click', openScopeModal);
scopeModalClose.addEventListener('click', closeScopeModal);
scopeModal.addEventListener('click', e => { if (e.target === scopeModal) closeScopeModal(); });

pinBtn.addEventListener('click', () => {
  const c = getActiveChat();
  if (c) togglePin(c.id);
});

deleteBtn.addEventListener('click', () => {
  if (activeChatId) deleteChat(activeChatId);
});

exportBtn.addEventListener('click', () => {
  const c = getActiveChat();
  if (!c) return;
  const lines = [`Janta Assistant — ${c.title}`, new Date(c.createdAt).toLocaleString(), ''];
  c.messages.forEach(m => {
    if (m.role === 'user') lines.push(`You: ${m.content}`, '');
    else {
      const tmp = document.createElement('div');
      tmp.innerHTML = m.content;
      lines.push(`Janta: ${tmp.textContent.trim()}`, '');
    }
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `janta-${c.title.replace(/[^a-z0-9]/gi,'-').toLowerCase().slice(0,40)||'chat'}.txt`;
  a.click();
  URL.revokeObjectURL(url);
});

newChatBtn.addEventListener('click', () => {
  createChat(activeScope);
  closeSidebarMobile();
});

chatSearchEl.addEventListener('input', () => {
  chatSearchQuery = chatSearchEl.value;
  renderChatList();
});

userBtn.addEventListener('click', () => {
  window.location.href = currentUser ? 'account.html' : 'index.html';
});

/* ============================================================
   AUTH
   ============================================================ */
auth.onAuthStateChanged(async user => {
  currentUser = user;
  if (user) {
    const name = (user.displayName||user.email||'U').split(/[@\s._-]/)[0];
    userAvatarEl.textContent = name.slice(0,1).toUpperCase();
    userNameEl.textContent = user.displayName || name;
    userSubEl.textContent = user.email || '';
    try {
      const snap = await db.ref(`workspacePermissions/${user.uid}`).once('value');
      currentPerms = snap.exists() ? (snap.val()||{}) : {};
    } catch(e){ currentPerms = {}; }
  } else {
    userAvatarEl.textContent = 'G';
    userNameEl.textContent = 'Guest';
    userSubEl.textContent = 'Sign in to save chats';
    currentPerms = {};
  }
  // Re-evaluate courses scope
  if (activeScope === 'courses' && !scopeAllowed(getScope('courses'))) {
    activeScope = 'all';
  }
  updateTopbar();
  updateComposerScope();
});

/* ============================================================
   INIT
   ============================================================ */
loadChats();
if (!chats.length) createChat('all');
renderChatList();
renderMessages();
updateTopbar();
updateComposerScope();
</script>
