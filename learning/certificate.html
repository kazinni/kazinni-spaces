<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ca8a04">
<title>Certificates — KazInni Learning</title>
<link rel="icon" type="image/x-icon" href="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview-1.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;600;700;800&family=Satoshi:wght@400;500;600;700;800;900&family=Clash+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?v=2&f[]=cabinet-grotesk@400,500,600,700,800&f[]=satoshi@400,500,600,700,800,900&f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root{--gold:#ca8a04;--gold-dark:#a16207;--gold-soft:#fef3c7;--gold-gradient:linear-gradient(135deg,#ca8a04 0%,#eab308 50%,#fbbf24 100%);--ink:#0f0f1e;--success:#10b981;--text-2:#4a4a5e;--muted:#6b7280;--border:#e9ecef;--border-2:#d1d5db;--surface:#fff;--surface-2:#faf9f7;--header-h:60px;--f-display:'Clash Display','Cabinet Grotesk',sans-serif;--f-head:'Satoshi','Cabinet Grotesk',sans-serif;--f-body:'Satoshi','Cabinet Grotesk',sans-serif;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-pill:100px;--t-fast:.15s cubic-bezier(.2,.8,.2,1);--t-base:.25s cubic-bezier(.2,.8,.2,1)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f-body);background:var(--surface-2);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.ws-header{position:sticky;top:0;z-index:1000;height:var(--header-h);background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(15,15,30,.06);padding:0 1rem;display:flex;align-items:center}
.ws-header-inner{width:100%;max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:1rem}
.ws-logo{display:flex;align-items:center;gap:.55rem;text-decoration:none}
.ws-logo img{height:30px}
.ws-logo-text{font-family:var(--f-display);font-weight:800;font-size:1.05rem;color:var(--ink)}
.ws-logo-text .accent{background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ws-nav-links{display:flex;align-items:center;gap:1.4rem;margin-left:1rem}
.ws-nav-link{color:var(--text-2);text-decoration:none;font-size:.85rem;font-weight:500;font-family:var(--f-head);padding:.4rem 0}
.ws-nav-link.active{color:var(--gold-dark);font-weight:600}
.ws-header-right{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.ws-btn{padding:.6rem 1.2rem;border:none;border-radius:var(--r-pill);font-weight:600;font-size:.84rem;cursor:pointer;transition:all var(--t-base);text-decoration:none;display:inline-flex;align-items:center;gap:.5rem;font-family:var(--f-head);white-space:nowrap}
.ws-btn-primary{background:var(--ink);color:#fff}
.ws-btn-primary:hover{background:var(--gold)}
.ws-btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--border-2)}
.ws-btn-ghost:hover{border-color:var(--ink);background:var(--ink);color:#fff}
.ws-account-chip{display:flex;align-items:center;gap:.5rem;padding:.3rem .8rem .3rem .3rem;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--border);font-family:var(--f-head);font-size:.8rem;font-weight:600;color:var(--ink);text-decoration:none}
.ws-avatar{width:28px;height:28px;border-radius:50%;background:var(--gold-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem}
main{flex:1;padding:3rem 2rem 4rem}
.inner{max-width:1000px;margin:0 auto}
.hero-eyebrow{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .9rem;background:#fff;border:1px solid rgba(202,138,4,.22);border-radius:var(--r-pill);font-size:.68rem;font-weight:700;color:var(--gold-dark);margin-bottom:1.4rem;font-family:var(--f-head);text-transform:uppercase;letter-spacing:1px}
.hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
h1{font-family:var(--f-display);font-size:clamp(2rem,4vw,2.8rem);font-weight:700;letter-spacing:-.035em;margin-bottom:.5rem;text-align:center}
h1 .accent{background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-style:italic;font-weight:500}
.hero-lede{text-align:center;color:var(--muted);max-width:520px;margin:0 auto 2.5rem}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem}
.cert-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:1.4rem 1.3rem;display:flex;flex-direction:column;gap:1rem;transition:all var(--t-base)}
.cert-card:hover{transform:translateY(-2px);box-shadow:0 20px 48px rgba(15,15,30,.08)}
.cert-badge{width:48px;height:48px;border-radius:14px;background:var(--gold-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 10px 24px rgba(202,138,4,.25)}
.cert-title{font-family:var(--f-head);font-size:.95rem;font-weight:700;color:var(--ink);margin-bottom:.3rem}
.cert-meta,.cert-id{font-size:.75rem;color:var(--muted);font-family:var(--f-head)}
.cert-actions{display:flex;gap:.5rem;margin-top:auto;padding-top:.8rem;border-top:1px dashed var(--border)}
.cert-actions .ws-btn{flex:1;justify-content:center}
.empty-state{grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--muted);font-family:var(--f-head)}
.empty-state i{font-size:2.4rem;color:var(--gold);opacity:.5;display:block;margin-bottom:1rem}
.empty-state h3{font-size:1.1rem;font-weight:700;color:var(--ink);margin-bottom:.4rem}
.skeleton{height:200px;border-radius:var(--r-lg);background:linear-gradient(90deg,#f0f0f0 25%,#fafafa 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.6s infinite}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.toast-container{position:fixed;top:calc(var(--header-h) + 16px);right:16px;z-index:4000;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:var(--r-md);padding:.8rem 1.1rem;display:flex;align-items:center;gap:.65rem;font-family:var(--f-head);font-size:.85rem;pointer-events:auto;transition:opacity .35s,transform .35s}
.toast.success i{color:#34d399}.toast.error i{color:#f87171}.toast.info i{color:#fbbf24}
.toast.leaving{opacity:0;transform:translateX(24px)}
@media(max-width:900px){.ws-nav-links{display:none}main{padding:2rem 1.25rem 3rem}.cert-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<a href="#main" class="sr-only">Skip to main content</a>
<div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>

<header class="ws-header">
  <div class="ws-header-inner">
    <a href="../index.html" class="ws-logo">
      <img src="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview-1.png" alt="">
      <span class="ws-logo-text">Kaz<span class="accent">Inni</span> <span style="font-weight:600;opacity:.5;font-size:.85rem;">Learning</span></span>
    </a>
    <nav class="ws-nav-links">
      <a href="index.html" class="ws-nav-link">Library</a>
      <a href="certificate.html" class="ws-nav-link active">Certificates</a>
      <a href="pricing.html" class="ws-nav-link">Plans</a>
    </nav>
    <div class="ws-header-right">
      <a href="../index.html" class="ws-btn ws-btn-ghost">
        <i class="fas fa-arrow-left"></i> <span>Workspace</span>
      </a>
      <div id="headerAccount"></div>
    </div>
  </div>
</header>

<main id="main">
  <div class="inner">
    <div style="text-align:center;">
      <span class="hero-eyebrow"><span class="dot"></span> Achievements</span>
    </div>
    <h1>Your <span class="accent">certificates</span></h1>
    <p class="hero-lede">Every completed course earns a shareable certificate. Download, print, or add to your portfolio.</p>
    <div class="cert-grid" id="certGrid">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="../js/learning-core.js"></script>
<script>
'use strict';

document.addEventListener('learning:ready', async () => {
  const grid = document.getElementById('certGrid');
  try {
    const snap = await window._db.ref(`learning_certificates/${currentUser.uid}`).once('value');
    const val = snap.val() || {};
    const list = Object.entries(val)
      .map(([id, c]) => ({ id, ...c }))
      .sort((a, b) => (b.issuedAt || 0) - (a.issuedAt || 0));

    if (list.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-certificate"></i>
          <h3>No certificates yet</h3>
          <p>Complete your first course to earn a certificate.</p>
          <a href="index.html" class="ws-btn ws-btn-primary" style="margin-top:1rem;">Browse library</a>
        </div>`;
      return;
    }

    grid.innerHTML = list.map(c => `
      <div class="cert-card">
        <div class="cert-badge"><i class="fas fa-certificate"></i></div>
        <div>
          <div class="cert-title">${escapeHtml(c.courseTitle || 'Course')}</div>
          <div class="cert-meta">Issued ${escapeHtml(getFullTime(c.issuedAt))}</div>
          <div class="cert-id">ID: ${escapeHtml(c.certificateId || c.id)}</div>
        </div>
        <div class="cert-actions">
          <button class="ws-btn ws-btn-ghost" onclick="downloadCert('${escapeHtml(c.id)}')">
            <i class="fas fa-download"></i> Download
          </button>
          <button class="ws-btn ws-btn-ghost" onclick="shareCert('${escapeHtml(c.id)}')">
            <i class="fas fa-share-nodes"></i> Share
          </button>
        </div>
      </div>`).join('');
  } catch (e) {
    console.error(e);
    grid.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-exclamation-triangle"></i>
        <h3>Could not load certificates</h3>
      </div>`;
  }
});

function downloadCert(id) { showToast('Certificate download coming soon', 'info'); }
function shareCert(id) { showToast('Certificate sharing coming soon', 'info'); }
</script>
</body>
</html>
