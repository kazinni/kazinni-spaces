<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ca8a04">
<title>Certificates — KazInni Learning</title>

<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;600;700;800&family=Satoshi:wght@400;500;600;700;800;900&family=Clash+Display:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?v=2&f[]=cabinet-grotesk@400,500,600,700,800&f[]=satoshi@400,500,600,700,800,900&f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#ca8a04;--gold-dark:#a16207;--gold-soft:#fef3c7;
  --gold-gradient:linear-gradient(135deg,#ca8a04 0%,#eab308 50%,#fbbf24 100%);
  --ink:#0f0f1e;--success:#10b981;--danger:#ef4444;--info:#3b82f6;
  --text-2:#4a4a5e;--muted:#6b7280;--border:#e9ecef;--border-2:#d1d5db;
  --surface:#fff;--surface-2:#faf9f7;--surface-3:#f4f3f1;
  --header-h:60px;
  --f-display:'Clash Display','Cabinet Grotesk',sans-serif;
  --f-head:'Satoshi','Cabinet Grotesk',sans-serif;
  --f-body:'Satoshi','Cabinet Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-pill:100px;
  --t-fast:.15s cubic-bezier(.2,.8,.2,1);
  --t-base:.25s cubic-bezier(.2,.8,.2,1);
  --shadow-pop:0 24px 60px rgba(15,15,30,.18),0 4px 12px rgba(15,15,30,.08);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--f-body);background:var(--surface-2);color:var(--ink);line-height:1.6;letter-spacing:-.005em;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
:focus{outline:none}:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}50%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes slideInRight{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* HEADER */
.ws-header{position:sticky;top:0;z-index:1000;height:var(--header-h);background:rgba(255,255,255,.92);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid rgba(15,15,30,.06);padding:0 1rem;display:flex;align-items:center}
.ws-header-inner{width:100%;max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:1rem}
.ws-logo{display:flex;align-items:center;gap:.55rem;text-decoration:none;flex-shrink:0}
.ws-logo img{height:30px}
.ws-logo-text{font-family:var(--f-display);font-weight:800;font-size:1.05rem;color:var(--ink);letter-spacing:-.4px;white-space:nowrap}
.ws-logo-text .accent{background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ws-nav-links{display:flex;align-items:center;gap:1.4rem;margin-left:1rem}
.ws-nav-link{color:var(--text-2);text-decoration:none;font-size:.85rem;font-weight:500;font-family:var(--f-head);transition:color var(--t-fast);padding:.4rem 0;white-space:nowrap}
.ws-nav-link:hover{color:var(--ink)}
.ws-nav-link.active{color:var(--gold-dark);font-weight:600}
.ws-header-right{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.ws-btn{padding:.6rem 1.2rem;border:none;border-radius:var(--r-pill);font-weight:600;font-size:.84rem;cursor:pointer;transition:all var(--t-base);text-decoration:none;display:inline-flex;align-items:center;gap:.5rem;font-family:var(--f-head);white-space:nowrap}
.ws-btn-primary{background:var(--ink);color:#fff;box-shadow:0 4px 14px rgba(15,15,30,.18);position:relative;overflow:hidden}
.ws-btn-primary::before{content:'';position:absolute;inset:0;background:var(--gold-gradient);opacity:0;transition:opacity var(--t-base)}
.ws-btn-primary>*{position:relative;z-index:1}
.ws-btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(202,138,4,.3)}
.ws-btn-primary:hover::before{opacity:1}
.ws-btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--border-2)}
.ws-btn-ghost:hover{border-color:var(--ink);background:var(--ink);color:#fff}
.ws-btn:disabled{opacity:.5;cursor:not-allowed}
.ws-account-chip{display:flex;align-items:center;gap:.5rem;padding:.3rem .8rem .3rem .3rem;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--border);font-family:var(--f-head);font-size:.8rem;font-weight:600;color:var(--ink);text-decoration:none}
.ws-avatar{width:28px;height:28px;border-radius:50%;background:var(--gold-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;font-family:var(--f-head)}

/* HERO */
.cert-hero{position:relative;padding:3.5rem 2rem 2.5rem;text-align:center;background:#fff;border-bottom:1px solid rgba(15,15,30,.05);overflow:hidden}
.cert-hero-bg{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cert-hero-bg .orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.3}
.cert-hero-bg .orb-1{width:400px;height:400px;background:#fde68a;top:-100px;left:-80px}
.cert-hero-bg .orb-2{width:320px;height:320px;background:#fbbf24;bottom:-100px;right:-80px;opacity:.2}
.cert-hero-inner{position:relative;z-index:2;max-width:720px;margin:0 auto}
.hero-eyebrow{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .9rem;background:#fff;border:1px solid rgba(202,138,4,.22);border-radius:var(--r-pill);font-size:.68rem;font-weight:700;color:var(--gold-dark);margin-bottom:1.4rem;font-family:var(--f-head);text-transform:uppercase;letter-spacing:1px;box-shadow:0 4px 12px rgba(202,138,4,.08)}
.hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}
.cert-hero h1{font-size:clamp(2rem,4vw,2.8rem);font-weight:700;line-height:1.08;margin-bottom:1rem;letter-spacing:-.04em;font-family:var(--f-display);color:var(--ink)}
.cert-hero h1 .accent{background:var(--gold-gradient);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-style:italic;font-weight:500}
.cert-hero .hero-lede{font-size:1rem;color:var(--text-2);max-width:560px;margin:0 auto;line-height:1.65}

/* GRID */
.cert-main{flex:1;padding:3rem 2rem 4rem}
.cert-inner{max-width:1100px;margin:0 auto}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.2rem}

/* CARD */
.cert-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:1.5rem 1.5rem 1.3rem;display:flex;flex-direction:column;gap:1.2rem;transition:all var(--t-base);position:relative;overflow:hidden}
.cert-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold-gradient);transform:scaleX(0);transform-origin:left;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.cert-card:hover::before{transform:scaleX(1)}
.cert-card:hover{transform:translateY(-3px);box-shadow:0 20px 48px rgba(15,15,30,.08);border-color:rgba(202,138,4,.25)}

.cert-card-top{display:flex;align-items:flex-start;gap:1rem}
.cert-badge{width:56px;height:56px;border-radius:16px;background:var(--gold-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.35rem;box-shadow:0 10px 24px rgba(202,138,4,.28);flex-shrink:0}
.cert-card-info{min-width:0;flex:1}
.cert-card-title{font-family:var(--f-head);font-size:1rem;font-weight:700;color:var(--ink);line-height:1.3;margin-bottom:.35rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cert-card-meta{font-size:.75rem;color:var(--muted);font-family:var(--f-head);display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.cert-card-meta i{font-size:.7rem;opacity:.7}
.cert-card-meta .dot-sep{width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:.5}
.cert-card-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.68rem;color:var(--muted);padding:.3rem .55rem;background:var(--surface-2);border-radius:6px;display:inline-block;border:1px solid var(--border);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.3px}

.cert-actions{display:grid;grid-template-columns:1fr auto;gap:.5rem;margin-top:auto;padding-top:1rem;border-top:1px dashed var(--border)}
.cert-actions .ws-btn{padding:.65rem 1.1rem;font-size:.82rem;justify-content:center}
.cert-actions .ws-btn-primary{width:100%}
.cert-actions .ws-btn.icon-only{padding:.65rem;width:auto;min-width:44px}

/* Empty state */
.empty-state{grid-column:1/-1;text-align:center;padding:5rem 2rem;color:var(--muted);font-family:var(--f-head);background:#fff;border:1px solid var(--border);border-radius:var(--r-lg)}
.empty-state i.empty-icon{font-size:3rem;color:var(--gold);opacity:.35;display:block;margin-bottom:1.2rem}
.empty-state h3{font-size:1.15rem;font-weight:700;color:var(--ink);margin-bottom:.5rem;font-family:var(--f-head)}
.empty-state p{font-size:.88rem;max-width:400px;margin:0 auto 1.5rem;line-height:1.6}

/* Skeleton */
.skeleton{height:180px;border-radius:var(--r-lg);background:linear-gradient(90deg,#f0f0f0 25%,#fafafa 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.6s ease-in-out infinite}

/* TOASTS */
.toast-container{position:fixed;top:calc(var(--header-h) + 16px);right:16px;z-index:4000;display:flex;flex-direction:column;gap:.5rem;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:#fff;border-radius:var(--r-md);padding:.8rem 1.1rem;box-shadow:0 20px 40px rgba(15,15,30,.22);display:flex;align-items:center;gap:.65rem;font-family:var(--f-head);font-size:.85rem;max-width:360px;font-weight:500;pointer-events:auto;transition:opacity .35s,transform .35s;animation:slideInRight .3s cubic-bezier(.2,.8,.2,1)}
.toast i{font-size:.95rem;flex-shrink:0}
.toast.success i{color:#34d399}
.toast.error i{color:#f87171}
.toast.info i{color:#fbbf24}
.toast.leaving{opacity:0;transform:translateX(24px)}

@media(max-width:900px){
  .ws-nav-links{display:none}
  .cert-hero{padding:2.5rem 1.25rem 2rem}
  .cert-hero h1{font-size:1.8rem}
  .cert-main{padding:2rem 1.25rem 3rem}
  .cert-grid{grid-template-columns:1fr}
  .toast-container{right:12px;left:12px;align-items:stretch}
  .toast{max-width:none}
}
</style>
</head>

<a href="#main" class="sr-only">Skip to main content</a>
<div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>

<header class="ws-header">
  <div class="ws-header-inner">
    <a href="../index.html" class="ws-logo" aria-label="Back to KazInni">
      <img src="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview-1.png" alt="">
      <span class="ws-logo-text">Kaz<span class="accent">Inni</span> <span style="font-weight:600;opacity:.5;font-size:.85rem;">Learning</span></span>
    </a>
    <nav class="ws-nav-links" aria-label="Learning navigation">
      <a href="index.html" class="ws-nav-link">Library</a>
      <a href="certificate.html" class="ws-nav-link active">Certificates</a>
    </nav>
    <div class="ws-header-right">
      <a href="../index.html" class="ws-btn ws-btn-ghost">
        <i class="fas fa-arrow-left" aria-hidden="true"></i> <span>Workspace</span>
      </a>
      <div id="headerAccount"></div>
    </div>
  </div>
</header>

<main id="main">
  <section class="cert-hero">
    <div class="cert-hero-bg" aria-hidden="true">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
    </div>
    <div class="cert-hero-inner">
      <span class="hero-eyebrow"><span class="dot"></span> Achievements</span>
      <h1>Your <span class="accent">certificates</span></h1>
      <p class="hero-lede">Every course you complete earns a shareable certificate. Download as PDF, print, or share to your portfolio.</p>
    </div>
  </section>

  <section class="cert-main">
    <div class="cert-inner">
      <div class="cert-grid" id="certGrid">

    </div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
'use strict';

// ══════════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyC7kppUyHUaPzeLBV62NEZWuHiuz1Kz0mA",
  authDomain: "mugera-e51cc.firebaseapp.com",
  databaseURL: "https://mugera-e51cc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mugera-e51cc"
};

// ══════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════
let currentUser = null;
let certificatesCache = [];
let coursesCache = {};

// ══════════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════════
function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  return String(text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function getInitials(name) {
  if (!name) return 'U';
  const p = name.trim().split(/[\s._-]+/).filter(Boolean);
  if (p.length === 0) return 'U';
  if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
  return (p[0][0] + p[p.length - 1][0]).toUpperCase();
}

function getFullTime(ts) {
  if (!ts) return '—';
  try {
    return new Date(ts).toLocaleString('en-US', {
      month: 'short', day: 'numeric', year: 'numeric'
    });
  } catch (e) { return '—'; }
}

function getFullDate(ts) {
  if (!ts) return '—';
  try {
    return new Date(ts).toLocaleDateString('en-US', {
      year: 'numeric', month: 'long', day: 'numeric'
    });
  } catch (e) { return '—'; }
}

function showToast(msg, type = 'success') {
  const c = document.getElementById('toastContainer');
  if (!c) return;
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<i class="fas ${icons[type] || icons.info}" aria-hidden="true"></i><span></span>`;
  t.querySelector('span').textContent = msg;
  c.appendChild(t);
  setTimeout(() => {
    t.classList.add('leaving');
    setTimeout(() => t.remove(), 400);
  }, 4000);
}

// ══════════════════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  if (typeof firebase === 'undefined') {
    showToast('Could not load certificate service', 'error');
    renderEmpty('Service unavailable', 'The certificate service could not be loaded.');
    return;
  }

  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  } catch (e) { console.warn(e); }

  const auth = firebase.auth();
  const db = firebase.database();
  window._auth = auth;
  window._db = db;

  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
  auth.onAuthStateChanged(onAuthChanged);
});

async function onAuthChanged(user) {
  if (!user) {
    window.location.href = '../index.html';
    return;
  }

  currentUser = user;
  renderAccountChip(user);

  // Fire-and-forget course cache load
  window._db.ref('learning_courses').once('value')
    .then(snap => { coursesCache = snap.val() || {}; })
    .catch(() => { coursesCache = {}; });

  await loadCertificates();

  // Reconcile any completed courses missing certificates
  reconcileMissingCertificates().catch(e =>
    console.warn('[certificate] reconcile failed:', e)
  );

  // Backfill any missing verification-index entries
  backfillMissingIndexEntries(certificatesCache).catch(e =>
    console.warn('[certificate] backfill failed:', e)
  );
}

function renderAccountChip(user) {
  const el = document.getElementById('headerAccount');
  if (!el) return;
  const name = user.displayName || user.email.split('@')[0] || 'User';
  el.innerHTML = `
    <a href="../index.html" class="ws-account-chip" title="Back to workspace">
      <div class="ws-avatar" aria-hidden="true">${escapeHtml(getInitials(name))}</div>
      <span>${escapeHtml(name)}</span>
    </a>`;
}

// ══════════════════════════════════════════════════════════════
// RECONCILE MISSING CERTIFICATES
// If a user has completed a course but has no certificate for it,
// issue one silently.
// ══════════════════════════════════════════════════════════════
async function reconcileMissingCertificates() {
  if (!currentUser) return;

  const uid = currentUser.uid;
  let progress = {};
  let certs = {};

  try {
    const [pSnap, cSnap] = await Promise.all([
      window._db.ref(`learning_progress/${uid}`).once('value'),
      window._db.ref(`learning_certificates/${uid}`).once('value')
    ]);
    progress = pSnap.val() || {};
    certs = cSnap.val() || {};
  } catch (e) {
    console.warn('[reconcile] Could not load progress/certs:', e);
    return;
  }

  const missing = [];
  for (const [courseId, p] of Object.entries(progress)) {
    if (!p || !p.completedAt) continue;
    if (certs[courseId]) continue;
    missing.push({
      courseId,
      title: p.title || 'Course',
      completedAt: p.completedAt
    });
  }

  if (missing.length === 0) return;

  console.log(`[reconcile] Found ${missing.length} completed course(s) missing certificates`);

  let anyIssued = false;

  for (const m of missing) {
    try {
      let courseTitle = m.title;
      try {
        const cSnap = await window._db.ref(`learning_courses/${m.courseId}`).once('value');
        const course = cSnap.val();
        if (course && course.title) courseTitle = course.title;
      } catch (e) { /* fall back */ }

      const certId = await generateUniqueCertificateId();
      const recipientName = currentUser.displayName
        || (currentUser.email ? currentUser.email.split('@')[0] : 'KazInni Learner');

      const issuedAt = m.completedAt || Date.now();

      const userPayload = {
        courseId: m.courseId,
        courseTitle,
        certificateId: certId,
        issuedAt,
        status: 'auto_issued',
        reconciled: true
      };

      const indexPayload = {
        uid,
        recipientName,
        courseId: m.courseId,
        courseTitle,
        issuedAt,
        status: 'auto_issued'
      };

      await window._db.ref(`learning_certificates/${uid}/${m.courseId}`).set(userPayload);
      await window._db.ref(`learning_certificate_index/${certId}`).set(indexPayload);

      console.log(`[reconcile] ✅ Issued certificate for "${courseTitle}" — ${certId}`);
      anyIssued = true;
    } catch (e) {
      console.warn(`[reconcile] ❌ Failed for ${m.courseId}:`, e.message);
    }
  }

  if (anyIssued) {
    await loadCertificates();
  }
}

async function generateUniqueCertificateId() {
  const alphabet = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const year = new Date().getFullYear();

  for (let attempt = 0; attempt < 5; attempt++) {
    let code = '';
    for (let i = 0; i < 6; i++) {
      code += alphabet[Math.floor(Math.random() * alphabet.length)];
    }
    const candidate = `KAZ-${year}-${code}`;
    const snap = await window._db
      .ref(`learning_certificate_index/${candidate}`)
      .once('value');
    if (!snap.exists()) return candidate;
  }
  return `KAZ-${year}-${Date.now().toString(36).toUpperCase().slice(-6)}`;
}

// ══════════════════════════════════════════════════════════════
// BACKFILL VERIFICATION INDEX
// ══════════════════════════════════════════════════════════════
async function backfillMissingIndexEntries(certs) {
  if (!certs || certs.length === 0) return;

  const recipientName = getRecipientName();

  for (const cert of certs) {
    const certId = cert.certificateId;
    if (!certId) continue;

    try {
      const snap = await window._db
        .ref(`learning_certificate_index/${certId}`)
        .once('value');

      if (snap.exists()) continue;

      await window._db.ref(`learning_certificate_index/${certId}`).set({
        uid: currentUser.uid,
        recipientName: recipientName,
        courseId: cert.courseId || cert.id,
        courseTitle: cert.courseTitle || 'Course',
        issuedAt: cert.issuedAt || Date.now(),
        status: cert.status || 'auto_issued'
      });

      console.log('[certificate] Backfilled index entry:', certId);
    } catch (e) {
      console.warn('[certificate] Could not backfill', certId, e.message);
    }
  }
}

// ══════════════════════════════════════════════════════════════
// LOAD & RENDER CERTIFICATES
// ══════════════════════════════════════════════════════════════
async function loadCertificates() {
  const grid = document.getElementById('certGrid');
  if (!grid) return;

  let certs = {};
  let loadError = null;

  try {
    const snap = await window._db.ref(`learning_certificates/${currentUser.uid}`).once('value');
    certs = snap.val() || {};
  } catch (e) {
    loadError = e;
  }

  if (loadError) {
    renderEmpty(
      'Could not load certificates',
      loadError.message || 'Please check your connection and try again.',
      true
    );
    return;
  }

  const list = Object.entries(certs)
    .map(([id, c]) => ({ id, ...c }))
    .sort((a, b) => (b.issuedAt || 0) - (a.issuedAt || 0));

  certificatesCache = list;

  if (list.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-certificate empty-icon" aria-hidden="true"></i>
        <h3>No certificates yet</h3>
        <p>Complete a course to earn your first certificate. It will appear here automatically.</p>
        <a href="index.html" class="ws-btn ws-btn-primary">
          <i class="fas fa-graduation-cap" aria-hidden="true"></i> Browse library
        </a>
      </div>`;
    return;
  }

  grid.innerHTML = list.map(c => {
    const course = coursesCache[c.courseId] || {};
    const category = course.category || '';
    const lessonCount = course.lessons ? Object.keys(course.lessons).length : 0;
    const certId = c.certificateId || c.id;
    return `
      <article class="cert-card">
        <div class="cert-card-top">
          <div class="cert-badge" aria-hidden="true">
            <i class="fas fa-certificate"></i>
          </div>
          <div class="cert-card-info">
            <h3 class="cert-card-title">${escapeHtml(c.courseTitle || 'Course')}</h3>
            <div class="cert-card-meta">
              <span><i class="fas fa-calendar" aria-hidden="true"></i> ${escapeHtml(getFullTime(c.issuedAt))}</span>
              ${category ? `<span class="dot-sep" aria-hidden="true"></span><span>${escapeHtml(category)}</span>` : ''}
              ${lessonCount > 0 ? `<span class="dot-sep" aria-hidden="true"></span><span>${lessonCount} lesson${lessonCount === 1 ? '' : 's'}</span>` : ''}
            </div>
          </div>
        </div>

        <div class="cert-card-id" title="${escapeHtml(certId)}">
          <i class="fas fa-fingerprint" aria-hidden="true" style="margin-right:.4rem;opacity:.6;"></i>${escapeHtml(certId)}
        </div>

        <div class="cert-actions">
          <button type="button" class="ws-btn ws-btn-primary" onclick="downloadCert('${escapeHtml(c.id)}')">
            <i class="fas fa-download" aria-hidden="true"></i> Download PDF
          </button>
          <button type="button" class="ws-btn ws-btn-ghost icon-only" onclick="shareCert('${escapeHtml(c.id)}')" aria-label="Share certificate" title="Share">
            <i class="fas fa-share-nodes" aria-hidden="true"></i>
          </button>
        </div>
      </article>
    `;
  }).join('');
}

function renderEmpty(title, detail, isError) {
  const grid = document.getElementById('certGrid');
  if (!grid) return;
  grid.innerHTML = `
    <div class="empty-state">
      <i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-certificate'} empty-icon" aria-hidden="true"></i>
      <h3>${escapeHtml(title)}</h3>
      <p>${escapeHtml(detail)}</p>
      <a href="index.html" class="ws-btn ws-btn-primary">
        <i class="fas fa-graduation-cap" aria-hidden="true"></i> Browse library
      </a>
    </div>`;
}

function downloadCert(certId) {
  const cert = certificatesCache.find(c => c.id === certId);
  if (!cert) {
    showToast('Certificate not found', 'error');
    return;
  }

  const course = coursesCache[cert.courseId] || {};
  const html = generateCertificateHtml({
    recipientName: getRecipientName(),
    courseTitle: cert.courseTitle || 'Course',
    courseCategory: course.category || '',
    certificateId: cert.certificateId || cert.id,
    issuedAt: cert.issuedAt || Date.now(),
    instructor: 'KazInni Learning'
  });

  const win = window.open('', '_blank');
  if (!win) {
    showToast('Please allow pop-ups to download your certificate', 'error');
    return;
  }
  win.document.open();
  win.document.write(html);
  win.document.close();

  showToast('Opening certificate — save as PDF in the print dialog', 'info');
}

async function shareCert(certId) {
  const cert = certificatesCache.find(c => c.id === certId);
  if (!cert) return;

  const shareUrl = window.location.origin + window.location.pathname.replace(/certificate\.html$/, 'index.html');
  const shareTitle = `I completed ${cert.courseTitle} on KazInni Learning`;
  const shareText = `I earned a certificate for "${cert.courseTitle}" — check it out on KazInni Learning.`;

  if (navigator.share) {
    try {
      await navigator.share({ title: shareTitle, text: shareText, url: shareUrl });
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
  }

  try {
    await navigator.clipboard.writeText(`${shareText} ${shareUrl}`);
    showToast('Certificate link copied to clipboard', 'success');
  } catch (e) {
    showToast('Sharing not available on this device', 'error');
  }
}
