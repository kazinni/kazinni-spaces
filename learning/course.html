<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ca8a04">
<title>Course — KazInni Learning</title>
<link rel="icon" type="image/x-icon" href="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview-1.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;600;700;800&family=Satoshi:wght@400;500;600;700;800;900&family=Clash+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?v=2&f[]=cabinet-grotesk@400,500,600,700,800&f[]=satoshi@400,500,600,700,800,900&f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#ca8a04;--gold-dark:#a16207;--gold-soft:#fef3c7;
  --gold-gradient:linear-gradient(135deg,#ca8a04 0%,#eab308 50%,#fbbf24 100%);
  --ink:#0f0f1e;--success:#10b981;--danger:#ef4444;--info:#3b82f6;--warning:#f59e0b;
  --text-2:#4a4a5e;--muted:#6b7280;--border:#e9ecef;--border-2:#d1d5db;
  --surface:#fff;--surface-2:#faf9f7;--surface-3:#f4f3f1;
  --header-h:60px;
  --f-display:'Clash Display','Cabinet Grotesk',sans-serif;
  --f-head:'Satoshi','Cabinet Grotesk',sans-serif;
  --f-body:'Satoshi','Cabinet Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-pill:100px;
  --t-fast:.15s cubic-bezier(.2,.8,.2,1);
  --t-base:.25s cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--f-body);background:var(--surface-2);color:var(--ink);line-height:1.6;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

.ws-header{position:sticky;top:0;z-index:1000;height:var(--header-h);background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(15,15,30,.06);padding:0 1rem;display:flex;align-items:center}
.ws-header-inner{width:100%;max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:1rem}
.ws-logo{display:flex;align-items:center;gap:.55rem;text-decoration:none}
.ws-logo img{height:30px}
.ws-logo-text{font-family:var(--f-display);font-weight:800;font-size:1.05rem;color:var(--ink)}
.ws-logo-text .accent{background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ws-header-right{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.ws-btn{padding:.6rem 1.2rem;border:none;border-radius:var(--r-pill);font-weight:600;font-size:.84rem;cursor:pointer;transition:all var(--t-base);text-decoration:none;display:inline-flex;align-items:center;gap:.5rem;font-family:var(--f-head);white-space:nowrap}
.ws-btn-primary{background:var(--ink);color:#fff;box-shadow:0 4px 14px rgba(15,15,30,.18);position:relative;overflow:hidden}
.ws-btn-primary::before{content:'';position:absolute;inset:0;background:var(--gold-gradient);opacity:0;transition:opacity var(--t-base)}
.ws-btn-primary>*{position:relative;z-index:1}
.ws-btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(202,138,4,.3)}
.ws-btn-primary:hover::before{opacity:1}
.ws-btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--border-2)}
.ws-btn-ghost:hover{border-color:var(--ink);background:var(--ink);color:#fff}
.ws-btn:disabled{opacity:.45;cursor:not-allowed}
.ws-account-chip{display:flex;align-items:center;gap:.5rem;padding:.3rem .8rem .3rem .3rem;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--border);font-family:var(--f-head);font-size:.8rem;font-weight:600;color:var(--ink);text-decoration:none}
.ws-avatar{width:28px;height:28px;border-radius:50%;background:var(--gold-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem}

.player-layout{display:grid;grid-template-columns:320px 1fr;flex:1;min-height:calc(100vh - var(--header-h))}
.player-sidebar{background:#fff;border-right:1px solid var(--border);overflow-y:auto;padding:1.5rem 1rem}
.player-course-info{margin-bottom:1rem;padding:0 .5rem}
.player-course-info h2{font-family:var(--f-head);font-size:1rem;font-weight:700;color:var(--ink);margin-bottom:.3rem;line-height:1.3}
.player-course-info p{font-size:.78rem;color:var(--muted)}
.player-lessons{display:flex;flex-direction:column;gap:.15rem}
.lesson-item{display:flex;align-items:center;gap:.7rem;padding:.7rem .8rem;border-radius:var(--r-sm);color:var(--text-2);text-decoration:none;font-family:var(--f-head);font-size:.83rem;font-weight:500;transition:background var(--t-fast),color var(--t-fast);cursor:pointer;background:none;border:none;width:100%;text-align:left}
.lesson-item:hover{background:var(--surface-2);color:var(--ink)}
.lesson-item.active{background:rgba(202,138,4,.1);color:var(--gold-dark);font-weight:600}
.lesson-item.locked{opacity:.55;cursor:not-allowed}
.lesson-item.locked:hover{background:transparent;color:var(--text-2)}
.lesson-item-icon{width:26px;height:26px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--muted);flex-shrink:0}
.lesson-item.completed .lesson-item-icon{background:#d1fae5;color:#065f46}
.lesson-item.active .lesson-item-icon{background:var(--gold-gradient);color:#fff}
.lesson-item.locked .lesson-item-icon{background:var(--surface-3);color:var(--muted)}
.lesson-item-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson-item-duration{font-size:.68rem;color:var(--muted);font-family:var(--f-head)}

.player-main{background:var(--surface-2);overflow-y:auto}
.player-main-inner{max-width:820px;margin:0 auto;padding:2.5rem 2rem 4rem}
.player-lesson-label{font-family:var(--f-head);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gold-dark);margin-bottom:.4rem}
.player-lesson-header h1{font-family:var(--f-display);font-size:clamp(1.5rem,3vw,2rem);font-weight:700;letter-spacing:-.025em;color:var(--ink);margin-bottom:.5rem}
.player-lesson-header p{font-size:.9rem;color:var(--muted);margin-bottom:1.6rem}
.player-video{aspect-ratio:16/9;background:var(--ink);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:1.6rem;overflow:hidden;position:relative}
.player-video iframe,.player-video video{width:100%;height:100%;border:none}
.player-video-placeholder{text-align:center;color:rgba(255,255,255,.7)}
.player-video-placeholder i{font-size:3rem;display:block;margin-bottom:.8rem;color:var(--gold)}
.player-video-placeholder p{font-family:var(--f-head);font-size:.85rem}
.player-content{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:1.8rem 2rem;font-size:.95rem;line-height:1.75;color:var(--text-2);margin-bottom:1.6rem}
.player-content h2,.player-content h3{font-family:var(--f-head);color:var(--ink);margin-top:1.6rem;margin-bottom:.6rem}
.player-content h2{font-size:1.2rem;font-weight:700}
.player-content h3{font-size:1rem;font-weight:700}
.player-content p{margin-bottom:1rem}
.player-content ul,.player-content ol{margin-left:1.5rem;margin-bottom:1rem}
.player-content li{margin-bottom:.4rem}
.player-content code{background:var(--surface-3);padding:.15rem .4rem;border-radius:4px;font-size:.85em}
.player-content blockquote{border-left:3px solid var(--gold);padding-left:1rem;margin:1rem 0;color:var(--muted);font-style:italic}
.player-actions{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:space-between;padding-top:1rem;border-top:1px dashed var(--border)}
.player-actions-right{display:flex;gap:.7rem;flex-wrap:wrap}
.player-sidebar-toggle{display:none;position:fixed;bottom:1.2rem;right:1.2rem;width:52px;height:52px;border-radius:50%;background:var(--gold-gradient);color:#fff;border:none;cursor:pointer;box-shadow:0 12px 30px rgba(202,138,4,.4);font-size:1.1rem;z-index:950}
.empty-state{text-align:center;padding:4rem 2rem;color:var(--muted);font-family:var(--f-head)}
.empty-state i{font-size:2.4rem;color:var(--gold);opacity:.5;display:block;margin-bottom:1rem}
.empty-state h3{font-size:1.1rem;font-weight:700;color:var(--ink);margin-bottom:.4rem}
.empty-state p{font-size:.85rem;margin-bottom:.8rem}

/* NOTES */
.player-sidebar-actions{padding:0 .5rem .9rem;margin-bottom:.6rem;border-bottom:1px dashed var(--border)}
.notes-menu-wrap{position:relative;display:block}
.notes-menu-btn{display:flex;align-items:center;justify-content:space-between;gap:.5rem;width:100%;padding:.55rem .85rem;border-radius:var(--r-md);border:1.5px solid var(--border-2);background:#fff;color:var(--ink);font-family:var(--f-head);font-size:.8rem;font-weight:600;cursor:pointer;transition:all var(--t-fast)}
.notes-menu-btn:hover{border-color:var(--ink);background:var(--surface-2)}
.notes-menu-btn i:first-child{color:var(--gold-dark)}
.notes-menu-btn i.chev{font-size:.6rem;opacity:.6;transition:transform var(--t-fast)}
.notes-menu-wrap.open .notes-menu-btn i.chev{transform:rotate(180deg)}
.notes-menu{position:absolute;top:calc(100% + .35rem);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 20px 44px rgba(15,15,30,.14);padding:.35rem;display:none;z-index:70}
.notes-menu-wrap.open .notes-menu{display:block;animation:fadeUp .18s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.notes-menu button{display:flex;align-items:flex-start;gap:.6rem;width:100%;padding:.55rem .6rem;border:none;background:none;border-radius:var(--r-sm);font-family:var(--f-head);font-size:.78rem;font-weight:500;color:var(--text-2);cursor:pointer;text-align:left;transition:all var(--t-fast)}
.notes-menu button:hover{background:var(--surface-2);color:var(--ink)}
.notes-menu button:disabled{opacity:.5;cursor:wait}
.notes-menu button i{width:14px;text-align:center;color:var(--gold-dark);font-size:.78rem;margin-top:2px;flex-shrink:0}
.notes-menu button small{display:block;font-size:.64rem;color:var(--muted);font-weight:400;margin-top:.1rem;line-height:1.3}
.player-actions-right .notes-menu-wrap{display:inline-block;width:auto}
.player-actions-right .notes-menu-btn{width:auto;justify-content:center;padding:.55rem .9rem;border-radius:var(--r-pill);font-size:.78rem}
.player-actions-right .notes-menu{top:auto;bottom:calc(100% + .35rem);left:0;right:auto;min-width:230px}

/* QUIZ LAUNCH */
.quiz-launch{background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%);border:1px solid rgba(202,138,4,.25);border-radius:var(--r-lg);padding:2.2rem 2rem;text-align:center;margin-bottom:1.6rem;position:relative;overflow:hidden}
.quiz-launch::before{content:'';position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(202,138,4,.15) 0%,transparent 70%);top:-140px;right:-100px;pointer-events:none}
.quiz-launch-icon{width:64px;height:64px;border-radius:20px;background:var(--gold-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto 1rem;box-shadow:0 12px 30px rgba(202,138,4,.3);position:relative;z-index:1}
.quiz-launch h2{font-family:var(--f-display);font-size:1.3rem;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin-bottom:.4rem;position:relative;z-index:1}
.quiz-launch p{font-size:.88rem;color:var(--text-2);max-width:440px;margin:0 auto 1.4rem;position:relative;z-index:1;line-height:1.6}
.quiz-launch-stats{display:flex;justify-content:center;gap:2rem;margin-bottom:1.4rem;position:relative;z-index:1;flex-wrap:wrap}
.quiz-stat{text-align:center}
.quiz-stat-value{font-family:var(--f-display);font-size:1.5rem;font-weight:700;color:var(--gold-dark);letter-spacing:-.02em;line-height:1}
.quiz-stat-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-family:var(--f-head);font-weight:600;margin-top:.3rem}
.quiz-launch-actions{position:relative;z-index:1;display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}

/* LOCKED */
.quiz-locked{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:2.2rem 2rem;text-align:center;margin-bottom:1.6rem}
.quiz-locked-icon{width:64px;height:64px;border-radius:20px;background:var(--surface-3);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto 1rem}
.quiz-locked h2{font-family:var(--f-display);font-size:1.2rem;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin-bottom:.4rem}
.quiz-locked p{font-size:.88rem;color:var(--text-2);max-width:420px;margin:0 auto 1.2rem;line-height:1.6}

/* MODAL */
.quiz-overlay{position:fixed;inset:0;background:rgba(15,15,30,.6);backdrop-filter:blur(8px);z-index:2000;display:none}
.quiz-overlay.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.quiz-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:24px;width:calc(100% - 2rem);max-width:760px;max-height:92vh;z-index:2001;display:none;flex-direction:column;box-shadow:0 40px 80px rgba(15,15,30,.3);overflow:hidden}
.quiz-modal.active{display:flex;animation:quizIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes quizIn{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
.quiz-header{padding:1.4rem 1.8rem 1.1rem;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%);flex-shrink:0;position:relative}
.quiz-header-top{display:flex;align-items:flex-start;gap:1rem;padding-right:2.8rem}
.quiz-header-title-block{flex:1;min-width:0}
.quiz-header-title{font-family:var(--f-display);font-size:1.15rem;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin-bottom:.2rem}
.quiz-header-sub{font-size:.78rem;color:var(--text-2);font-family:var(--f-head)}
.quiz-header-close{position:absolute;top:1rem;right:1.2rem;background:rgba(255,255,255,.7);border:none;width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--text-2);display:flex;align-items:center;justify-content:center;transition:all var(--t-fast)}
.quiz-header-close:hover{background:white;color:var(--danger);transform:rotate(90deg)}

.quiz-timer{display:flex;align-items:center;gap:.55rem;padding:.5rem .85rem;background:#fff;border:1.5px solid var(--border);border-radius:var(--r-pill);font-family:var(--f-head);font-weight:700;font-size:.9rem;color:var(--ink);flex-shrink:0;transition:all var(--t-base);min-width:110px}
.quiz-timer .timer-icon{font-size:.85rem;color:var(--gold-dark);flex-shrink:0}
.quiz-timer .timer-body{display:flex;flex-direction:column;line-height:1}
.quiz-timer .timer-label{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin-bottom:2px}
.quiz-timer .timer-value{font-variant-numeric:tabular-nums;font-size:.92rem}
.quiz-timer.warn{background:#fef3c7;border-color:#f59e0b}
.quiz-timer.warn .timer-icon,.quiz-timer.warn .timer-value{color:#92400e}
.quiz-timer.warn .timer-label{color:#92400e;opacity:.8}
.quiz-timer.danger{background:#fee2e2;border-color:#ef4444;animation:timerPulse 1s infinite}
.quiz-timer.danger .timer-icon,.quiz-timer.danger .timer-value{color:#991b1b}
.quiz-timer.danger .timer-label{color:#991b1b;opacity:.8}
@keyframes timerPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}

.quiz-progress{height:4px;background:rgba(15,15,30,.06);margin-top:1rem;border-radius:2px;overflow:hidden}
.quiz-progress-fill{height:100%;background:var(--gold-gradient);border-radius:2px;transition:width .3s ease;width:0%}
.quiz-body{padding:1.6rem 1.8rem;overflow-y:auto;flex:1}
.quiz-question{margin-bottom:2rem;padding-bottom:1.6rem;border-bottom:1px dashed var(--border)}
.quiz-question:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.quiz-q-num{font-family:var(--f-head);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gold-dark);margin-bottom:.5rem}
.quiz-q-text{font-family:var(--f-head);font-size:1rem;font-weight:600;color:var(--ink);line-height:1.5;margin-bottom:1.1rem}
.quiz-choices{display:flex;flex-direction:column;gap:.5rem}
.quiz-choice{display:flex;align-items:flex-start;gap:.8rem;padding:.85rem 1rem;border:1.5px solid var(--border);border-radius:var(--r-md);cursor:pointer;transition:all var(--t-fast);background:var(--surface-2);text-align:left;width:100%;font-family:var(--f-body);font-size:.9rem;color:var(--text-2);line-height:1.5}
.quiz-choice:hover{border-color:rgba(202,138,4,.4);background:#fff}
.quiz-choice.selected{border-color:var(--gold);background:rgba(202,138,4,.06);color:var(--ink);font-weight:500}
.quiz-choice-letter{width:24px;height:24px;border-radius:50%;background:white;border:1.5px solid var(--border-2);color:var(--text-2);display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-weight:700;font-size:.72rem;flex-shrink:0;transition:all var(--t-fast)}
.quiz-choice.selected .quiz-choice-letter{background:var(--gold-gradient);border-color:var(--gold);color:white}
.quiz-choice-text{flex:1;padding-top:2px}
.quiz-actions{padding:1.2rem 1.8rem;border-top:1px solid var(--border);background:#faf9f7;display:flex;justify-content:space-between;gap:.6rem;flex-shrink:0;flex-wrap:wrap}
.quiz-btn{padding:.75rem 1.5rem;border:none;border-radius:var(--r-pill);font-family:var(--f-head);font-weight:600;font-size:.85rem;cursor:pointer;transition:all var(--t-base);display:inline-flex;align-items:center;gap:.5rem}
.quiz-btn.primary{background:var(--gold-gradient);color:white;box-shadow:0 8px 20px rgba(202,138,4,.28)}
.quiz-btn.primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 30px rgba(202,138,4,.4)}
.quiz-btn.primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.quiz-btn.secondary{background:transparent;color:var(--text-2);border:1.5px solid var(--border-2)}
.quiz-btn.secondary:hover{background:white;border-color:var(--border-2);color:var(--ink)}
.quiz-counter{font-family:var(--f-head);font-size:.78rem;color:var(--muted);align-self:center;font-weight:500}

/* RESULT */
.quiz-result{padding:2.5rem 2rem;text-align:center}
.quiz-result-icon{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;color:white;margin:0 auto 1.2rem}
.quiz-result-icon.pass{background:var(--success);box-shadow:0 14px 34px rgba(16,185,129,.35)}
.quiz-result-icon.fail{background:var(--danger);box-shadow:0 14px 34px rgba(239,68,68,.35)}
.quiz-result-icon.timeout{background:var(--warning);box-shadow:0 14px 34px rgba(245,158,11,.35)}
.quiz-result h2{font-family:var(--f-display);font-size:1.6rem;font-weight:700;letter-spacing:-.025em;color:var(--ink);margin-bottom:.5rem}
.quiz-result p{font-size:.92rem;color:var(--text-2);max-width:440px;margin:0 auto 1.6rem;line-height:1.6}
.quiz-score-ring{position:relative;width:140px;height:140px;margin:0 auto 1.4rem}
.quiz-score-ring svg{transform:rotate(-90deg)}
.quiz-score-ring .track{stroke:rgba(15,15,30,.06);fill:none;stroke-width:8}
.quiz-score-ring .fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.quiz-score-ring .fill.pass{stroke:var(--success)}
.quiz-score-ring .fill.fail{stroke:var(--danger)}
.quiz-score-ring .fill.timeout{stroke:var(--warning)}
.quiz-score-ring .label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.quiz-score-value{font-family:var(--f-display);font-size:2.4rem;font-weight:700;color:var(--ink);letter-spacing:-.03em;line-height:1}
.quiz-score-max{font-family:var(--f-head);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:.2rem}

.quiz-review{margin-top:1.8rem;text-align:left;max-width:580px;margin-left:auto;margin-right:auto}
.quiz-review-title{font-family:var(--f-head);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-2);margin-bottom:.8rem;text-align:center}
.quiz-review-item{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:.85rem 1.1rem;margin-bottom:.5rem;display:flex;align-items:flex-start;gap:.7rem}
.quiz-review-item.correct{border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.05)}
.quiz-review-item.wrong{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.05)}
.quiz-review-status{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.72rem;color:#fff}
.quiz-review-item.correct .quiz-review-status{background:var(--success)}
.quiz-review-item.wrong .quiz-review-status{background:var(--danger)}
.quiz-review-content{flex:1;min-width:0}
.quiz-review-q{font-family:var(--f-head);font-size:.85rem;font-weight:600;color:var(--ink);line-height:1.4;margin-bottom:.25rem}
.quiz-review-note{font-size:.72rem;color:var(--muted);line-height:1.4}
.quiz-review-note strong{color:var(--text-2);font-weight:600}

@media(max-width:900px){
  .player-layout{grid-template-columns:1fr}
  .player-sidebar{position:fixed;top:var(--header-h);left:0;bottom:0;width:280px;max-width:84vw;transform:translateX(-100%);transition:transform var(--t-base);z-index:900;box-shadow:0 20px 60px rgba(15,15,30,.18)}
  body.sidebar-open .player-sidebar{transform:translateX(0)}
  .player-main-inner{padding:1.5rem 1.25rem 3rem}
  .player-sidebar-toggle{display:flex;align-items:center;justify-content:center}
  .quiz-modal{width:calc(100% - 1rem);max-height:94vh;border-radius:20px}
  .quiz-header,.quiz-body,.quiz-actions{padding-left:1.2rem;padding-right:1.2rem}
  .quiz-actions{flex-direction:column-reverse}
  .quiz-actions .quiz-btn{width:100%;justify-content:center}
  .quiz-counter{align-self:center}
  .player-actions .notes-menu{left:auto;right:0}
  .quiz-header-top{flex-direction:column;gap:.7rem}
  .quiz-timer{align-self:flex-start}
}
.toast-container{position:fixed;top:calc(var(--header-h) + 16px);right:16px;z-index:4000;display:flex;flex-direction:column;gap:.5rem;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:#fff;border-radius:var(--r-md);padding:.8rem 1.1rem;display:flex;align-items:center;gap:.65rem;font-family:var(--f-head);font-size:.85rem;max-width:360px;pointer-events:auto;transition:opacity .35s,transform .35s}
.toast.success i{color:#34d399}.toast.error i{color:#f87171}.toast.info i{color:#fbbf24}
.toast.leaving{opacity:0;transform:translateX(24px)}
#pdfRender{position:absolute;left:-9999px;top:0;width:794px;background:#fff;color:#0f0f1e;font-family:var(--f-body);padding:48px 56px;line-height:1.65;box-sizing:border-box}
</style>
</head>
<body>

<a href="#main" class="sr-only">Skip to main content</a>
<div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>

<header class="ws-header">
  <div class="ws-header-inner">
    <a href="index.html" class="ws-logo">
      <img src="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview-1.png" alt="">
      <span class="ws-logo-text">Kaz<span class="accent">Inni</span> <span style="font-weight:600;opacity:.5;font-size:.85rem;">Learning</span></span>
    </a>
    <div class="ws-header-right">
      <a href="index.html" class="ws-btn ws-btn-ghost">
        <i class="fas fa-arrow-left" aria-hidden="true"></i> <span>Library</span>
      </a>
      <div id="headerAccount"></div>
    </div>
  </div>
</header>

<main id="main" class="player-layout">
  <aside class="player-sidebar" id="playerSidebar" aria-label="Course lessons">
    <div class="player-course-info" id="playerCourseInfo"></div>
    <nav class="player-lessons" id="playerLessons"></nav>
  </aside>
  <section class="player-main">
    <div class="player-main-inner" id="playerMain">
      <div class="empty-state">
        <i class="fas fa-circle-notch fa-spin" style="opacity:1;color:var(--gold);"></i>
        <p>Loading course…</p>
      </div>
    </div>
  </section>
</main>

<div class="quiz-overlay" id="quizOverlay" onclick="closeQuiz(false)"></div>
<div class="quiz-modal" id="quizModal" role="dialog" aria-modal="true" aria-labelledby="quizTitle">
  <div class="quiz-header">
    <div class="quiz-header-top">
      <div class="quiz-header-title-block">
        <div class="quiz-header-title" id="quizTitle">Quiz</div>
        <div class="quiz-header-sub" id="quizSubtitle">Answer all questions to continue</div>
      </div>
      <div class="quiz-timer" id="quizTimer" style="display:none;" aria-live="polite">
        <i class="fas fa-hourglass-half timer-icon" aria-hidden="true"></i>
        <div class="timer-body">
          <span class="timer-label">Time left</span>
          <span class="timer-value" id="quizTimerValue">--:--</span>
        </div>
      </div>
    </div>
    <button type="button" class="quiz-header-close" onclick="closeQuiz(true)" aria-label="Close quiz">
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
    <div class="quiz-progress"><div class="quiz-progress-fill" id="quizProgressFill"></div></div>
  </div>
  <div class="quiz-body" id="quizBody"></div>
  <div class="quiz-actions" id="quizActions"></div>
</div>

<div id="pdfRender" aria-hidden="true"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
'use strict';

/* ══════════════════════════════════════════════════════════════
   TODO — SERVER-SIDE GRADING
   ──────────────────────────────────────────────────────────────
   The client no longer reads the answer key. To make quizzes
   gradeable, deploy a callable Cloud Function named `gradeQuiz`
   that:

     Input (data):
       { courseId, answers: {qid: choiceKey}, timedOut, durationSec, timeLimitSec }

     Behaviour (must run with Admin SDK so it can read the key):
       1. Read learning_quiz_keys/{courseId}  — server only
       2. Score answers against the key
       3. Compute passed = score >= course.quiz.passingScore
       4. Write to learning_progress/{uid}/{courseId}:
            quizAttempts[attemptId] = { submittedAt, answers, score,
              passed, durationSec, timeLimitSec, timedOut,
              perQuestion: [{ id, correct: bool }] }   ← NO answer letters
            quizBestScore, quizAttemptsCount
            quizPassed = true (if passed)
            completedLessons[quizIndex] = true (if passed)
       5. If passed AND every non-quiz lesson is complete AND no
          completedAt yet → set completedAt, and issue certificate
          (write learning_certificates/{uid}/{courseId} and
                 learning_certificate_index/{certId})

     Output (returned to client):
       { score, passed, perQuestion: [{ id, correct: bool }],
         timedOut, certificateIssued }

     The client NEVER receives correct answers or explanations.
   ══════════════════════════════════════════════════════════════ */

const firebaseConfig = {
  apiKey: "AIzaSyC7kppUyHUaPzeLBV62NEZWuHiuz1Kz0mA",
  authDomain: "mugera-e51cc.firebaseapp.com",
  databaseURL: "https://mugera-e51cc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mugera-e51cc"
};

// Fallback time limit if a course doesn't define one
const QUIZ_TIME_LIMIT_MINUTES = 15;

// ══════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════
let currentUser = null;
let course = null;
let lessons = [];
let activeIndex = 0;
let progress = null;

let quizAnswers = {};
let quizAttemptStart = 0;
let lastQuizResult = null;
let quizTimerInterval = null;
let quizTimeLimitSec = 0;
let quizTimeRemainingSec = 0;
let quizTimedOut = false;
let gradeQuizCallable = null; // set once firebase.functions() is ready

// ══════════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════════
function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  return String(text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function getInitials(name) {
  if (!name) return 'U';
  const p = name.trim().split(/[\s._-]+/).filter(Boolean);
  if (p.length === 0) return 'U';
  if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
  return (p[0][0] + p[p.length - 1][0]).toUpperCase();
}
function showToast(msg, type = 'success') {
  const c = document.getElementById('toastContainer');
  if (!c) return;
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span></span>`;
  t.querySelector('span').textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.classList.add('leaving'); setTimeout(() => t.remove(), 400); }, 4000);
}
function formatClock(totalSec) {
  const s = Math.max(0, Math.floor(totalSec));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
}
function safeFilename(s) {
  return String(s || 'notes').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80) || 'notes';
}
function getQuizTimeLimitMinutes() {
  // Prefer course-configured value; fall back to constant. Never < 1.
  const raw = course && course.quiz && course.quiz.timeLimit;
  const n = Number(raw);
  if (Number.isFinite(n) && n > 0) return Math.max(1, Math.round(n));
  return QUIZ_TIME_LIMIT_MINUTES;
}

// ══════════════════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  if (typeof firebase === 'undefined') {
    renderFatal('Firebase SDK failed to load', 'Check your internet connection.');
    return;
  }
  try { if (!firebase.apps.length) firebase.initializeApp(firebaseConfig); }
  catch (e) { renderFatal('Firebase init failed', e.message); return; }

  const auth = firebase.auth();
  const db = firebase.database();
  window._auth = auth;
  window._db = db;

  try {
    if (firebase.functions) {
      const fns = firebase.app().functions();
      gradeQuizCallable = fns.httpsCallable('gradeQuiz');
    }
  } catch (e) {
    console.warn('[course] functions unavailable:', e);
  }

  auth.onAuthStateChanged(onAuthChanged);

  window.addEventListener('beforeunload', (e) => {
    const modalOpen = document.getElementById('quizModal').classList.contains('active');
    const submitting = !lastQuizResult;
    if (modalOpen && submitting && Object.keys(quizAnswers).length > 0) {
      e.preventDefault();
      e.returnValue = '';
    }
  });
});

function renderFatal(title, detail) {
  document.getElementById('playerMain').innerHTML = `
    <div class="empty-state">
      <i class="fas fa-exclamation-triangle" style="color:var(--danger);opacity:1;"></i>
      <h3>${escapeHtml(title)}</h3>
      <p>${escapeHtml(detail)}</p>
      <a href="index.html" class="ws-btn ws-btn-primary" style="margin-top:1rem;">
        <i class="fas fa-arrow-left"></i> Back to library
      </a>
    </div>`;
}

async function onAuthChanged(user) {
  if (!user) { window.location.href = '../index.html'; return; }
  currentUser = user;
  renderAccountChip(user);
  await initCourse();
}

function renderAccountChip(user) {
  const el = document.getElementById('headerAccount');
  if (!el) return;
  const name = user.displayName || user.email.split('@')[0] || 'User';
  el.innerHTML = `
    <a href="../index.html" class="ws-account-chip" title="Back to workspace">
      <div class="ws-avatar">${escapeHtml(getInitials(name))}</div>
      <span>${escapeHtml(name)}</span>
    </a>`;
}

// ══════════════════════════════════════════════════════════════
// COURSE INIT
// ══════════════════════════════════════════════════════════════
async function initCourse() {
  const params = new URLSearchParams(window.location.search);
  const courseId = params.get('id');
  if (!courseId) { renderFatal('No course specified', 'The URL is missing an ?id= parameter.'); return; }

  try {
    const snap = await window._db.ref(`learning_courses/${courseId}`).once('value');
    if (!snap.exists()) {
      renderFatal('Course not found', `We couldn't find a course with id "${courseId}".`);
      return;
    }
    course = { id: courseId, ...snap.val() };
  } catch (e) {
    renderFatal('Could not load course', e.message || 'Permission denied or network error.');
    return;
  }

  const lessonsRaw = course.lessons || {};
  lessons = Object.entries(lessonsRaw)
    .map(([id, l]) => ({ id, ...l }))
    .sort((a, b) => (a.order || 999) - (b.order || 999));

  if (lessons.length === 0) {
    document.getElementById('playerCourseInfo').innerHTML = `
      <h2>${escapeHtml(course.title || 'Untitled')}</h2><p>0 lessons</p>`;
    document.getElementById('playerMain').innerHTML = `
      <div class="empty-state">
        <i class="fas fa-book-open"></i>
        <h3>No lessons yet</h3>
        <p>This course doesn't have any published lessons.</p>
        <a href="index.html" class="ws-btn ws-btn-primary" style="margin-top:1rem;">Back to library</a>
      </div>`;
    return;
  }

  try {
    const snap = await window._db.ref(`learning_progress/${currentUser.uid}/${courseId}`).once('value');
    progress = snap.exists() ? snap.val() : null;
  } catch (e) { progress = null; }

  const infoEl = document.getElementById('playerCourseInfo');
  infoEl.innerHTML = `
    <h2>${escapeHtml(course.title || 'Untitled')}</h2>
    <p>${lessons.length} lesson${lessons.length === 1 ? '' : 's'} · ${course.duration || 0} min</p>`;

  if (!document.querySelector('.player-sidebar-actions')) {
    const row = document.createElement('div');
    row.className = 'player-sidebar-actions';
    row.innerHTML = `
      <div class="notes-menu-wrap">
        <button type="button" class="notes-menu-btn" onclick="toggleNotesMenu(this)">
          <span><i class="fas fa-download"></i> Download notes</span>
          <i class="fas fa-chevron-down chev"></i>
        </button>
        <div class="notes-menu" role="menu">
          <button type="button" onclick="downloadCourseNotesPDF(this)">
            <i class="fas fa-file-pdf"></i>
            <span>Full course — PDF<small>All ${lessons.length} lessons in one file</small></span>
          </button>
          <button type="button" onclick="downloadCourseNotes()">
            <i class="fas fa-file-lines"></i>
            <span>Full course — Markdown<small>Editable .md text</small></span>
          </button>
        </div>
      </div>`;
    infoEl.after(row);
  }

  const startIndex = (progress && typeof progress.lastLessonIndex === 'number' && progress.lastLessonIndex < lessons.length)
    ? progress.lastLessonIndex : 0;

  renderLessons();
  loadLesson(startIndex);
  addMobileSidebarToggle();
}

// ══════════════════════════════════════════════════════════════
// LOCK + RENDER
// ══════════════════════════════════════════════════════════════
function isQuizLesson(l) { return l && l.type === 'quiz'; }
function getNonQuizIndices() { return lessons.map((l, i) => isQuizLesson(l) ? -1 : i).filter(i => i >= 0); }
function areAllNonQuizLessonsComplete(completed) {
  const ids = getNonQuizIndices();
  if (ids.length === 0) return true;
  return ids.every(i => completed[i] === true || completed[String(i)] === true);
}
function isQuizLocked() {
  const completed = (progress && progress.completedLessons) || {};
  return !areAllNonQuizLessonsComplete(completed);
}

function renderLessons() {
  const el = document.getElementById('playerLessons');
  if (!el) return;
  const completed = (progress && progress.completedLessons) || {};
  const quizLocked = isQuizLocked();

  el.innerHTML = lessons.map((l, i) => {
    const isDone = completed[i] === true || completed[String(i)] === true;
    const isActive = i === activeIndex;
    const locked = isQuizLesson(l) && quizLocked;

    let icon;
    if (locked) icon = 'fa-lock';
    else if (isDone) icon = 'fa-check';
    else if (isActive) icon = 'fa-play';
    else icon = isQuizLesson(l) ? 'fa-question' : 'fa-book';

    return `
      <button type="button" class="lesson-item ${isActive ? 'active' : ''} ${isDone ? 'completed' : ''} ${locked ? 'locked' : ''}"
              onclick="loadLesson(${i})" ${locked ? 'aria-disabled="true"' : ''}>
        <span class="lesson-item-icon"><i class="fas ${icon}"></i></span>
        <span class="lesson-item-name">${escapeHtml(l.title || `Lesson ${i + 1}`)}</span>
        <span class="lesson-item-duration">${locked ? 'Locked' : (l.duration || 0) + ' min'}</span>
      </button>`;
  }).join('');
}

function loadLesson(index) {
  if (index < 0 || index >= lessons.length) return;
  const target = lessons[index];

  if (isQuizLesson(target) && isQuizLocked()) {
    showToast('Finish all lessons first to unlock the quiz', 'info');
    return;
  }

  activeIndex = index;
  renderLessons();

  const main = document.getElementById('playerMain');
  const completed = (progress && progress.completedLessons) || {};
  const isDone = completed[index] === true || completed[String(index)] === true;

  if (isQuizLesson(target)) {
    renderQuizLesson(main, target, isDone);
    if (window.innerWidth <= 900) document.body.classList.remove('sidebar-open');
    return;
  }

  let videoHtml = '';
  if (target.type === 'video') {
    if (target.videoUrl) videoHtml = `<div class="player-video">${renderVideoEmbed(target.videoUrl)}</div>`;
    else videoHtml = `<div class="player-video"><div class="player-video-placeholder"><i class="fas fa-play-circle"></i><p>Video coming soon</p></div></div>`;
  }
  const contentHtml = target.content ? `<div class="player-content">${target.content}</div>` : '';

  main.innerHTML = `
    <div class="player-lesson-header">
      <div class="player-lesson-label">Lesson ${index + 1} of ${lessons.length}</div>
      <h1>${escapeHtml(target.title || `Lesson ${index + 1}`)}</h1>
      <p>${escapeHtml(course.title || '')}</p>
    </div>
    ${videoHtml}
    ${contentHtml}
    ${(!videoHtml && !contentHtml) ? `
      <div class="empty-state" style="padding:2rem 1rem;background:#fff;border-radius:16px;border:1px solid var(--border);margin-bottom:1.6rem;">
        <i class="fas fa-file-lines" style="opacity:.4;color:var(--muted);"></i>
        <p>This lesson doesn't have content yet.</p>
      </div>` : ''}
    <div class="player-actions">
      <button type="button" class="ws-btn ws-btn-ghost" ${index === 0 ? 'disabled' : ''}
              onclick="loadLesson(${index - 1})">
        <i class="fas fa-arrow-left"></i> Previous
      </button>
      <div class="player-actions-right">
        <div class="notes-menu-wrap">
          <button type="button" class="notes-menu-btn" onclick="toggleNotesMenu(this)">
            <i class="fas fa-download"></i> Notes
            <i class="fas fa-chevron-down chev"></i>
          </button>
          <div class="notes-menu" role="menu">
            <button type="button" onclick="downloadLessonNotesPDF(this)">
              <i class="fas fa-file-pdf"></i>
              <span>PDF<small>Download this lesson</small></span>
            </button>
            <button type="button" onclick="downloadLessonNotes()">
              <i class="fas fa-file-lines"></i>
              <span>Markdown (.md)<small>Editable text notes</small></span>
            </button>
          </div>
        </div>
        <button type="button" class="ws-btn ${isDone ? 'ws-btn-ghost' : 'ws-btn-primary'}"
                onclick="markComplete(${index})">
          <i class="fas ${isDone ? 'fa-check' : 'fa-check-circle'}"></i>
          ${isDone ? 'Completed' : 'Mark complete'}
        </button>
        ${index < lessons.length - 1 ? `
          <button type="button" class="ws-btn ws-btn-ghost" onclick="loadLesson(${index + 1})">
            Next <i class="fas fa-arrow-right"></i>
          </button>` : ''}
      </div>
    </div>`;

  if (window.innerWidth <= 900) document.body.classList.remove('sidebar-open');
}

function renderQuizLesson(main, lesson, isDone) {
  const quiz = course.quiz || {};
  const questions = quiz.questions || {};
  const questionCount = Object.keys(questions).length;
  const passingScore = quiz.passingScore || 70;
  const timeLimit = getQuizTimeLimitMinutes();

  if (questionCount === 0) {
    main.innerHTML = `
      <div class="player-lesson-header">
        <div class="player-lesson-label">Lesson ${activeIndex + 1} of ${lessons.length}</div>
        <h1>${escapeHtml(lesson.title || 'Quiz')}</h1>
      </div>
      <div class="empty-state" style="background:#fff;border:1px solid var(--border);border-radius:16px;padding:3rem 2rem;">
        <i class="fas fa-exclamation-triangle"></i>
        <h3>Quiz not available yet</h3>
        <p>The quiz for this course hasn't been configured.</p>
      </div>`;
    return;
  }

  const attempts = (progress && progress.quizAttempts) || {};
  const attemptList = Object.values(attempts).sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0));
  const lastAttempt = attemptList[0];
  const bestScore = progress && progress.quizBestScore ? progress.quizBestScore : null;
  const hasPassed = progress && progress.quizPassed === true;

  const statusBlock = hasPassed ? `
    <div style="display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .9rem;background:#d1fae5;color:#065f46;border-radius:100px;font-size:.72rem;font-weight:700;font-family:var(--f-head);text-transform:uppercase;letter-spacing:.5px;margin-bottom:1rem;position:relative;z-index:1;">
      <i class="fas fa-check-circle"></i> Passed
    </div>` : (lastAttempt ? `
    <div style="display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .9rem;background:#fef3c7;color:#92400e;border-radius:100px;font-size:.72rem;font-weight:700;font-family:var(--f-head);text-transform:uppercase;letter-spacing:.5px;margin-bottom:1rem;position:relative;z-index:1;">
      <i class="fas fa-redo"></i> Last attempt: ${lastAttempt.score}%
    </div>` : '');

  main.innerHTML = `
    <div class="player-lesson-header">

function renderVideoEmbed(url) {
  if (!url) return '';
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
  if (yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen></iframe>`;
  const vm = url.match(/vimeo\.com\/(\d+)/);
  if (vm) return `<iframe src="https://player.vimeo.com/video/${vm[1]}" allowfullscreen></iframe>`;
  if (url.match(/\.(mp4|webm|ogg)(\?|$)/i)) return `<video src="${escapeHtml(url)}" controls></video>`;
  return `<div class="player-video-placeholder">
    <a href="${escapeHtml(url)}" target="_blank" rel="noopener" style="color:#fbbf24;text-decoration:none;">
      <i class="fas fa-external-link-alt"></i><p>Open video</p>
    </a>
  </div>`;
}

// MARK COMPLETE — non-quiz lessons only. Never fires cert.
// ══════════════════════════════════════════════════════════════
async function markComplete(index) {
  if (!currentUser || !course) return;
  if (isQuizLesson(lessons[index])) return;

  try {
    const ref = window._db.ref(`learning_progress/${currentUser.uid}/${course.id}`);
    const snap = await ref.once('value');
    const existing = snap.val() || {};
    const completedLessons = existing.completedLessons || {};
    completedLessons[index] = true;

    const completedCount = Object.keys(completedLessons).length;
    const progressPct = Math.min(100, Math.round((completedCount / lessons.length) * 100));

    // NOTE: we only write lesson completion + progress. completedAt and
    // quizPassed are owned by the server function.
    const updates = {
      title: course.title,
      completedLessons,
      lastLessonIndex: index,
      progress: progressPct,
      updatedAt: Date.now()
    };

    await ref.set(updates);
    progress = { ...existing, ...updates };
    renderLessons();

    showToast(`Progress saved — ${progressPct}%`, 'success');
    if (index < lessons.length - 1) setTimeout(() => loadLesson(index + 1), 500);
  } catch (e) {
    console.error('[markComplete]', e);
    showToast('Could not save progress: ' + e.message, 'error');
  }
}

// ══════════════════════════════════════════════════════════════
// QUIZ — OPEN / RENDER / TIMER / SUBMIT
// ══════════════════════════════════════════════════════════════
function openQuiz() {
  if (isQuizLocked()) { showToast('Finish all lessons first to unlock the quiz', 'info'); return; }

  const quiz = course.quiz || {};
  const questions = quiz.questions || {};
  if (Object.keys(questions).length === 0) { showToast('Quiz not available yet', 'error'); return; }

  quizAnswers = {};
  lastQuizResult = null;
  quizAttemptStart = Date.now();
  quizTimedOut = false;

  const minutes = getQuizTimeLimitMinutes();
  quizTimeLimitSec = minutes * 60;
  quizTimeRemainingSec = quizTimeLimitSec;

  document.getElementById('quizTitle').textContent = course.title + ' — Quiz';
  document.getElementById('quizSubtitle').textContent =
    `You have ${minutes} minute${minutes === 1 ? '' : 's'}. Answers are auto-submitted when time runs out.`;

  renderQuizForm();
  document.getElementById('quizOverlay').classList.add('active');
  document.getElementById('quizModal').classList.add('active');

  startQuizTimer();
}

function closeQuiz(force) {
  if (!force) {
    if (!confirm('Close the quiz? Your answers will be lost.')) return;
  }
  stopQuizTimer();
  document.getElementById('quizOverlay').classList.remove('active');
  document.getElementById('quizModal').classList.remove('active');
}

function startQuizTimer() {
  stopQuizTimer();
  const wrap = document.getElementById('quizTimer');
  const valEl = document.getElementById('quizTimerValue');

  if (quizTimeLimitSec <= 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';

  const tick = () => {
    const elapsed = Math.floor((Date.now() - quizAttemptStart) / 1000);
    quizTimeRemainingSec = Math.max(0, quizTimeLimitSec - elapsed);
    valEl.textContent = formatClock(quizTimeRemainingSec);

    wrap.classList.remove('warn', 'danger');
    const ratio = quizTimeRemainingSec / quizTimeLimitSec;
    if (quizTimeRemainingSec <= 60) wrap.classList.add('danger');
    else if (ratio <= 0.2) wrap.classList.add('warn');

    if (quizTimeRemainingSec <= 0) {
      stopQuizTimer();
      quizTimedOut = true;
      submitQuiz({ timedOut: true });
    }
  };

  tick();
  quizTimerInterval = setInterval(tick, 1000);
}
function stopQuizTimer() {
  if (quizTimerInterval) { clearInterval(quizTimerInterval); quizTimerInterval = null; }
}

function getQuizQuestionsSorted() {
  const quiz = course.quiz || {};
  const questions = quiz.questions || {};
  let list = Object.entries(questions).map(([id, q]) => ({ id, ...q }));
  list.sort((a, b) => (a.order || 999) - (b.order || 999));
  if (quiz.shuffleQuestions === true) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
  }
  return list;
}
function getChoicesSorted(q) {
  const choices = q.choices || {};
  let entries = Object.entries(choices).map(([k, v]) => ({ key: k, text: v }));
  entries.sort((a, b) => a.key.localeCompare(b.key));
  const quiz = course.quiz || {};
  if (quiz.shuffleChoices === true) {
    for (let i = entries.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [entries[i], entries[j]] = [entries[j], entries[i]];
    }
  }
  return entries;
}

function renderQuizForm() {
  const body = document.getElementById('quizBody');
  const actions = document.getElementById('quizActions');
  const progressFill = document.getElementById('quizProgressFill');
  const questions = getQuizQuestionsSorted();

  body.innerHTML = questions.map((q, i) => {
    const choices = getChoicesSorted(q);
    return `
      <div class="quiz-question" data-qid="${escapeHtml(q.id)}">
        <div class="quiz-q-num">Question ${i + 1} of ${questions.length}</div>
        <div class="quiz-q-text">${escapeHtml(q.text || 'Untitled question')}</div>
        <div class="quiz-choices">
          ${choices.map(c => `
            <button type="button" class="quiz-choice"
                    data-qid="${escapeHtml(q.id)}"
                    data-choice="${escapeHtml(c.key)}"
                    onclick="selectAnswer('${escapeHtml(q.id)}', '${escapeHtml(c.key)}')">
              <span class="quiz-choice-letter">${escapeHtml(c.key.toUpperCase())}</span>
              <span class="quiz-choice-text">${escapeHtml(c.text)}</span>
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  actions.innerHTML = `
    <button type="button" class="quiz-btn secondary" onclick="closeQuiz(false)">
      <i class="fas fa-times"></i> Cancel
    </button>
    <div class="quiz-counter" id="quizCounter">0 of ${questions.length} answered</div>
    <button type="button" class="quiz-btn primary" id="quizSubmitBtn" onclick="submitQuiz({})" disabled>
      <i class="fas fa-paper-plane"></i> Submit Quiz
    </button>
  `;

  progressFill.style.width = '0%';
}

function selectAnswer(qid, choice) {
  quizAnswers[qid] = choice;
  document.querySelectorAll(`.quiz-choice[data-qid="${qid}"]`).forEach(el => {
    el.classList.toggle('selected', el.dataset.choice === choice);
  });
  updateQuizProgress();
}
function updateQuizProgress() {
  const questions = getQuizQuestionsSorted();
  const answered = Object.keys(quizAnswers).length;
  const total = questions.length;
  const pct = total === 0 ? 0 : Math.round((answered / total) * 100);

  document.getElementById('quizProgressFill').style.width = pct + '%';
  const counter = document.getElementById('quizCounter');
  if (counter) counter.textContent = `${answered} of ${total} answered`;
  const btn = document.getElementById('quizSubmitBtn');
  if (btn) btn.disabled = answered < total;
}

// ══════════════════════════════════════════════════════════════
// SUBMIT — server grades; client only renders verdict
// ══════════════════════════════════════════════════════════════
async function submitQuiz(opts = {}) {
  const timedOut = !!opts.timedOut;
  stopQuizTimer();

  if (!gradeQuizCallable) {
    showToast('Grading service not available. Please contact support.', 'error');
    return;
  }

  const durationSec = Math.round((Date.now() - quizAttemptStart) / 1000);

  // Disable the submit button while in flight
  const submitBtn = document.getElementById('quizSubmitBtn');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Grading…'; }

  try {
    const res = await gradeQuizCallable({
      courseId: course.id,
      answers: quizAnswers,
      timedOut,
      durationSec,
      timeLimitSec: quizTimeLimitSec
    });

    const data = res && res.data ? res.data : {};
    const score = Number(data.score) || 0;
    const passed = !!data.passed;
    const perQuestion = Array.isArray(data.perQuestion) ? data.perQuestion : [];
    const certificateIssued = !!data.certificateIssued;

    // Re-sync progress from server so sidebar + launch card reflect truth
    try {
      const snap = await window._db.ref(`learning_progress/${currentUser.uid}/${course.id}`).once('value');
      progress = snap.val() || progress;
    } catch (e) {}

    lastQuizResult = { score, passed, perQuestion, certificateIssued, timedOut };
    renderQuizResult();
    renderLessons();

    if (certificateIssued) showToast('Course complete! Certificate issued.', 'success');
  } catch (e) {
    console.error('[quiz] grading failed:', e);
    const code = e && e.code ? e.code : '';
    const msg = (e && e.message) ? e.message : 'Unknown error';
    if (code === 'functions/not-found' || /not-found/i.test(msg)) {
      showToast('Grading service not deployed yet. Please contact support.', 'error');
    } else if (code === 'functions/unauthenticated') {
      showToast('Session expired — please sign in again.', 'error');
    } else {
      showToast('Could not submit quiz: ' + msg, 'error');
    }
    // Restore submit button so user can retry
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Quiz';
    }
    // Resume timer if it wasn't a timeout
    if (!timedOut) startQuizTimer();
    return;
  }
}

function renderQuizResult() {
  const body = document.getElementById('quizBody');
  const actions = document.getElementById('quizActions');
  const progressFill = document.getElementById('quizProgressFill');
  const result = lastQuizResult;
  if (!result) return;

  progressFill.style.width = '100%';
  const { score, passed, perQuestion, certificateIssued, timedOut } = result;
  const circumference = 2 * Math.PI * 60;

  let iconClass = 'fail', iconFa = 'fa-times';
  let headline = 'Not Quite';
  let blurb = `You scored ${score}%. You need ${course.quiz.passingScore || 70}% to pass. You can retake the quiz below.`;

  if (timedOut && passed) {
    iconClass = 'pass'; iconFa = 'fa-check';
    headline = "Time's up — but you passed";
    blurb = certificateIssued
      ? 'Your answers were auto-submitted when time ran out, and you passed. Certificate issued.'
      : 'Your answers were auto-submitted when time ran out, and you passed.';
  } else if (timedOut && !passed) {
    iconClass = 'timeout'; iconFa = 'fa-hourglass-end';
    headline = "Time's up";
    blurb = `Time ran out — your answers were auto-submitted at ${score}%. You need ${course.quiz.passingScore || 70}% to pass.`;
  } else if (passed) {
    iconClass = 'pass'; iconFa = 'fa-check';
    headline = 'You Passed!';
    blurb = certificateIssued
      ? 'Your certificate has been issued. You can view it from the Certificates page.'
      : 'You passed. Nice work.';
  }

  // Build per-question review from server flags only — no answers, no explanations
  const questionsSorted = getQuizQuestionsSorted();
  const byId = new Map(perQuestion.map(p => [String(p.id), !!p.correct]));

  const reviewRows = questionsSorted.map((q, i) => {
    const ok = byId.get(String(q.id));
    const state = ok === true ? 'correct' : 'wrong';
    const icon = ok === true ? 'fa-check' : 'fa-times';
    const note = ok === true ? 'Correct' : 'Incorrect';
    return `
      <div class="quiz-review-item ${state}">
        <div class="quiz-review-status"><i class="fas ${icon}"></i></div>
        <div class="quiz-review-content">
          <div class="quiz-review-q">${i + 1}. ${escapeHtml(q.text || '')}</div>
          <div class="quiz-review-note">${note}</div>
        </div>
      </div>`;
  }).join('');

  body.innerHTML = `
    <div class="quiz-result">
      <div class="quiz-result-icon ${iconClass}">
        <i class="fas ${iconFa}"></i>
      </div>
      <h2>${headline}</h2>
      <p>${blurb}</p>

      <div class="quiz-score-ring">
        <svg width="140" height="140">
          <circle class="track" cx="70" cy="70" r="60"></circle>
          <circle class="fill ${iconClass}" cx="70" cy="70" r="60"
                  stroke-dasharray="${circumference}"
                  stroke-dashoffset="${circumference}"></circle>
        </svg>
        <div class="label">
          <div class="quiz-score-value">${score}%</div>
          <div class="quiz-score-max">Score</div>
        </div>
      </div>

      ${perQuestion.length > 0 ? `
      <div class="quiz-review">
        <div class="quiz-review-title">Answer Summary</div>
        ${reviewRows}
      </div>` : ''}
    </div>
  `;

  setTimeout(() => {
    const fill = body.querySelector('.quiz-score-ring .fill');
    if (fill) fill.style.strokeDashoffset = String(circumference - (circumference * score / 100));
  }, 100);

  actions.innerHTML = `
    <button type="button" class="quiz-btn secondary" onclick="closeQuiz(true)">
      <i class="fas fa-times"></i> Close
    </button>
    <button type="button" class="quiz-btn primary" onclick="retryQuiz()">
      <i class="fas fa-redo"></i> ${passed ? 'Retake Quiz' : 'Try Again'}
    </button>
  `;
}

function retryQuiz() {
  quizAnswers = {};
  lastQuizResult = null;
  quizAttemptStart = Date.now();
  quizTimedOut = false;
  quizTimeRemainingSec = quizTimeLimitSec;
  renderQuizForm();
  startQuizTimer();
}

// NOTES DOWNLOAD — Markdown + PDF (quiz lessons excluded)
// ══════════════════════════════════════════════════════════════
function htmlToMarkdown(html) {
  if (!html) return '';
  let s = String(html).replace(/\r\n?/g, '\n');
  s = s.replace(/<pre[^>]*><code[^>]*>([\s\S]*?)<\/code><\/pre>/gi,
    (_, code) => '\n```\n' + decodeEntities(stripTags(code)).trim() + '\n```\n');
  s = s.replace(/<pre[^>]*>([\s\S]*?)<\/pre>/gi,
    (_, code) => '\n```\n' + decodeEntities(stripTags(code)).trim() + '\n```\n');
  s = s.replace(/<h1[^>]*>([\s\S]*?)<\/h1>/gi, (_, t) => '\n# ' + inline(t).trim() + '\n');
  s = s.replace(/<h2[^>]*>([\s\S]*?)<\/h2>/gi, (_, t) => '\n## ' + inline(t).trim() + '\n');
  s = s.replace(/<h3[^>]*>([\s\S]*?)<\/h3>/gi, (_, t) => '\n### ' + inline(t).trim() + '\n');
  s = s.replace(/<h4[^>]*>([\s\S]*?)<\/h4>/gi, (_, t) => '\n#### ' + inline(t).trim() + '\n');
  s = s.replace(/<blockquote[^>]*>([\s\S]*?)<\/blockquote>/gi, (_, t) =>
    '\n' + inline(t).trim().split('\n').map(l => '> ' + l).join('\n') + '\n');
  s = s.replace(/<ol[^>]*>([\s\S]*?)<\/ol>/gi, (_, inner) => {
    let i = 1;
    return '\n' + inner.replace(/<li[^>]*>([\s\S]*?)<\/li>/gi, (_, t) => `${i++}. ${inline(t).trim()}\n`) + '\n';
  });
  s = s.replace(/<ul[^>]*>([\s\S]*?)<\/ul>/gi, (_, inner) =>
    '\n' + inner.replace(/<li[^>]*>([\s\S]*?)<\/li>/gi, (_, t) => `- ${inline(t).trim()}\n`) + '\n');
  s = s.replace(/<p[^>]*>([\s\S]*?)<\/p>/gi, (_, t) => '\n' + inline(t).trim() + '\n');
  s = s.replace(/<br\s*\/?>/gi, '\n');
  s = s.replace(/<hr\s*\/?>/gi, '\n---\n');
  s = stripTags(s);
  s = s.replace(/\n{3,}/g, '\n\n').trim();
  return s;
}
function stripTags(s) { return String(s).replace(/<[^>]+>/g, ''); }
function decodeEntities(s) {
  return String(s)
    .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'")
    .replace(/&#x27;/g, "'").replace(/&hellip;/g, '…')
    .replace(/&mdash;/g, '—').replace(/&ndash;/g, '–');
}
function inline(s) {
  s = String(s);
  s = s.replace(/<strong[^>]*>([\s\S]*?)<\/strong>/gi, '**$1**');
  s = s.replace(/<b[^>]*>([\s\S]*?)<\/b>/gi, '**$1**');
  s = s.replace(/<em[^>]*>([\s\S]*?)<\/em>/gi, '*$1*');
  s = s.replace(/<i[^>]*>([\s\S]*?)<\/i>/gi, '*$1*');
  s = s.replace(/<code[^>]*>([\s\S]*?)<\/code>/gi, '`$1`');
  s = s.replace(/<a[^>]*href="([^"]*)"[^>]*>([\s\S]*?)<\/a>/gi, '[$2]($1)');
  s = stripTags(s);
  return decodeEntities(s);
}

function buildLessonMarkdown(lesson, index) {
  const header = [
    `# ${lesson.title || `Lesson ${index + 1}`}`, '',
    `**Course:** ${course.title || 'Course'}`,
    `**Lesson:** ${index + 1} of ${lessons.length}`,
    lesson.duration ? `**Duration:** ${lesson.duration} min` : '',
    `**Downloaded:** ${new Date().toLocaleString()}`, '',
    '---', ''
  ].filter(Boolean).join('\n');

  let body = '';
  if (lesson.type === 'video' && lesson.videoUrl) body += `> 🎥 **Video lesson** — ${lesson.videoUrl}\n\n`;
  if (lesson.type === 'quiz') body += '_Quiz lessons are not downloadable._\n';
  else if (lesson.content) body += htmlToMarkdown(lesson.content);
  else if (!lesson.videoUrl) body += '_No content for this lesson yet._\n';

  const footer = ['', '---', '', `_© ${new Date().getFullYear()} KazInni Learning — Teleio Savour._`].join('\n');
  return header + '\n' + body + footer;
}
function buildCourseMarkdown() {
  const parts = [];
  parts.push([
    `# ${course.title || 'Course'}`, '',
    course.desc ? `> ${course.desc}\n` : '',
    `- **Lessons:** ${lessons.length}`,
    course.duration ? `- **Total duration:** ${course.duration} min` : '',
    course.level ? `- **Level:** ${course.level}` : '',
    course.category ? `- **Category:** ${course.category}` : '',
    `- **Downloaded:** ${new Date().toLocaleString()}`, '',
    '---', ''
  ].filter(Boolean).join('\n'));

  lessons.forEach((l, i) => {
    if (l.type === 'quiz') return;
    parts.push(buildLessonMarkdown(l, i));
    parts.push('\n\n---\n\n');
  });
  return parts.join('\n');
}
function downloadBlob(filename, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 200);
}
function downloadLessonNotes() {
  const lesson = lessons[activeIndex];
  if (!lesson || lesson.type === 'quiz') { showToast('Quiz lessons cannot be downloaded', 'info'); return; }
  const md = buildLessonMarkdown(lesson, activeIndex);
  const base = safeFilename(`${course.title}-lesson-${activeIndex + 1}-${lesson.title || 'notes'}`);
  downloadBlob(`${base}.md`, md);
  showToast('Lesson notes downloaded (.md)', 'success');
  closeAllNotesMenus();
}
function downloadCourseNotes() {
  if (!course || lessons.length === 0) return;
  const md = buildCourseMarkdown();
  const base = safeFilename(`${course.title}-full-notes`);
  downloadBlob(`${base}.md`, md);
  showToast('Full course notes downloaded (.md)', 'success');
  closeAllNotesMenus();
}

function buildPdfHtmlForLesson(lesson, index) {
  let inner = '';
  if (lesson.type === 'video' && lesson.videoUrl) {
    inner = `<p><em>Video lesson: <a href="${escapeHtml(lesson.videoUrl)}">${escapeHtml(lesson.videoUrl)}</a></em></p>${lesson.content || ''}`;
  } else {
    inner = lesson.content || '<p><em>No content for this lesson yet.</em></p>';
  }
  return `<h2 style="font-size:1.15rem;margin:0 0 .5rem;">${escapeHtml(lesson.title || ('Lesson ' + (index + 1)))}</h2>${inner}`;
}
function buildPdfHtmlForCourse() {
  return lessons.map((l, i) => l.type === 'quiz' ? '' : `<div class="pdf-lesson">${buildPdfHtmlForLesson(l, i)}</div>`).filter(Boolean).join('');
}

async function generatePDF({ filename, title, subtitle, bodyHtml }) {
  if (typeof window.jspdf === 'undefined' || typeof html2canvas === 'undefined') {
    showToast('PDF library failed to load. Check your connection.', 'error'); return;
  }
  const { jsPDF } = window.jspdf;
  const target = document.getElementById('pdfRender');

  target.innerHTML = `
    <div style="font-family:'Satoshi','Cabinet Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;color:#0f0f1e;">
      <header style="border-bottom:2px solid #ca8a04;padding-bottom:14px;margin-bottom:22px;">
        <div style="font-family:'Clash Display','Cabinet Grotesk',sans-serif;font-weight:700;font-size:11px;color:#a16207;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px;">KazInni Learning</div>
        <h1 style="font-family:'Clash Display','Cabinet Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;margin:0 0 6px;color:#0f0f1e;">${escapeHtml(title)}</h1>
        <div style="font-size:12px;color:#6b7280;">${escapeHtml(subtitle)}</div>
      </header>
      <style>
        #pdfRender h2{font-family:'Clash Display','Cabinet Grotesk',sans-serif;font-size:17px;margin:18px 0 8px;color:#0f0f1e;font-weight:700;}
        #pdfRender h3{font-size:14px;margin:14px 0 6px;color:#0f0f1e;font-weight:700;}
        #pdfRender p{margin:0 0 10px;font-size:13px;line-height:1.6;color:#2a2a3a;}
        #pdfRender ul,#pdfRender ol{margin:0 0 10px 20px;padding:0;font-size:13px;line-height:1.6;color:#2a2a3a;}
        #pdfRender li{margin-bottom:4px;}
        #pdfRender code{background:#f4f3f1;padding:1px 5px;border-radius:4px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
        #pdfRender pre{background:#f4f3f1;padding:12px;border-radius:8px;overflow:auto;font-size:12px;}
        #pdfRender blockquote{border-left:3px solid #ca8a04;padding-left:12px;margin:10px 0;color:#6b7280;font-style:italic;}
        #pdfRender a{color:#a16207;text-decoration:none;word-break:break-all;}
        #pdfRender strong{color:#0f0f1e;}
        #pdfRender .pdf-lesson{padding:18px 0;border-bottom:1px dashed #e9ecef;page-break-inside:avoid;}
        #pdfRender .pdf-lesson:last-child{border-bottom:none;}
        #pdfRender .pdf-footer{margin-top:24px;padding-top:14px;border-top:1px solid #e9ecef;font-size:11px;color:#6b7280;text-align:center;}
      </style>
      <main>${bodyHtml}</main>
      <div class="pdf-footer">
        © ${new Date().getFullYear()} KazInni Learning · Teleio Savour — Downloaded ${escapeHtml(new Date().toLocaleString())}
      </div>
    </div>`;

  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  const canvas = await html2canvas(target, {
    scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false,
    windowWidth: target.scrollWidth, windowHeight: target.scrollHeight
  });

  const pdf = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'portrait' });
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const margin = 32;
  const usableW = pageW - margin * 2;
  const imgW = usableW;
  const pxPerPt = canvas.width / imgW;
  const pageContentHpt = pageH - margin * 2;
  const pageContentHpx = pageContentHpt * pxPerPt;

  let renderedPx = 0, pageIndex = 0;
  while (renderedPx < canvas.height) {
    const sliceHpx = Math.min(pageContentHpx, canvas.height - renderedPx);
    const slice = document.createElement('canvas');
    slice.width = canvas.width;
    slice.height = sliceHpx;
    const ctx = slice.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, slice.width, slice.height);
    ctx.drawImage(canvas, 0, renderedPx, canvas.width, sliceHpx, 0, 0, canvas.width, sliceHpx);
    const sliceImg = slice.toDataURL('image/jpeg', 0.92);
    const sliceHpt = (sliceHpx * imgW) / canvas.width;
    if (pageIndex > 0) pdf.addPage();
    pdf.addImage(sliceImg, 'JPEG', margin, margin, imgW, sliceHpt, undefined, 'FAST');
    renderedPx += sliceHpx; pageIndex++;
  }
  pdf.save(filename);
  target.innerHTML = '';
}

async function downloadLessonNotesPDF(btn) {
  const lesson = lessons[activeIndex];
  if (!lesson || lesson.type === 'quiz') { showToast('Quiz lessons cannot be downloaded', 'info'); return; }
  setBtnLoading(btn, true);
  try {
    const title = lesson.title || `Lesson ${activeIndex + 1}`;
    const subtitle = `${course.title || ''} — Lesson ${activeIndex + 1} of ${lessons.length}${lesson.duration ? ' · ' + lesson.duration + ' min' : ''}`;
    const bodyHtml = buildPdfHtmlForLesson(lesson, activeIndex);
    const filename = `${safeFilename(`${course.title}-lesson-${activeIndex + 1}-${lesson.title || 'notes'}`)}.pdf`;
    await generatePDF({ filename, title, subtitle, bodyHtml });
    showToast('Lesson notes downloaded (PDF)', 'success');
    closeAllNotesMenus();
  } catch (e) {
    console.error('[pdf]', e);
    showToast('Could not generate PDF: ' + e.message, 'error');
  } finally { setBtnLoading(btn, false); }
}
async function downloadCourseNotesPDF(btn) {
  if (!course || lessons.length === 0) return;
  setBtnLoading(btn, true);
  try {
    const title = course.title || 'Course';
    const subtitle = `${lessons.length} lessons${course.duration ? ' · ' + course.duration + ' min' : ''}${course.level ? ' · ' + course.level : ''}`;
    const bodyHtml = buildPdfHtmlForCourse();
    const filename = `${safeFilename(`${course.title}-full-notes`)}.pdf`;
    await generatePDF({ filename, title, subtitle, bodyHtml });
    showToast('Full course notes downloaded (PDF)', 'success');
    closeAllNotesMenus();
  } catch (e) {
    console.error('[pdf]', e);
    showToast('Could not generate PDF: ' + e.message, 'error');
  } finally { setBtnLoading(btn, false); }
}
function setBtnLoading(btn, loading) {
  if (!btn) return;
  if (loading) {
    btn.disabled = true;
    btn.dataset.orig = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i><span>Generating…</span>';
  } else {
    btn.disabled = false;
    if (btn.dataset.orig) { btn.innerHTML = btn.dataset.orig; delete btn.dataset.orig; }
  }
}
function toggleNotesMenu(btn) {
  const wrap = btn.closest('.notes-menu-wrap');
  const wasOpen = wrap.classList.contains('open');
  closeAllNotesMenus();
  if (!wasOpen) wrap.classList.add('open');
}
function closeAllNotesMenus() {
  document.querySelectorAll('.notes-menu-wrap.open').forEach(w => w.classList.remove('open'));
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.notes-menu-wrap')) closeAllNotesMenus();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeAllNotesMenus();
});
</script>
